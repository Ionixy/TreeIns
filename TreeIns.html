<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>GoalTree</title>

<!-- PWA: lets "Add to Home Screen" install this as a standalone app on iOS/Android -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<!-- iOS Safari ignores the manifest for standalone/icon behavior, needs these explicitly -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GoalTree">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<style>
  /* ===========================================================
     Design language: iOS / Apple HIG.
     Everything is driven by the semantic tokens below — component
     rules must never hardcode a colour, or dark mode breaks.
     Names follow Apple's own vocabulary (label / fill / separator /
     grouped background / tint) so it stays obvious which token a
     new piece of UI should reach for.
     =========================================================== */
  :root{
    color-scheme:light;
    --bg:#F2F2F7;                      /* systemGroupedBackground — the page */
    --bg-elev:#FFFFFF;                 /* cards, rows, sheets */
    --fill:rgba(120,120,128,.12);      /* tracks, chips, plain buttons */
    --fill-strong:rgba(120,120,128,.20);
    --label:#000000;
    --label-2:rgba(60,60,67,.60);
    --label-3:rgba(60,60,67,.30);
    --separator:rgba(60,60,67,.20);    /* hairlines are .5px, not 1px */
    --tint:#34C759;                    /* systemGreen — fills, switches, selection */
    --tint-text:#248A3D;               /* darker green: readable as text/icon on light */
    --tint-soft:rgba(52,199,89,.14);
    --orange:#FF9500;
    --orange-soft:rgba(255,149,0,.15);
    --red:#FF3B30;
    --bar-bg:rgba(242,242,247,.78);    /* translucent nav + tab bars */
    --sheet-bg:#FFFFFF;
    --shadow:0 1px 2px rgba(0,0,0,.05), 0 8px 24px rgba(0,0,0,.06);
    --shadow-lift:0 12px 44px rgba(0,0,0,.18);
    --grid-dot:rgba(60,60,67,.13);
    --trunk:#8A6B3F;
    /* Safe areas. In a browser and in an iOS standalone PWA these come from env().
       Android WebView reports 0 for the status/gesture bars (env() only ever covers a
       display cutout there), so the APK wrapper overwrites these four properties inline
       on <html> with the real window insets — an inline custom property beats this rule,
       so the same CSS works in both places without a branch. */
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
    --r-card:18px; --r-ctl:12px; --r-small:10px;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    /* ui-rounded resolves to SF Pro Rounded on Apple platforms — used for numerals */
    --font-round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --font-mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  html[data-theme="dark"]{
    color-scheme:dark;
    --bg:#000000;
    --bg-elev:#1C1C1E;
    --fill:rgba(120,120,128,.24);
    --fill-strong:rgba(120,120,128,.36);
    --label:#FFFFFF;
    --label-2:rgba(235,235,245,.60);
    --label-3:rgba(235,235,245,.30);
    --separator:rgba(84,84,88,.65);
    --tint:#30D158;
    --tint-text:#30D158;
    --tint-soft:rgba(48,209,88,.18);
    --orange:#FF9F0A;
    --orange-soft:rgba(255,159,10,.20);
    --red:#FF453A;
    --bar-bg:rgba(20,20,22,.80);
    --sheet-bg:#1C1C1E;
    --shadow:none;                     /* dark UI separates by elevation, not shadow */
    --shadow-lift:0 12px 44px rgba(0,0,0,.6);
    --grid-dot:rgba(235,235,245,.12);
    --trunk:#A98757;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--label); font-family:var(--font);
    min-height:100vh; min-height:100dvh; font-size:17px; line-height:1.4; letter-spacing:-.01em;
    -webkit-text-size-adjust:100%; -webkit-font-smoothing:antialiased;
  }
  /* One shared press feedback: everything tappable dips slightly, the way a
     UIKit control does, instead of each component inventing its own hover. */
  button, .card, .theme-chip, .type-chip, .color-chip, .picker-row, .switch, .streak-pill{
    transition:transform .12s ease, background-color .18s ease, opacity .18s ease;
  }
  button:active, .card:active, .theme-chip:active, .type-chip:active, .streak-pill:active{transform:scale(.97);}
  .card:active{transform:scale(.985);}

  /* No top padding: the sticky bar has to start at y=0 so its own (blurred) background
     is what sits behind the status bar. The bar pays the top inset itself. */
  #app{max-width:460px; margin:0 auto; min-height:100vh; min-height:100dvh; position:relative; z-index:2;
    padding:0 calc(16px + var(--safe-r)) calc(96px + var(--safe-b)) calc(16px + var(--safe-l));
    display:flex; flex-direction:column;}
  /* A full-height column so a view can claim the leftover space instead of guessing at it
     with a vh fraction — that is what lets the tree canvas end exactly above the tab bar
     on any screen, whatever the header above it wraps to. #app's bottom padding is what
     reserves the tab bar's own room, so this stops short of it. The fixed tab bar and the
     overlays are position:fixed, so they never take part in this column. */
  #app > .content{flex:1 1 auto; min-height:0; display:flex; flex-direction:column;}

  /* ---------- top bar ---------- */
  /* Translucent + blurred like a UINavigationBar, with a hairline underneath.
     The negative margins undo #app's horizontal padding so the bar spans the full width;
     they have to include the same safe insets #app added, or the bar stops short of the
     screen edge on a device with a cutout. */
  .topbar{display:flex;align-items:center;justify-content:space-between;
    margin:0 calc(-16px - var(--safe-r)) 14px calc(-16px - var(--safe-l));
    padding:calc(10px + var(--safe-t)) calc(16px + var(--safe-r)) 10px calc(16px + var(--safe-l));
    position:sticky;top:0;z-index:5;background:var(--bar-bg);
    -webkit-backdrop-filter:saturate(180%) blur(20px); backdrop-filter:saturate(180%) blur(20px);
    box-shadow:0 .5px 0 var(--separator);}
  .brand{display:flex;align-items:center;gap:8px;}
  .brand-mark{width:28px;height:28px;flex:none;}
  .brand-mark path{fill:var(--tint-text);}
  .brand-mark rect{fill:var(--trunk);}
  .brand h1{font-size:24px;margin:0;letter-spacing:-.022em;font-weight:700;color:var(--label);}
  .topbar-right{display:flex;align-items:center;gap:10px;}
  .icon-btn{background:var(--fill);border:none;border-radius:999px;width:34px;height:34px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--tint-text);padding:0;}
  .icon-btn svg{width:20px;height:20px;}
  .streak-pill{display:flex;align-items:center;gap:5px;background:var(--fill);border:none;
    border-radius:999px;padding:4px 12px 4px 5px;cursor:pointer;}
  .streak-pill .ring{width:26px;height:26px;}
  .streak-pill .num{font-family:var(--font-round);font-size:16px;font-weight:600;color:var(--label);
    font-variant-numeric:tabular-nums;}

  /* ---------- tab bar ---------- */
  /* Edge-to-edge translucent bar with a hairline on top — the standard
     UITabBar — rather than a floating island. */
  nav.tabs{position:fixed; left:0; right:0; bottom:0; display:flex; justify-content:center; z-index:20;
    background:var(--bar-bg); -webkit-backdrop-filter:saturate(180%) blur(20px);
    backdrop-filter:saturate(180%) blur(20px); box-shadow:0 -.5px 0 var(--separator);
    padding-bottom:var(--safe-b); padding-left:var(--safe-l); padding-right:var(--safe-r);}
  nav.tabs .inner{max-width:460px; width:100%; display:flex; padding:6px 8px 4px;}
  nav.tabs button{flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:4px 4px 6px; cursor:pointer; color:var(--label-2); font-family:var(--font);}
  nav.tabs button .ic{display:flex; align-items:center; justify-content:center; height:26px;}
  nav.tabs button .ic svg{width:25px; height:25px;}
  nav.tabs button .t{font-size:10.5px; letter-spacing:0; font-weight:500;}
  nav.tabs button.active{color:var(--tint-text);}
  nav.tabs button.active .ic svg{stroke-width:2.3;}
  nav.tabs button:active{transform:none; opacity:.5;}

  /* ---------- home / cards ---------- */
  .list{display:flex; flex-direction:column; gap:12px;}
  .card{background:var(--bg-elev); border:none; border-radius:var(--r-card); padding:14px;
    box-shadow:var(--shadow); position:relative; display:flex; gap:12px; align-items:flex-start; cursor:pointer;}
  .card .accent{width:4px; align-self:stretch; border-radius:2px; flex:none;}
  .card .body{flex:1; min-width:0;}
  .card .row1{display:flex; align-items:center; gap:10px;}
  /* min-width:0 is what actually keeps long text inside the card: a flex item defaults to
     min-width:auto, i.e. it refuses to shrink below its longest unbreakable run, so the
     goal line pushed straight through the card's right edge instead of wrapping. */
  .card .row1 .titles{flex:1; min-width:0;}
  .card .stage-emoji{font-size:26px; flex:none; line-height:1;}
  .card .stage-emoji.glow{filter:drop-shadow(0 0 7px var(--tint));}
  .card h3{margin:0; font-size:17px; font-weight:600; letter-spacing:-.02em; color:var(--label);
    line-height:1.25; overflow-wrap:anywhere;}
  /* Room for the absolutely-positioned ✕, which only exists on deletable trees. */
  .card.has-del h3{padding-right:22px;}
  /* Wraps rather than ellipsising, but capped at two lines so one long goal can't make a
     card three times the height of its neighbours. */
  .card p.goal{margin:1px 0 0; font-size:13px; color:var(--label-2); line-height:1.3;
    overflow:hidden; overflow-wrap:anywhere;
    display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2;}
  .card .meta-row{display:flex; justify-content:space-between; align-items:center; margin-top:10px;
    font-size:13px; color:var(--label-2); font-variant-numeric:tabular-nums;}
  .card .bar{height:6px; background:var(--fill); border-radius:3px; overflow:hidden; margin-top:6px;}
  .card .bar i{display:block; height:100%; border-radius:3px;}
  .card .del{position:absolute; top:8px; right:8px; background:none; border:none; color:var(--label-3);
    font-size:15px; cursor:pointer; padding:6px; line-height:1;}
  .card .del:hover{color:var(--red);}
  .add-card{display:flex; align-items:center; justify-content:center; gap:8px; padding:16px;
    color:var(--tint-text); font-size:16px; font-weight:500;}
  .add-card .plus{display:flex; align-items:center; justify-content:center; width:24px; height:24px;
    border-radius:999px; background:var(--tint-soft); color:var(--tint-text); font-size:19px; line-height:1;
    padding-bottom:2px;}

  /* ---------- tree view ---------- */
  .back-btn{font-size:17px; color:var(--tint-text); background:none; border:none; cursor:pointer;
    padding:6px 0; display:flex; align-items:center; gap:3px; font-family:var(--font); letter-spacing:-.01em;}
  .back-btn .chev{font-size:22px; line-height:1; margin-top:-2px;}
  /* Wraps: a long tree name pushes the two pills onto their own line instead of
     shoving them off the right edge of the screen. */
  .tree-title-block{display:flex; align-items:center; flex-wrap:wrap; gap:8px 10px; margin:6px 0 2px;}
  .tree-title-block .stage-emoji{font-size:30px; line-height:1;}
  .tree-title-block h2{margin:0; font-size:26px; font-weight:700; letter-spacing:-.024em; color:var(--label);
    flex:1 1 auto; min-width:0;}
  .tree-goal-line{font-size:14px; color:var(--label-2); margin:0 0 14px; line-height:1.35;}

  /* The dot grid lives on the viewport, not on .tree: .tree is only as big as the tree's
     bounding box, so painting the grid there made its edge visible as soon as you panned.
     The viewport is always fully covered, and applyTreeZoom() drives background-size /
     -position so the lattice pans and scales in lockstep with the canvas. */
  /* Deliberately frameless and full-bleed: a bordered box made the canvas read as a small
     window onto the tree, when it is meant to be open space. It escapes #app's padding
     (safe insets included, same trick as the topbar) so it runs to both screen edges. */
  .tree-scroll{overflow:hidden; position:relative; flex:1 1 auto; min-height:340px;
    margin:0 calc(-16px - var(--safe-r)) 0 calc(-16px - var(--safe-l));
    touch-action:none; -webkit-user-select:none; user-select:none;
    background-image:radial-gradient(circle, var(--grid-dot) 1.5px, transparent 1.5px);
    background-size:26px 26px;}
  /* The only two edges left. They are feathered rather than drawn: a strip of the page
     background fading to transparent, so nodes and the dot grid dissolve into the page
     instead of being sliced off by a hard line. Painted over the canvas, under the zoom
     stack (z-index 10), and transparent to pointers so panning still starts anywhere. */
  .tree-scroll::before, .tree-scroll::after{content:''; position:absolute; left:0; right:0;
    height:34px; pointer-events:none; z-index:5;}
  .tree-scroll::before{top:0; background:linear-gradient(var(--bg) 15%, transparent);}
  .tree-scroll::after{bottom:0; background:linear-gradient(transparent, var(--bg) 85%);}
  /* One grouped capsule with hairline dividers, like the zoom stack on Apple Maps. */
  /* Kept on #app's gutter, not on the screen edge, now that the canvas is full-bleed. */
  .tree-zoom-controls{position:absolute; right:calc(16px + var(--safe-r)); bottom:16px; z-index:10;
    display:flex; flex-direction:column;
    border-radius:var(--r-ctl); overflow:hidden; background:var(--bar-bg);
    -webkit-backdrop-filter:blur(20px) saturate(180%); backdrop-filter:blur(20px) saturate(180%);
    box-shadow:0 0 0 .5px var(--separator), 0 4px 14px rgba(0,0,0,.10);}
  .zoom-btn{width:38px; height:38px; border:none; background:none; color:var(--tint-text);
    font-size:19px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center;
    font-family:var(--font); font-weight:400;}
  .zoom-btn + .zoom-btn{box-shadow:inset 0 .5px 0 var(--separator);}
  .zoom-btn:active{background:var(--fill); transform:none;}
  /* absolute-position layout grid: node coordinates come from computeTreeLayout(),
     not from DOM flow, so alignment can't drift with content width/height. */
  .tree{transform-origin:top center; position:relative; margin:0 auto;}
  /* The wrapper is absolutely positioned by computeTreeLayout(), so anything stacked
     inside it (card + an open add-branch panel) can grow downwards without shifting a
     single other node — the panel gets its exact place under the card for free, with no
     DOM measuring and no second set of coordinates to keep in sync. */
  .node-pos{position:absolute; display:flex; flex-direction:column; align-items:center; gap:8px; z-index:1;}
  .node-draggable{cursor:grab; touch-action:none;}
  .node-draggable.dragging{cursor:grabbing; z-index:10; opacity:.9;}
  .node-draggable.dragging .node-card{box-shadow:var(--shadow-lift); transform:scale(1.03);}
  /* Only one panel is open at a time, so lifting just that node above its neighbours is
     enough. Re-flowing the row instead would shove every node below it down the screen
     the moment you tap +, moving the very card you're working on. */
  .node-pos.has-panel{z-index:6;}
  .tree-lines{position:absolute; inset:0; z-index:0; pointer-events:none; overflow:visible;}
  .tree-lines path{stroke:var(--label-3); stroke-width:2; fill:none; stroke-linecap:round;}

  /* Card metrics are load-bearing: TREE_CARD_MAX_H in the script assumes this padding,
     these font sizes and both line clamps. Changing them means re-checking that constant. */
  .node-card{display:flex; flex-direction:column; align-items:center; gap:5px; background:var(--bg-elev);
    border:.5px solid var(--separator); border-radius:14px; padding:10px 12px; width:160px;
    box-shadow:var(--shadow); position:relative; text-align:center;
    transition:box-shadow .15s ease, transform .15s ease;}
  .node-card.root{color:#FFFFFF; border:none;}
  .node-card.task.done{background:var(--tint-soft); border-color:transparent;}

  /* Both text blocks are line-clamped: an unbounded title or description would make cards
     wildly different heights, which breaks the row rhythm and the edge anchors. */
  .node-title{font-size:14px; line-height:1.3; font-weight:600; letter-spacing:-.01em; color:var(--label);
    overflow:hidden; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow-wrap:anywhere;}
  .node-card.root .node-title{font-size:15px; color:#FFFFFF;}
  .node-desc{font-size:11.5px; line-height:1.35; color:var(--label-2); overflow:hidden;
    display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:3; overflow-wrap:anywhere;}
  .node-card.root .node-desc{color:rgba(255,255,255,.8);}
  .node-progress{font-family:var(--font-round); font-weight:600; font-size:11px; color:var(--label-2);
    font-variant-numeric:tabular-nums;}
  .node-card.root .node-progress{color:rgba(255,255,255,.8);}

  .node-toggle-row{display:flex; justify-content:center;}
  .leaf-toggle{width:34px; height:34px; border-radius:50%; border:none; background:var(--fill);
    font-size:17px; display:flex; align-items:center; justify-content:center; cursor:pointer; flex:none;}
  .leaf-toggle.bloom{background:var(--tint); }

  /* Icon row: three 30px hit targets + gaps fit inside the 160px card on one line. */
  .node-actions{display:flex; gap:6px; justify-content:center; flex-wrap:nowrap;}
  .icon-act{width:30px; height:30px; flex:none; border:none; border-radius:9px; background:var(--fill);
    color:var(--label-2); font-size:14px; line-height:1; display:flex; align-items:center;
    justify-content:center; cursor:pointer; padding:0;}
  .icon-act svg{width:16px; height:16px;}
  .icon-act:focus-visible{outline:2px solid var(--tint); outline-offset:1px;}
  .node-card.root .icon-act{background:rgba(255,255,255,.22); color:#fff;}
  /* armed delete: one more press on the same trash confirms, Esc backs out */
  .icon-act.danger-armed{background:var(--red); color:#fff;}

  /* Sits under the card as its own block: never inflates the card, always travels with
     the node because it lives in the same wrapper inside #tree-canvas. */
  .add-panel{display:flex; gap:6px; align-items:center; background:var(--bg-elev);
    border-radius:14px; padding:8px; width:160px; box-shadow:var(--shadow-lift);}
  .add-panel input{flex:1; min-width:0; font-family:inherit; font-size:16px; /* <16px makes iOS zoom on focus */
    border:none; border-radius:9px; padding:7px 9px; background:var(--fill); color:var(--label);}
  .add-panel input:focus{outline:none; box-shadow:0 0 0 3px var(--tint-soft);}
  .add-panel button{flex:none; width:32px; height:32px; border:none; border-radius:9px; background:var(--tint);
    color:#fff; font-size:16px; line-height:1; cursor:pointer;}

  /* ---------- stats ---------- */
  .stats-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .stat-tile{background:var(--bg-elev); border:none; border-radius:var(--r-card); padding:16px; box-shadow:var(--shadow);}
  .stat-tile .val{font-family:var(--font-round); font-size:28px; letter-spacing:-.02em; color:var(--label);
    font-weight:600; font-variant-numeric:tabular-nums;}
  .stat-tile .lbl{font-size:13px; color:var(--label-2); margin-top:3px; line-height:1.25;}
  .stat-tile.flame .val{color:var(--orange);}
  .stat-tile.ring-tile{grid-column:1/-1; display:flex; align-items:center; gap:16px;}
  .stat-tile.ring-tile .ring-big{width:64px; height:64px; flex:none;}
  .ring-big text{font-family:var(--font-round); font-weight:600; fill:var(--label);}
  .season-badge{margin-top:12px; display:flex; align-items:center; gap:12px; background:var(--bg-elev);
    border:none; border-radius:var(--r-card); padding:14px 16px; box-shadow:var(--shadow);}
  .season-badge .e{font-size:28px;}
  .season-badge .n{font-size:13px; color:var(--label-2);}
  .season-badge .n b{display:block; color:var(--label); font-size:17px; font-weight:600; letter-spacing:-.02em;}
  .philosophy{margin-top:16px; padding:18px 20px; border-radius:var(--r-card); background:var(--tint-soft);
    color:var(--tint-text); font-size:15px; text-align:center; line-height:1.5;}

  /* ---------- settings screen ---------- */
  /* Inset grouped table view: one rounded card, rows separated by hairlines that
     start at the content's left edge rather than running the full width. */
  .settings-group{background:var(--bg-elev); border:none; border-radius:var(--r-card); padding:0; margin-bottom:22px;
    box-shadow:var(--shadow); overflow:hidden;}
  /* segmented control */
  .theme-row{display:grid; grid-template-columns:repeat(3,1fr); gap:2px; padding:2px; margin:12px;
    background:var(--fill); border-radius:11px;}
  .theme-chip{border:none; border-radius:9px; padding:7px 4px; text-align:center; cursor:pointer;
    background:transparent;}
  .theme-chip .e{font-size:17px; display:block; line-height:1.2;}
  .theme-chip .n{font-size:12px; color:var(--label-2); font-weight:500;}
  .theme-chip.active{background:var(--bg-elev); box-shadow:0 1px 3px rgba(0,0,0,.14), 0 0 0 .5px rgba(0,0,0,.04);}
  .theme-chip.active .n{color:var(--label);}
  .setting-row{position:relative; display:flex; align-items:center; justify-content:space-between; gap:12px;
    min-height:46px; padding:9px 16px; font-size:17px; letter-spacing:-.01em; color:var(--label);}
  .setting-row + .setting-row::before{content:''; position:absolute; left:16px; right:0; top:0;
    height:.5px; background:var(--separator);}
  /* iOS switch: 51×31 with a 27px knob that slides on a spring-ish curve. */
  .switch{width:51px; height:31px; border-radius:999px; background:var(--fill-strong); border:none;
    position:relative; cursor:pointer; flex:none; transition:background-color .25s ease;}
  .switch::after{content:''; position:absolute; top:2px; left:2px; width:27px; height:27px; border-radius:50%;
    background:#fff; box-shadow:0 3px 8px rgba(0,0,0,.15), 0 1px 1px rgba(0,0,0,.16);
    transition:transform .25s cubic-bezier(.32,.72,0,1);}
  .switch.on{background:var(--tint);}
  .switch.on::after{transform:translateX(20px);}
  /* Inside a sheet the card and the sheet are both white, so the grouped list has to
     step down to a fill instead of up to an elevated surface. */
  .modal .settings-group{background:var(--fill); box-shadow:none; margin-bottom:0;}
  .settings-note{font-size:13px; color:var(--label-2); text-align:center; margin:-10px 4px 20px; line-height:1.4;}

  /* ---------- modal / sheet ---------- */
  .overlay{position:fixed; inset:0; background:rgba(0,0,0,.38); display:flex; align-items:flex-end;
    justify-content:center; z-index:50; -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px);}
  .modal{background:var(--sheet-bg); border-radius:20px 20px 0 0; padding:20px 20px calc(22px + var(--safe-b));
    width:100%; max-width:460px; box-shadow:0 -10px 40px rgba(0,0,0,.22); max-height:88vh; overflow-y:auto;
    -webkit-overflow-scrolling:touch;}
  /* grabber */
  .modal:not(.center)::before{content:''; display:block; width:36px; height:5px; border-radius:3px;
    background:var(--label-3); margin:-8px auto 16px;}
  .modal.center{border-radius:16px; margin:auto; max-width:360px; padding:22px 20px;
    box-shadow:var(--shadow-lift);}
  .modal h2{margin:0 0 4px; font-size:20px; font-weight:700; letter-spacing:-.022em; color:var(--label);}
  .modal p.hint{margin:0 0 14px; font-size:14px; color:var(--label-2); line-height:1.4;}
  .modal.reminder{text-align:center;}
  /* anywhere-wrap so a long single-word task name can't push the dialog wider than the screen */
  .modal.reminder .reminder-topic{margin:12px 0 0; font-size:17px; font-weight:600; color:var(--tint-text);
    overflow-wrap:anywhere;}
  .modal label{display:block; font-size:13px; color:var(--label-2); margin:16px 0 6px;}
  .modal input, .modal textarea{width:100%; font-family:inherit; font-size:17px; border:none;
    border-radius:var(--r-small); padding:12px 14px; background:var(--fill); color:var(--label);
    letter-spacing:-.01em;}
  .modal input:focus, .modal textarea:focus{outline:none; box-shadow:0 0 0 3px var(--tint-soft);}
  .modal textarea{resize:vertical; min-height:60px; line-height:1.4;}
  .step-dots{display:flex; gap:5px; margin-bottom:12px;}
  .step-dots i{width:22px; height:4px; border-radius:2px; background:var(--fill-strong); display:block;
    transition:background-color .2s ease;}
  .step-dots i.active{background:var(--tint);}
  .type-grid, .color-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:4px;}
  .type-chip{border:none; border-radius:var(--r-ctl); padding:12px 4px; text-align:center;
    background:var(--fill); cursor:pointer; color:var(--label);}
  .type-chip .e{font-size:26px; display:block; line-height:1.15;}
  .type-chip .n{font-size:12px; color:var(--label-2); margin-top:2px; display:block;}
  .type-chip.active{background:var(--tint-soft); box-shadow:inset 0 0 0 2px var(--tint);}
  .type-chip.active .n{color:var(--tint-text);}
  .color-grid{grid-template-columns:repeat(5,1fr);}
  .color-chip{width:100%; aspect-ratio:1; border-radius:50%; cursor:pointer; border:none;}
  .color-chip.active{box-shadow:0 0 0 2px var(--sheet-bg), 0 0 0 4px var(--label);}
  .modal-actions{display:flex; justify-content:space-between; gap:10px; margin-top:22px;}
  .btn{font-family:var(--font); font-size:17px; font-weight:600; letter-spacing:-.01em; border:none;
    border-radius:var(--r-ctl); padding:12px 20px; cursor:pointer; min-height:46px;}
  .btn.primary{background:var(--tint); color:#fff;}
  .btn.ghost{background:none; color:var(--tint-text); font-weight:400;}
  .btn.block{width:100%; min-height:50px;}
  .btn.danger{background:var(--red); color:#fff;}
  /* Neutral variant for secondary actions: the bare .btn falls back to the UA's grey
     buttonface, which ignores the theme entirely. */
  .btn.soft{background:var(--fill); color:var(--label); font-weight:500;}

  .congrats{position:fixed; inset:0; background:rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center;

  @keyframes pop-in{from{opacity:0; transform:scale(.9);} to{opacity:1; transform:none;}}
  .congrats-card .big-emoji{font-size:54px; display:block; margin-bottom:12px;}
  .congrats-card h2{margin:0 0 8px; color:var(--label); font-size:22px; font-weight:700; letter-spacing:-.022em;}
  .congrats-card p{margin:0 0 20px; color:var(--label-2); font-size:15px; line-height:1.4;}

  /* ---------- notebook ---------- */
  .notebook-btn{margin-left:auto; flex:none; display:flex; align-items:center; gap:5px;
    min-height:32px; padding:5px 11px; border:none; border-radius:999px;

  .note-wrap{display:flex; flex-direction:column; border:none;
    border-radius:var(--r-card); background:var(--bg-elev); overflow:hidden; box-shadow:var(--shadow);}
  /* Pinned above the text so the on-screen keyboard can never cover it. */
  .note-toolbar{position:sticky; top:0; z-index:2; display:flex; flex-wrap:wrap; gap:4px;

  .fmt-sep{width:.5px; align-self:stretch; background:var(--separator); margin:2px 3px;}

  .note-editor{min-height:46vh; padding:16px; outline:none; color:var(--label);

  .note-editor:empty::before{content:attr(data-placeholder); color:var(--label-3);}
  .note-editor h2{font-size:20px; font-weight:700; letter-spacing:-.022em; color:var(--label); margin:.7em 0 .3em;}
  .note-editor ul, .note-editor ol{padding-left:22px; margin:.4em 0;}

  .node-link{display:inline-block; padding:1px 8px; border-radius:8px; cursor:pointer;

  .node-link.broken{background:var(--fill); color:var(--label-2);

  .reminder-actions{flex-direction:column; gap:8px;}

  /* Flashed for a couple of seconds after a link jump, so it's obvious where you landed. */
  .node-pos.node-focused .node-card{box-shadow:0 0 0 3px var(--tint), var(--shadow-lift);}

  /* ---------- sharing ---------- */
  .share-btn{margin-left:0;}
  .export-opts{margin:14px 0 4px; padding:0;}
  .export-row{align-items:flex-start;}
  .export-row small{display:block; font-size:13px; color:var(--label-2); margin-top:1px;}

    border:none; border-radius:var(--r-small); padding:10px 12px; background:var(--fill);
    color:var(--label); resize:vertical; word-break:break-all;}
  .import-facts{display:flex; flex-wrap:wrap; gap:8px; margin:16px 0 4px; font-size:13px; color:var(--label-2);}
  .import-facts div{background:var(--fill); border-radius:8px; padding:6px 10px;}
  .import-facts b{color:var(--label);}
  .settings-actions{display:flex; flex-direction:column; gap:10px;}

  /* ---------- AI prompt screen ---------- */
  .prompt-steps{margin:0 0 12px; padding:16px 18px 16px 34px; background:var(--bg-elev);
    border:none; border-radius:var(--r-card); box-shadow:var(--shadow);
    font-size:15px; line-height:1.5; color:var(--label);}
  .prompt-steps li{margin:0 0 8px;}
  .prompt-steps li:last-child{margin-bottom:0;}
  .prompt-steps li::marker{color:var(--tint-text); font-weight:600;}
  .prompt-warn{display:flex; gap:8px; margin:0 0 16px; padding:12px 14px; border-radius:var(--r-ctl);
    background:var(--orange-soft); color:var(--label); border:none; font-size:13px; line-height:1.4;}
  .prompt-actions{display:flex; flex-direction:column; gap:10px; margin-bottom:14px;}
  /* white-space:pre keeps the JSON sample intact; the scrollbar lives on THIS box, so a
     long sample line can never widen the page itself. */
  .prompt-box{margin:0 0 6px; max-height:42vh; overflow:auto; -webkit-overflow-scrolling:touch;
    background:var(--bg-elev); border:none; border-radius:var(--r-card); padding:14px 16px;
    box-shadow:var(--shadow); font-family:var(--font-mono); font-size:11.5px;
    line-height:1.55; color:var(--label); white-space:pre; tab-size:2;
    user-select:text; -webkit-user-select:text;}
  .paste-box{width:100%; min-height:104px; font-family:var(--font-mono); font-size:13px;
    border:none; border-radius:var(--r-ctl); padding:12px 14px; background:var(--bg-elev);
    box-shadow:var(--shadow); color:var(--label); resize:vertical; overflow-wrap:anywhere;}
  .paste-box:focus{outline:none; box-shadow:var(--shadow), 0 0 0 3px var(--tint-soft);}

  .toast{position:fixed; left:50%; bottom:calc(96px + var(--safe-b)); transform:translateX(-50%);
    max-width:420px; width:calc(100% - 32px); z-index:80; padding:13px 16px; border-radius:14px;
    background:rgba(28,28,30,.94); color:#fff; box-shadow:0 8px 30px rgba(0,0,0,.28);
    -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px);
    font-family:var(--font); font-size:15px; line-height:1.4;}
  .toast.error{background:rgba(255,59,48,.96);}

  .empty{text-align:center; padding:50px 10px; color:var(--label-2); font-size:16px;}
  .section-title{font-size:13px; font-weight:600; letter-spacing:-.005em;
    color:var(--label-2); margin:22px 0 8px 4px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============ CONSTANTS ============ */
const TYPES = {
  oak:{e:'🌳', n:'Дуб'}, pine:{e:'🌲', n:'Сосна'}, palm:{e:'🌴', n:'Пальма'},
  sakura:{e:'🌸', n:'Сакура'}, bush:{e:'🌿', n:'Куст'}, maple:{e:'🍁', n:'Клён'}
};
// Apple's system colours, in their "accessible" (darker) variants: these fill the root
// node card, which carries white text on top.
const COLORS = {
  green:'#248A3D', blue:'#0064D2', purple:'#8944AB', red:'#D70015', orange:'#C93400'
};
const COLOR_NAMES = {green:'Зелёный', blue:'Синий', purple:'Фиолетовый', red:'Красный', orange:'Оранжевый'};
const SEASONS = [
  {days:365, e:'❄', n:'Зимний лес'}, {days:180, e:'🍂', n:'Осень'},
  {days:90, e:'🌿', n:'Лето'}, {days:30, e:'🌱', n:'Весна'}, {days:0, e:'🌤', n:'Начало пути'}
];
function seasonFor(daysActive){ return SEASONS.find(s=>daysActive>=s.days); }

const ICON_MARK = `<svg viewBox="0 0 34 34" class="brand-mark"><path d="M17 4l7 9h-4l6 8h-4l5 9H11l5-9H12l6-8h-4z" fill="#2F4A3C"/><rect x="15" y="27" width="4" height="6" fill="#8a6b3f"/></svg>`;
function ringFlame(pct){
  return `<svg viewBox="0 0 34 34" class="ring">
  <circle cx="17" cy="17" r="14" fill="none" stroke="var(--fill)" stroke-width="3"/>
  <circle cx="17" cy="17" r="14" fill="none" stroke="var(--orange)" stroke-width="3" stroke-linecap="round"
    stroke-dasharray="${Math.min(100,pct)*0.879} 999" transform="rotate(-90 17 17)"/>
  <path d="M17 9c-1 2.6-3.8 4-3.8 7.6a3.8 3.8 0 0 0 7.6 0c0-1.3-.6-2.2-1.2-3 .2 1.2-.4 2-1.1 2-.9 0-1.2-.8-1-1.6.3-1.2-.2-3-.5-5z" fill="var(--orange)"/>
</svg>`;
}
// The percentage's font and colour come from CSS (.ring-big text) — a presentation
// attribute can't reach the theme tokens.
function ringProgress(pct,cls){
  return `<svg viewBox="0 0 60 60" class="${cls||'ring-big'}">
  <circle cx="30" cy="30" r="25" fill="none" stroke="var(--fill)" stroke-width="5"/>
  <circle cx="30" cy="30" r="25" fill="none" stroke="var(--tint)" stroke-width="5" stroke-linecap="round"
    stroke-dasharray="${Math.min(100,pct)*1.5708} 999" transform="rotate(-90 30 30)"/>
  <text x="30" y="35.5" text-anchor="middle" font-size="15">${pct}%</text>
</svg>`;
}

/* Tab-bar glyphs: stroked line icons in the SF Symbols idiom, so the chrome reads as
   system UI. Emoji stay where they're content (tree species, task state), not chrome. */
const NAV_ICONS = {
  forest:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.2 6.4 11h3.1l-4 5.6h13l-4-5.6h3.1z"/><path d="M12 16.6V21"/></svg>`,
  chart:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg>`,
  gear:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h9"/><path d="M17 7h3"/><path d="M4 17h5"/><path d="M13 17h7"/><circle cx="15" cy="7" r="2.3"/><circle cx="11" cy="17" r="2.3"/></svg>`
};
// Same idiom, one size down, for the per-node action row and the tree-header pills.
const ACT_ICONS = {
  edit:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19.5 8.5a2.1 2.1 0 0 0-3-3L5 17z"/><path d="M14.5 6.5l3 3"/></svg>`,
  add:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>`,
  del:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5h16"/><path d="M9.5 6.5V4.8h5v1.7"/><path d="M6.5 6.5 7.4 20h9.2l.9-13.5"/><path d="M10.3 10v6M13.7 10v6"/></svg>`,
  note:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 4.5h13v15h-13z"/><path d="M8.8 4.5v15"/><path d="M11.6 9h4M11.6 13h4"/></svg>`,
  share:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4"/><path d="M8.4 7.4 12 3.8l3.6 3.6"/><path d="M6.5 11.5H5v8.2h14v-8.2h-1.5"/></svg>`
};

/* ============ STATE ============ */
const KEY = 'goaltree:data:v2';
let DATA = null;
let VIEW = 'home';
let CURRENT_TREE = null;
let PENDING_DELETE = null;
let OPEN_FORM = null;
let MODAL = null;            // 'newtree' | 'export' | 'import' | 'paste' | null
let WIZ_STEP = 1;
let WIZ_DRAFT = null;
let EXPORT_TREE = null;      // tree id being shared
let EXPORT_OPTS = {marks:false, notes:false}; // both off by default: ticks and notes are private
let EXPORT_LINK = null;      // built lazily; null until the user asks for a link
let IMPORT_DRAFT = null;     // {payload, nodeCount, hasNotes, hasMarks, name} awaiting confirmation
let CONGRATS_TREE = null;    // tree id currently showing congrats overlay
let REMINDER = null;         // {treeId, nodeId} task that just got ticked, showing the "write it down" nudge
let NODE_POPOVER = null;     // {treeId, nodeId} node currently open in the edit popover
let TREE_ZOOM = {scale:1, x:0, y:0}; // pan/zoom state for the tree canvas, reset whenever a tree is (re)opened
let TREE_ZOOM_READY = false; // whether the initial centering pass has run for the currently open tree
let NOTEBOOK_TREE = null;    // tree id whose notebook is open (VIEW==='notebook')
let NOTE_SAVE_TIMER = null;  // debounce handle for the notebook's autosave
let NOTE_SAVED_RANGE = null; // caret position stashed while the node picker steals focus
let NODE_PICKER = null;      // {treeId} while the insert-link picker is open
let NODE_PICKER_FILTER = '';
let PENDING_FOCUS_NODE = null; // {treeId,nodeId} to centre the camera on after the tree renders
let HIGHLIGHT_NODE = null;     // node id to flash once the camera lands
let TREE_CANVAS_OFF = {x:0,y:0}; // offX/offY from the last renderTreeCanvas() (see there)
let TREE_CANVAS_W = 0;       // canvas width from the last renderTreeCanvas(), cached so the
                             // per-pointermove grid math never touches DOM layout

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

// Local calendar date, not UTC: toISOString() rolls the day over at 00:00 UTC, so for
// anyone east/west of Greenwich "today" flipped at the wrong hour and daily tasks reset
// mid-evening or stayed checked past midnight.
function todayISO(){
  const d = new Date(), p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
// Whole-calendar-day difference. Both sides are reduced to bare Y/M/D and compared in a
// single fixed frame, so the result never drifts by a day across timezones or DST — and
// dates already stored in UTC form by older builds still diff correctly, since they're
// the same 'YYYY-MM-DD' shape.
function dayIndex(iso){
  const [y,m,d] = String(iso||'').slice(0,10).split('-').map(Number);
  if(!y || !m || !d) return NaN; // malformed/absent date in old saves — don't invent one
  return Date.UTC(y, m-1, d);
}
// NaN in means "unknown", and 0 out keeps callers on their neutral branch instead of
// letting a bogus huge gap wipe a streak or skew the stats.
function daysBetween(a,b){
  const diff = (dayIndex(b) - dayIndex(a))/86400000;
  return Number.isFinite(diff) ? Math.round(diff) : 0;
}

function defaultSettings(){ return { theme:'auto', sound:false, notifications:false, taskReminder:true }; }

// Settings added after launch default to ON, so saves written before they existed (where
// the key is simply absent) must read as enabled rather than disabled. Everything else
// keeps the original "absent = off" meaning.
const SETTINGS_DEFAULT_ON = ['taskReminder'];
function settingEnabled(key){
  const v = DATA.settings ? DATA.settings[key] : undefined;
  return SETTINGS_DEFAULT_ON.includes(key) ? v !== false : !!v;
}

function defaultData(){
  return {
    trees:[{
      id:'daily', isDaily:true, name:'Ежедневные задания', goal:null, type:null, color:'green',
      createdAt:todayISO(), lastActivity:null,
      root:{ id:'daily-root', text:'Ежедневные задания', children:[] }
    }],
    streak:{ current:0, best:0, lastActiveDate:null, totalCompleted:0, activeDates:[], firstUseDate:todayISO() },
    settings: defaultSettings()
  };
}

/* ---- theme ---- */
function effectiveTheme(){
  const pref = (DATA && DATA.settings && DATA.settings.theme) || 'auto';
  if(pref==='auto') return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  return pref;
}
function applyTheme(){
  const theme = effectiveTheme();
  document.documentElement.setAttribute('data-theme', theme);
  // In the APK the page draws underneath the status and gesture bars, so the system has
  // to be told which way to tint their icons — it can't see our theme, and it defaults to
  // the OS one, which is wrong the moment someone picks a theme that differs from it.
  // Absent everywhere except the wrapper (browser, PWA), hence the guard.
  try{
    if(window.GoalTreeHost && typeof GoalTreeHost.setTheme === 'function') GoalTreeHost.setTheme(theme);
  }catch(e){ /* a wrapper without the bridge must not take the app down */ }
}
if(window.matchMedia){
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>{
    if(DATA && DATA.settings && DATA.settings.theme==='auto'){ applyTheme(); }
  });
}

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    DATA = raw ? JSON.parse(raw) : defaultData();
  }catch(e){ DATA = defaultData(); }
  if(!DATA.settings) DATA.settings = defaultSettings();
  migrateRemoveCorner();
  checkStreakDecay();
  applyTheme();
  render();
  startDayWatcher();
  startEscHandler();
  startNotebookFlush();
  checkShareHash();
}

// Bound once for the page's lifetime. A phone can kill a backgrounded tab without warning
// and pagehide is the last reliable moment to write, so the notebook is flushed on the way
// out rather than trusting the 500ms autosave to have fired.
let NOTE_FLUSH_BOUND = false;
function startNotebookFlush(){
  if(NOTE_FLUSH_BOUND) return;
  NOTE_FLUSH_BOUND = true;
  document.addEventListener('visibilitychange', ()=>{ if(document.hidden) flushNotebook(); });
  window.addEventListener('pagehide', flushNotebook);
}
/* The "start point" concept was removed: trees still carrying a leftover corner
   node get it dissolved, with its children promoted to be root's direct children. */
function migrateRemoveCorner(){
  let changed = false;
  for(const t of DATA.trees){
    if(t.isDaily) continue;
    const corner = t.root.children.find(c=>c.isCorner);
    if(corner){
      t.root.children = t.root.children.filter(c=>c!==corner).concat(corner.children);
      changed = true;
    }
  }
  if(changed) save();
}
// Returns whether the write landed. Notebooks are free text and will be the first thing
// to hit the ~5MB localStorage ceiling, and silently dropping a page someone just typed
// is the worst possible failure — so callers can react, and save() itself surfaces the
// problem rather than only logging it.
function save(){
  try{
    localStorage.setItem(KEY, JSON.stringify(DATA));
    return true;
  }catch(e){
    console.error(e);
    const quota = e && (e.name === 'QuotaExceededError'
      || e.name === 'NS_ERROR_DOM_QUOTA_REACHED' || e.code === 22 || e.code === 1014);
    showToast(quota
      ? 'Не удалось сохранить: хранилище заполнено. Освободите место — удалите ненужное дерево или сократите заметки.'
      : 'Не удалось сохранить изменения.', 'error');
    return false;
  }
}

// Injected straight into the DOM instead of going through render(): a failed save can
// happen while the notebook's contenteditable is focused, and re-rendering there would
// destroy the caret and the very text we're warning about.
let TOAST_TIMER = null;
function showToast(msg, kind){
  let el = document.getElementById('toast');
  if(!el){
    el = document.createElement('div');
    el.id = 'toast';
    document.body.appendChild(el);
  }
  el.className = 'toast' + (kind === 'error' ? ' error' : '');
  el.textContent = msg;
  clearTimeout(TOAST_TIMER);
  TOAST_TIMER = setTimeout(()=>{ el.remove(); }, kind === 'error' ? 6000 : 2600);
}

function checkStreakDecay(){
  const s = DATA.streak;
  if(s.lastActiveDate){
    if(daysBetween(s.lastActiveDate, todayISO()) > 1) s.current = 0;
  }
}

/* ---- day rollover ----
   Daily tasks aren't stored per-day and are never deleted: isDoneToday() just compares
   completedDate to today, so the checkmarks lapse on their own the moment the date
   changes. What was missing is making a long-lived tab NOTICE that change — this is a PWA
   people leave open for days, so until now yesterday's checkmarks stayed on screen until
   a manual reload. Nothing here clears completedDate: the history feeds the streak. */
let DAY_WATCHER_ON = false;
let LAST_SEEN_DAY = null;

function msUntilLocalMidnight(){
  const now = new Date();
  // +2s past midnight so the timer never fires a hair early and still reads yesterday
  const next = new Date(now.getFullYear(), now.getMonth(), now.getDate()+1, 0, 0, 2, 0);
  return Math.max(1000, next - now);
}

function applyDayRolloverIfNeeded(){
  const today = todayISO();
  if(LAST_SEEN_DAY === today) return false;
  LAST_SEEN_DAY = today;
  checkStreakDecay();
  save();
  // The streak work above always runs; the repaint deliberately does not while the
  // notebook is open. This fires on every visibilitychange/focus, not just at midnight,
  // so re-rendering here would blow away the contenteditable — caret, selection and any
  // keystrokes not yet flushed — every time someone switched apps mid-sentence. Nothing
  // on the notebook screen displays day-dependent data, and leaving it re-renders anyway,
  // so skipping the repaint there costs nothing.
  if(DATA && VIEW !== 'notebook') render();
  return true;
}

// Armed once for the page's lifetime, not per render(): render() rebuilds #app.innerHTML,
// but this hangs off window/document, so re-arming there would pile up duplicate timers
// and listeners. A sleeping phone can skip the timer entirely, hence the visibility/focus
// re-check on the way back in.
function startDayWatcher(){
  if(DAY_WATCHER_ON) return;
  DAY_WATCHER_ON = true;
  LAST_SEEN_DAY = todayISO();
  let timer = null;
  const arm = ()=>{
    clearTimeout(timer);
    timer = setTimeout(()=>{ applyDayRolloverIfNeeded(); arm(); }, msUntilLocalMidnight());
  };
  arm();
  const recheck = ()=>{ if(!document.hidden && applyDayRolloverIfNeeded()) arm(); };
  document.addEventListener('visibilitychange', recheck);
  window.addEventListener('focus', recheck);
}

// Bound once for the page's lifetime — render() replaces #app.innerHTML, so anything
// re-bound per render would stack up duplicates. Esc backs out of whichever transient
// state is open: the add-branch panel, an armed delete, or the edit popover.
let ESC_BOUND = false;
function startEscHandler(){
  if(ESC_BOUND) return;
  ESC_BOUND = true;
  document.addEventListener('keydown',(e)=>{
    if(e.key!=='Escape') return;
    // the picker lives outside render(), so it closes itself rather than via a repaint
    if(NODE_PICKER){ closeNodePicker(); return; }
    if(!OPEN_FORM && !PENDING_DELETE && !NODE_POPOVER && !REMINDER) return;
    OPEN_FORM = null; PENDING_DELETE = null; NODE_POPOVER = null; REMINDER = null;
    render();
  });
}
function recordActivity(){
  const s = DATA.streak; const today = todayISO();
  if(s.lastActiveDate !== today){
    if(!s.lastActiveDate) s.current = 1;
    else{ const gap = daysBetween(s.lastActiveDate, today); s.current = (gap===1) ? s.current+1 : 1; }
    s.lastActiveDate = today;
    if(!s.activeDates.includes(today)) s.activeDates.push(today);
  }
  if(s.current > s.best) s.best = s.current;
}

/* ============ NODE HELPERS ============ */
function findTree(id){ return DATA.trees.find(t=>t.id===id); }
function findNode(root,id){ if(root.id===id) return root; for(const c of root.children){ const r=findNode(c,id); if(r) return r; } return null; }
function findParent(root,id){ for(const c of root.children){ if(c.id===id) return root; const r=findParent(c,id); if(r) return r; } return null; }
// Single source of truth for "is this node done": ordinary trees store a boolean in
// `completed`, the daily tree stores a date in `completedDate` that only counts for today.
// Everything (progress, cards, dots, popover, toggle) must go through this or the two
// formats drift apart — that's why daily progress used to read a permanent 0/N.
function isNodeDone(tree,node){
  return tree && tree.isDaily ? isDoneToday(node) : !!node.completed;
}
function progressOf(tree,node){
  // Counts every descendant node once by its OWN checkbox (branches included, not just leaves).
  let done=0,total=0;
  for(const c of node.children){
    total+=1; if(isNodeDone(tree,c)) done+=1;
    const p = progressOf(tree,c); done+=p.done; total+=p.total;
  }
  return {done,total};
}
function isDoneToday(node){ return !!node.completedDate && node.completedDate === todayISO(); }
function relDate(iso){
  if(!iso) return 'ещё не начато';
  const g = daysBetween(iso, todayISO());
  if(g<=0) return 'сегодня'; if(g===1) return 'вчера'; if(g<7) return g+' дн. назад';
  // build a LOCAL date: new Date('YYYY-MM-DD') is UTC midnight, which formats as the
  // previous day for anyone behind Greenwich
  const [y,m,d] = iso.slice(0,10).split('-').map(Number);
  return new Date(y, m-1, d).toLocaleDateString('ru-RU',{day:'numeric',month:'short'});
}
function stageOf(pct){
  if(pct>=100) return 'grown'; if(pct>=80) return 'ripe'; if(pct>=50) return 'big';
  if(pct>=20) return 'young'; return 'seed';
}
function stageEmoji(tree, pct){
  if(tree.isDaily) return '🌳';
  const type = TYPES[tree.type||'oak'].e;
  const s = stageOf(pct);
  if(s==='seed') return '🌱';
  if(s==='young') return '🌿';
  return type; // big, ripe, grown all show the chosen species
}

/* ============ ACTIONS ============ */
function actionAddTree(draft){
  const id = uid();
  DATA.trees.push({
    id, isDaily:false, name:draft.name.trim(), goal:draft.goal.trim()||null,
    type:draft.type, color:draft.color, createdAt:todayISO(), lastActivity:null,
    root:{ id:uid(), text:draft.goal.trim()||draft.name.trim(), children:[] }
  });
  MODAL=null; WIZ_DRAFT=null; save(); openTree(id);
}
function actionDeleteTree(id){ DATA.trees = DATA.trees.filter(t=>t.id!==id); save(); render(); }
function actionAddNode(treeId,parentId,text){
  const tree = findTree(treeId); const parent = findNode(tree.root,parentId);
  const node = { id:uid(), text:text.trim(), children:[] };
  if(treeId==='daily') node.completedDate=null; else node.completed=false;
  parent.children.push(node); OPEN_FORM=null; save(); render();
}
function actionDeleteNode(treeId,nodeId){
  const tree = findTree(treeId); const parent = findParent(tree.root,nodeId);
  if(parent) parent.children = parent.children.filter(c=>c.id!==nodeId);
  PENDING_DELETE=null; save(); render();
}
function actionEditNode(treeId,nodeId,data){
  const tree = findTree(treeId); const node = findNode(tree.root,nodeId);
  node.text = data.text.trim();
  node.description = data.description.trim() || null;
  if(node.id===tree.root.id && !tree.isDaily) tree.goal = node.text;
  NODE_POPOVER=null; save(); render();
}
function actionToggle(treeId,nodeId){
  const tree = findTree(treeId); const node = findNode(tree.root,nodeId); const s = DATA.streak;
  const before = progressOf(tree,tree.root); const pctBefore = before.total ? before.done/before.total*100 : 0;

  let justCompleted = false; // ticking ON only; unticking goes through the same function
  if(treeId==='daily'){
    const wasDone = isDoneToday(node);
    node.completedDate = wasDone ? null : todayISO();
    justCompleted = !wasDone;
    if(!wasDone){ s.totalCompleted++; recordActivity(); } else s.totalCompleted = Math.max(0,s.totalCompleted-1);
  }else{
    node.completed = !node.completed;
    justCompleted = node.completed;
    if(node.completed){ s.totalCompleted++; recordActivity(); } else s.totalCompleted = Math.max(0,s.totalCompleted-1);
  }
  tree.lastActivity = todayISO();

  const after = progressOf(tree,tree.root); const pctAfter = after.total ? after.done/after.total*100 : 0;
  save();
  const treeJustFinished = !tree.isDaily && pctBefore<100 && pctAfter>=100 && after.total>0;
  if(treeJustFinished) CONGRATS_TREE = treeId;
  // The nudge is for a real task in a normal tree. Daily habits ("drink water") have no
  // topic to write up and would nag every day. When this tick also finished the tree we
  // deliberately drop the reminder instead of queueing it: two overlays at once is wrong,
  // and on a completed tree the congrats card is the only thing worth showing.
  if(justCompleted && !treeJustFinished && !tree.isDaily && node.id!==tree.root.id && settingEnabled('taskReminder')){
    REMINDER = {treeId, nodeId};
  }
  render();
}
function actionResetAll(){
  DATA = defaultData(); MODAL=null; save(); goHome();
}

/* ============ VIEW NAV ============ */
function openTree(id){ flushNotebook(); CURRENT_TREE=id; VIEW='tree'; OPEN_FORM=null; PENDING_DELETE=null; NODE_POPOVER=null; REMINDER=null; NODE_PICKER=null; TREE_ZOOM={scale:1,x:0,y:0}; TREE_ZOOM_READY=false; render(); }
function goHome(){ flushNotebook(); VIEW='home'; CURRENT_TREE=null; NODE_POPOVER=null; REMINDER=null; NODE_PICKER=null; render(); }
function goStats(){ flushNotebook(); VIEW='stats'; REMINDER=null; NODE_PICKER=null; render(); }

/* ============ RENDER ============ */

function renderTreeView(){
  const t = findTree(CURRENT_TREE);
  if(!t) return `<div class="empty">Дерево не найдено</div>`;
  const p = progressOf(t,t.root); const pct = p.total ? Math.round(p.done/p.total*100) : 0;

  <div class="tree-scroll" id="tree-viewport">

      <button type="button" class="zoom-btn" data-zoom="in" title="Приблизить">+</button>
      <button type="button" class="zoom-btn" data-zoom="out" title="Отдалить">−</button>
      <button type="button" class="zoom-btn" data-zoom="reset" title="Сбросить масштаб">⤾</button>
    </div>
    ${(()=>{ const c = renderTreeCanvas(t);
      return `<div class="tree" id="tree-canvas" style="width:${c.width}px; height:${c.height}px;">${c.html}</div>`; })()}
  </div>`;
}

// Layout pass (Reingold-Tilford-lite, no DOM measurement): every leaf gets the next
// free x slot, every parent's x is the average of its children's, so subtrees never
// overlap and a linear chain stays on one straight column. A node with a saved
// node.pos uses that instead of the computed position (manual drag override) and
// doesn't consume an auto x-slot, so its auto-laid-out siblings re-tighten around it
// rather than leaving a gap. row 0 = root, row 1 = root's children, etc. — rows only
// drive the fallback y for auto-positioned nodes; a dragged node can sit anywhere.
function computeTreeLayout(tree){
  const layout = new Map(); // nodeId -> {x, row, posY}
  let nextX = 0;

  function visit(node,isRoot,row){
    let x;
    if(node.children.length===0){
      if(node.pos) x = node.pos.x;
      else { x = nextX; nextX += TREE_COL_WIDTH; }
    }else{
      const childXs = node.children.map(c=>visit(c,false,row+1));
      const autoX = childXs.reduce((a,b)=>a+b,0)/childXs.length;
      x = node.pos ? node.pos.x : autoX;
    }
    layout.set(node.id,{x,row,posY:node.pos?node.pos.y:null});
    return x;
  }
  visit(tree.root,true,0);

  // Every node is a card now, so the row pitch is a single constant.
  for(const pos of layout.values()){
    pos.y = pos.posY!==null ? pos.posY : pos.row*TREE_CARD_ROW_STEP;
  }
  return layout;
}

// Icon-only action row. Every icon carries title + aria-label because a bare pictogram
// tells a screen reader nothing, and the boxes are 30px so they stay tappable on a phone.
function renderNodeActionsRow(tree,node,isRoot){
  const isDaily = tree.isDaily;
  const canDelete = !isRoot;
  const armed = PENDING_DELETE===node.id;
  // Nested daily tasks are allowed now, so every node can grow children; only the wording
  // differs, since the daily root collects "задания" rather than "ветки".
  const addLabel = isRoot && isDaily ? 'Добавить задание' : 'Добавить ветку';

  const actions = [
    `<button type="button" class="icon-act" data-editnode="${tree.id}|${node.id}" title="Редактировать" aria-label="Редактировать">${ACT_ICONS.edit}</button>`,
    `<button type="button" class="icon-act" data-addform="${node.id}" title="${addLabel}" aria-label="${addLabel}">${ACT_ICONS.add}</button>`
  ];
  if(canDelete){
    actions.push(armed
      ? `<button type="button" class="icon-act danger-armed" data-confirmdel="${tree.id}|${node.id}" title="Нажмите ещё раз, чтобы удалить" aria-label="Подтвердить удаление">${ACT_ICONS.del}</button>`
      : `<button type="button" class="icon-act" data-askdel="${node.id}" title="Удалить" aria-label="Удалить">${ACT_ICONS.del}</button>`);
  }
  return `<div class="node-actions">${actions.join('')}</div>`;
}

// Card contents, top to bottom, all centred: title, optional description, optional
// progress, the completion flower on its own row, then the icon row.
function renderNodeCard(tree,node,isRoot){
  const checkable = !isRoot; // root is the goal itself: nothing to tick, nothing to delete
  const done = isNodeDone(tree,node);
  const hasChildren = node.children.length>0;
  const prog = hasChildren ? progressOf(tree,node) : null;
  const rootStyle = isRoot ? `style="background:${COLORS[tree.color||'green']};border-color:${COLORS[tree.color||'green']}"` : '';

  let inner = `<div class="node-card ${isRoot?'root':'task'} ${done&&checkable?'done':''}" ${rootStyle}>`;
  inner += `<div class="node-title" title="${esc(node.text)}">${esc(node.text)}</div>`;
  // omitted entirely when absent, so a description-less card leaves no empty band
  if(node.description) inner += `<div class="node-desc" title="${esc(node.description)}">${esc(node.description)}</div>`;
  if(prog && prog.total>0) inner += `<div class="node-progress">${prog.done}/${prog.total}</div>`;
  if(checkable) inner += `<div class="node-toggle-row"><button type="button" class="leaf-toggle ${done?'bloom':''}" data-toggle="${tree.id}|${node.id}" title="${done?'Снять отметку':'Отметить выполненным'}" aria-label="${done?'Снять отметку':'Отметить выполненным'}">${done?'🌸':'🍃'}</button></div>`;
  inner += renderNodeActionsRow(tree,node,isRoot);
  inner += `</div>`;
  return inner;
}

// Separate block below the card — deliberately a sibling of .node-card, not a child, so
// opening it can never change the card's own height (which the edge anchors depend on).
function renderAddPanel(tree,node){
  const isDaily = tree.isDaily;
  return `<form class="add-panel" data-addchild="${tree.id}|${node.id}">
    <input type="text" id="add-branch-input" placeholder="${isDaily?'например, выпить воду':'например, Математика'}"
      aria-label="Название новой ветки" required>
    <button type="submit" title="Добавить" aria-label="Добавить">↵</button>
  </form>`;
}

// Card box is 160 wide; +30 of gutter keeps neighbouring cards visibly apart.
const TREE_COL_WIDTH = 190;
// Tallest a card can get, from its CSS: 20 padding + 1 border + 2 title lines (36) +
// 3 clamped description lines (47) + progress (13) + flower row (34) + icon row (30) +
// 4 gaps of 5 (20) ≈ 204 (measured in the browser: 204.3). Both line clamps are what
// make this an actual ceiling — re-measure if .node-card's paddings, gaps or font sizes
// change, this constant has almost no slack left.
const TREE_CARD_MAX_H = 210;
// Row pitch = that ceiling plus ~50 of breathing room for the connecting curve.
const TREE_CARD_ROW_STEP = 250;

// Edges anchor at a point INSIDE the card rather than at its bottom edge. Card height
// still varies with content (root vs task, description present or not), so any single
// height constant would be wrong for most nodes — an over-estimate is exactly what used
// to leave lines starting in empty space below the card. The line layer sits under the
// (opaque) cards, so whatever runs beneath one is hidden and the edge visually starts at
// its true border, at any height and without measuring the DOM. This must stay an
// UNDER-estimate: the shortest possible card (root, one-line title, no description) is
// ~76px tall, so 34 is safely inside every card.
const TREE_CARD_ANCHOR_INSET = 34;
function nodeAnchorY(top){ return top + TREE_CARD_ANCHOR_INSET; }

const TREE_PAD = 50; // margin around the tree's bounding box so nothing hugs the canvas edge

// Smooth S-curve between two node anchors. Control points are pulled along the vertical
// gap, so it stays clean for straight-down chains, for branching, and when a node is
// dragged above or beside its parent (negative dy just flips the pull).
function bezierD(x1,y1,x2,y2){
  // Coerce first: callers pass dataset values, which are strings — "200"+500 concatenates
  // into "200500" and the control points end up ~100000px off-canvas, drawing the edge as
  // a long thin needle instead of a curve.
  x1=+x1; y1=+y1; x2=+x2; y2=+y2;
  const dy = y2-y1;
  const pull = Math.max(Math.abs(dy)*0.5, 28) * (dy<0 ? -1 : 1);
  return `M${x1},${y1} C${x1},${y1+pull} ${x2},${y2-pull} ${x2},${y2}`;
}

// Renders every node as a flat, absolutely-positioned element using computeTreeLayout()'s
// coordinates instead of nested <ul><li> flow — position never depends on a card's own
// content width/height, so alignment can't drift (see Prerequisite 1). The whole layout
// (auto positions + any manual node.pos) is measured and shifted so its bounding box
// starts at TREE_PAD,TREE_PAD, and the canvas is sized to fit exactly — a node dragged
// far outside the auto grid just grows the canvas instead of getting clipped.
function renderTreeCanvas(tree){
  const layout = computeTreeLayout(tree);

  let minX=Infinity, maxX=-Infinity, minY=Infinity, maxY=-Infinity;
  for(const pos of layout.values()){
    minX = Math.min(minX, pos.x-TREE_COL_WIDTH/2); maxX = Math.max(maxX, pos.x+TREE_COL_WIDTH/2);
    minY = Math.min(minY, pos.y); maxY = Math.max(maxY, pos.y+TREE_CARD_MAX_H);
  }
  const offX = TREE_PAD - minX, offY = TREE_PAD - minY;
  const width = maxX-minX+TREE_PAD*2, height = maxY-minY+TREE_PAD*2;

  const cx = (pos)=> pos.x+offX;
  const topY = (pos)=> pos.y+offY;
  const anchorY = (pos)=> nodeAnchorY(topY(pos));

  let items = '';
  let lines = '';
  function place(node,isRoot){
    const pos = layout.get(node.id);
    const left = cx(pos) - TREE_COL_WIDTH/2;
    const top = topY(pos);
    const panelOpen = OPEN_FORM===node.id;
    const inner = renderNodeCard(tree,node,isRoot) + (panelOpen ? renderAddPanel(tree,node) : '');
    items += `<div class="node-pos${isRoot?'':' node-draggable'}${panelOpen?' has-panel':''}" data-nodeid="${node.id}" data-rawx="${pos.x}" data-rawy="${pos.y}" style="left:${left}px; top:${top}px; width:${TREE_COL_WIDTH}px;">${inner}</div>`;
    node.children.forEach(c=>{
      const cpos = layout.get(c.id);
      const x1=cx(pos), y1=anchorY(pos), x2=cx(cpos), y2=anchorY(cpos);
      lines += `<path data-from="${node.id}" data-to="${c.id}" data-x1="${x1}" data-y1="${y1}" data-x2="${x2}" data-y2="${y2}" d="${bezierD(x1,y1,x2,y2)}"/>`;
      place(c,false);
    });
  }
  place(tree.root,true);

  // Cached here, while the numbers are already known, so applyTreeZoom() can position the
  // background grid on every pointermove — and focusNodeInTree() can aim the camera at a
  // node — without ever reading layout back from the DOM.
  TREE_CANVAS_W = width;
  TREE_CANVAS_OFF = {x:offX, y:offY};

  const svg = `<svg class="tree-lines" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">${lines}</svg>`;
  return {html:svg+items, width, height};
}

/* ============ AI PROMPT ============
   A ready-made prompt the user hands to any chatbot to get a tree back as JSON, which
   then comes home through the paste importer below. No bot is named or linked: the text
   is generic and whichever one the user already has open will do.

   Kept in sync with ai-prompt.md in the repo root — that file is the source, this is the
   copy the app ships. The prompt spells out the allowed type/color values and every
   length cap, so all of those are interpolated from the constants that actually enforce
   them: add a tree type or change SHARE_LIM and the text follows instead of quietly
   turning into a lie.

   Editing note: this is a template literal, so `${` opens a substitution and a backslash
   escapes. The JSON sample has braces but no dollar sign, so it survives verbatim; the
   one real casualty is the escaped-quote rule, which must be written \\" in source to
   read \" on screen. If you paste in text containing a literal `${`, escape the dollar. */
function buildAiPrompt(){
  const types = Object.keys(TYPES).map(k => k + ' ' + TYPES[k].e).join(', ');
  const colors = Object.keys(COLORS).join(', ');
  return `Ты помогаешь мне спланировать цель и оформить её как дерево задач для приложения
GoalTree. На выходе мне нужен готовый файл дерева в формате JSON, который я
импортирую в приложение.

## МОЯ ЦЕЛЬ

(заполни поля, лишнее удали)

- Цель: ...
- Срок: ...
- Где я сейчас: ...
- Что уже сделано: ...
- Ограничения: ...
- Сколько времени готов(а) уделять: ...

## Что от тебя нужно

Разбей цель на дерево задач и выдай его строго в формате из раздела «Формат файла».

### Требования к содержанию

1. 6–9 веток первого уровня — крупные направления работы, а не отдельные действия.
   Ветки должны покрывать цель целиком: не только «основную» часть, но и то, что
   обычно забывают (деньги, документы, здоровье, сроки, люди, запасной план).
2. В каждой ветке 3–6 подзадач. Максимальная глубина — 3 уровня от корня
   (ветка → подзадача → под-подзадача). Третий уровень использовать только там,
   где он действительно нужен, а не везде.
3. Каждая задача — законченное действие с проверяемым результатом. «Сдать IELTS на
   6.5» — да. «Английский» — нет. Формулировка должна отвечать на вопрос «что именно
   я сделаю и как пойму, что готово».
4. Задачи внутри ветки идут в том порядке, в каком их делают. Если что-то нужно
   начать сильно заранее из-за срока ожидания — скажи об этом в описании.
5. Описание (description) — только там, где оно несёт информацию: конкретная цифра,
   дедлайн, порядок действий, типичная ошибка, где искать. Не пересказывай заголовок
   другими словами. Если сказать нечего — поле просто не добавляй.
6. Всего 35–60 узлов. Меньше — дерево бесполезно, больше — им перестают пользоваться.
7. Отдельной веткой — сроки и контроль: какие даты критичны, что и когда проверять,
   что произойдёт при опоздании.
8. Язык — русский, кроме собственных названий (экзаменов, организаций, программ).

### Про факты

Если цель завязана на внешние правила, даты, экзамены, цены или процедуры — проверь
их в интернете, если есть такая возможность, и укажи в описании, на какой момент
актуальны данные. Если проверить нельзя — не выдумывай конкретные даты и суммы:
напиши, что нужно проверить и где именно (сайт, страница, ведомство). Ошибочный
дедлайн в трекере хуже, чем его отсутствие.

## Формат файла

Ответ — один JSON-объект ровно такой формы:

{
  "app": "${SHARE_APP}",
  "format": ${SHARE_FORMAT},
  "tree": {
    "name": "Короткое название",
    "goal": "Цель одной фразой",
    "type": "${IMPORT_DEFAULT_TYPE}",
    "color": "${IMPORT_DEFAULT_COLOR}",
    "root": {
      "text": "Цель одной фразой",
      "description": "Одна фраза про горизонт и главное условие успеха.",
      "children": [
        {
          "text": "Название ветки",
          "description": "Зачем эта ветка нужна.",
          "children": [
            { "text": "Задача с описанием", "description": "Конкретика: цифра, срок, порядок действий.", "children": [] },
            { "text": "Задача без описания", "children": [] },
            {
              "text": "Задача с вложенностью",
              "children": [
                { "text": "Под-подзадача", "children": [] }
              ]
            }
          ]
        }
      ]
    }
  }
}

Жёсткие правила:

- "app": "${SHARE_APP}" и "format": ${SHARE_FORMAT} — ровно так, иначе приложение откажется открывать
  дерево.
- Узел — это только text, необязательный description и children. Никаких id,
  completed, pos и прочих полей добавлять не нужно: отметки выполнения расставляет
  владелец дерева сам.
- children есть у каждого узла, у листьев — пустой массив [].
- type — ровно одно из: ${types}.
  color — одно из: ${colors}. Другое значение молча заменится
  на ${IMPORT_DEFAULT_TYPE} / ${IMPORT_DEFAULT_COLOR}.
- tree.goal и root.text — одна и та же фраза.
- Ограничения по длине: name ≤ ${SHARE_LIM.name} символов (лучше ≤ 30, чтобы влезало в карточку),
  goal ≤ ${SHARE_LIM.goal}, text узла ≤ ${SHARE_LIM.text}, description ≤ ${SHARE_LIM.description}. Лишнее обрезается при импорте.
- Переводы строк внутри текстов не сохраняются — пиши описание одним абзацем.
- Всего не больше ${IMPORT_MAX_NODES} узлов и не глубже ${IMPORT_MAX_DEPTH} уровней.
- Это должен быть валидный JSON: двойные кавычки, никаких комментариев, без висящих
  запятых. Кавычки внутри текста экранируй как \\" — или используй «ёлочки».

## Формат ответа

1. Сначала — 5–10 строк: список веток первого уровня и по фразе, что в каждой.
2. Затем — весь JSON одним блоком кода, без сокращений и без «...».
3. В конце — что стоит проверить самому: факты, в которых ты не уверен, и решения,
   которые я должен принять сам.

Ничего больше не добавляй.`;
}

function plural(n, one, few, many){
  const a = Math.abs(n) % 100, b = a % 10;
  if(a > 10 && a < 20) return many;
  if(b > 1 && b < 5) return few;
  if(b === 1) return one;
  return many;
}

/* ============ NOTEBOOK ============
   Each tree carries its own free-text notes in tree.notebook (HTML). Older saves simply
   don't have the field, hence the `|| ''` everywhere — no migration, no KEY bump. */

const NOTE_MAX_CHARS = 100000; // ~a long chapter; well under the localStorage ceiling
// Only what the toolbar and the link picker can actually produce. execCommand emits
// b/i/strike/ul/ol/li/div/br and formatBlock headings; everything else that arrives via
// paste gets unwrapped (text kept) or dropped outright.
const NOTE_OK_TAGS = new Set(['B','STRONG','I','EM','S','STRIKE','DEL','U','H2','H3','P','DIV','BR','UL','OL','LI','A']);
const NOTE_KILL_TAGS = new Set(['SCRIPT','STYLE','IFRAME','OBJECT','EMBED','IMG','SVG','LINK','META','VIDEO','AUDIO','CANVAS','FORM','INPUT','BUTTON','TEXTAREA','SELECT']);

// Runs on paste AND on every read from storage: the app file gets updated while saved
// notebooks stay exactly as they were, so stored HTML can never be treated as trusted.
// <template> parses without running scripts or fetching anything.
function sanitizeNotebook(html){
  const tpl = document.createElement('template');
  tpl.innerHTML = String(html || '');
  const unwrap = (n)=>{ const f = document.createDocumentFragment();
    while(n.firstChild) f.appendChild(n.firstChild); n.replaceWith(f); };
  (function clean(parent){
    [...parent.childNodes].forEach(n=>{
      if(n.nodeType === 3) return;                 // text survives untouched
      if(n.nodeType !== 1){ n.remove(); return; }  // comments, CDATA, …
      clean(n);                                    // depth-first, so unwrapping is final
      const tag = n.tagName;
      if(NOTE_KILL_TAGS.has(tag)){ n.remove(); return; }   // images included: one photo as
      if(!NOTE_OK_TAGS.has(tag)){ unwrap(n); return; }     // base64 would eat the quota
      const link = tag === 'A' ? n.getAttribute('data-nodelink') : null;
      // Blanket attribute strip kills style, on* handlers, href="javascript:" and the rest
      // in one go; the two attributes a node link needs are put back explicitly.
      [...n.attributes].forEach(a=>n.removeAttribute(a.name));
      if(tag === 'A'){
        if(!link){ unwrap(n); return; }            // ordinary links become plain text
        n.setAttribute('data-nodelink', link);
        n.setAttribute('class', 'node-link');
        n.setAttribute('contenteditable', 'false');
      }
    });
  })(tpl.content);
  return tpl.innerHTML;
}

// Labels are resolved at display time, never frozen at insert time — otherwise renaming a
// task would leave the old wording sitting in the notes forever.
function resolveNoteLinks(tree, html){
  const tpl = document.createElement('template');
  tpl.innerHTML = html;
  tpl.content.querySelectorAll('a[data-nodelink]').forEach(a=>{
    const node = findNode(tree.root, a.getAttribute('data-nodelink'));
    if(node){
      a.textContent = node.text;
      a.classList.remove('broken');
      a.setAttribute('title', node.text);
    }else{
      // Keep whatever text is there: losing the wording would lose the note's meaning.
      a.classList.add('broken');
      a.setAttribute('title', 'Задание удалено');
    }
  });
  return tpl.innerHTML;
}

// Writes the editor's current HTML into DATA without touching the screen. Anything that
// replaces #app.innerHTML must call this first, or the last keystrokes die with the node.
function flushNotebook(){
  const ed = document.getElementById('note-editor');
  if(!ed || !NOTEBOOK_TREE) return;
  const tree = findTree(NOTEBOOK_TREE);
  if(!tree) return;
  clearTimeout(NOTE_SAVE_TIMER); NOTE_SAVE_TIMER = null;
  const html = sanitizeNotebook(ed.innerHTML);
  if(tree.notebook !== html){ tree.notebook = html; save(); }
}

function notebookIsEmpty(tree){
  const html = tree && tree.notebook || '';
  const tpl = document.createElement('template'); tpl.innerHTML = html;
  return !(tpl.content.textContent || '').trim() && !tpl.content.querySelector('a[data-nodelink]');
}

/* Flat list with indentation so the tree's shape stays readable, plus a filter for trees
   too big to scan. Only this tree's nodes — cross-notebook links are out of scope.

   Deliberately mounted straight into the DOM instead of going through render(): render()
   rebuilds #app.innerHTML, which would replace the editor with whatever was last written
   to tree.notebook, losing both un-flushed keystrokes and the live caret the link is
   supposed to be inserted at. Appending leaves the editor untouched, so the real
   selection is still there when the user picks a node. */
function pickerRowsHtml(tree){
  const q = NODE_PICKER_FILTER.trim().toLowerCase();
  const rows = [];
  (function walk(node, depth){
    if(!q || node.text.toLowerCase().includes(q)){
      rows.push(`<button type="button" class="picker-row" data-picknode="${node.id}"
        style="padding-left:${10 + depth*16}px">${esc(node.text)}</button>`);
    }
    node.children.forEach(c=>walk(c, depth+1));
  })(tree.root, 0);
  return rows.length ? rows.join('') : '<p class="hint">Ничего не найдено</p>';
}

function openNodePicker(){
  const tree = findTree(NOTEBOOK_TREE);

    <div class="picker-list" id="picker-list">${pickerRowsHtml(tree)}</div>
    <div class="modal-actions"><button class="btn ghost block" id="picker-cancel">Отмена</button></div>
  </div>`;
  document.getElementById('app').appendChild(wrap);

  wrap.addEventListener('click',(e)=>{ if(e.target === wrap) closeNodePicker(); });

    wrap.querySelector('#picker-list').innerHTML = pickerRowsHtml(tree);
    bindPickerRows(wrap);
  });
  bindPickerRows(wrap);
  filter.focus();
}

function bindPickerRows(wrap){
