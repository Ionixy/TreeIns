/* Flat list with indentation so the tree's shape stays readable, plus a filter for trees
   too big to scan. Only this tree's nodes — cross-notebook links are out of scope.

   Deliberately mounted straight into the DOM instead of going through render(): render()
   rebuilds #app.innerHTML, which would replace the editor with whatever was last written
   to tree.notebook, losing both un-flushed keystrokes and the live caret the link is
   supposed to be inserted at. Appending leaves the editor untouched, so the real
   selection is still there when the user picks a node. */
function pickerRowsHtml(tree){
  const q = NODE_PICKER_FILTER.trim().toLowerCase();
  const rows = [];
  (function walk(node, depth){
    if(!q || node.text.toLowerCase().includes(q)){
      rows.push(`<button type="button" class="picker-row" data-picknode="${node.id}"
        style="padding-left:${10 + depth*16}px">${esc(node.text)}</button>`);
    }
    node.children.forEach(c=>walk(c, depth+1));
  })(tree.root, 0);
  return rows.length ? rows.join('') : `<p class="hint">${tr('note.nothingFound')}</p>`;
}

function openNodePicker(){
  const tree = findTree(NOTEBOOK_TREE);
  if(!tree) return;
  closeNodePicker();
  NODE_PICKER = {treeId: tree.id}; NODE_PICKER_FILTER = '';
  const wrap = document.createElement('div');
  wrap.className = 'overlay';
  wrap.id = 'node-picker';
  wrap.innerHTML = `<div class="modal center">
    <h2>${tr('note.link')}</h2>
    <input type="text" id="picker-filter" class="picker-filter" placeholder="${tr('note.filterPlaceholder')}" aria-label="${tr('note.filterAria')}">
    <div class="picker-list" id="picker-list">${pickerRowsHtml(tree)}</div>
    <div class="modal-actions"><button class="btn ghost block" id="picker-cancel">${tr('common.cancel')}</button></div>
  </div>`;
  document.getElementById('app').appendChild(wrap);

  wrap.addEventListener('click',(e)=>{ if(e.target === wrap) closeNodePicker(); });
  wrap.querySelector('#picker-cancel').addEventListener('click', closeNodePicker);
  const filter = wrap.querySelector('#picker-filter');
  filter.addEventListener('input',()=>{
    NODE_PICKER_FILTER = filter.value;
    // only the list is redrawn, so the input keeps its own focus and caret
    wrap.querySelector('#picker-list').innerHTML = pickerRowsHtml(tree);
    bindPickerRows(wrap);
  });
  bindPickerRows(wrap);
  filter.focus();
}

function bindPickerRows(wrap){
  wrap.querySelectorAll('[data-picknode]').forEach(el=>
    el.addEventListener('click',()=>insertNodeLink(el.dataset.picknode)));
}

function closeNodePicker(){
  const el = document.getElementById('node-picker');
  if(el) el.remove();
  NODE_PICKER = null;
}

/* ============ SHARING ============
   There is no backend, so "sharing" means handing over a SNAPSHOT, not granting access:
   after import the two trees are unrelated copies. Anything arriving here is untrusted —
   it came out of a messenger — so every field is validated, clamped and sanitised before
   it is allowed anywhere near DATA. */

const SHARE_APP = 'goaltree';
const SHARE_FORMAT = 1;                 // bump when the shape changes incompatibly
const SHARE_HASH_PREFIX = '#gt';        // fragment marker: #gt=<plain> or #gtz=<gzipped>
const SHARE_LINK_MAX = 8000;            // beyond this, messengers and browsers start truncating
const IMPORT_MAX_NODES = 2000;
const IMPORT_MAX_DEPTH = 50;            // findNode/progressOf/computeTreeLayout all recurse
const SHARE_LIM = {name:120, goal:400, text:200, description:2000, notebook:100000};
// What an unknown type/color falls back to on import. Named rather than inlined because
// buildAiPrompt() has to tell the model the same two values.
const IMPORT_DEFAULT_TYPE = 'oak';
const IMPORT_DEFAULT_COLOR = 'green';

function clampStr(v, max){
  if(typeof v !== 'string') return '';
  return v.replace(/\s+/g,' ').trim().slice(0, max);
}

/* What actually leaves the device. Completion marks and the notebook are opt-in: the
   recipient wants the shape of the goal, not someone else's ticks, and notes are private. */
function serializeTreeForShare(tree, opts){
  const withMarks = !!(opts && opts.marks), withNotes = !!(opts && opts.notes);
  function packNode(n){
    const o = { text: clampStr(n.text, SHARE_LIM.text), children: (n.children||[]).map(packNode) };
    const d = clampStr(n.description, SHARE_LIM.description);
    if(d) o.description = d;
    if(n.pos && isFinite(+n.pos.x) && isFinite(+n.pos.y)) o.pos = {x:+n.pos.x, y:+n.pos.y};
    if(withMarks){
      // The marks travel, the history does not: completedAt/completedDays are a record of
      // the sender's own days, and the recipient is starting a separate copy of the tree.
      // They land as a tick with no date, which readers already treat as "unknown".
      if(n.completed === true) o.completed = true;
      if(n.completedDate) o.completedDate = n.completedDate;
    }
    // The id travels only alongside notes: it exists purely so the importer can remap
    // a[data-nodelink] onto the freshly generated ids. Without notes it is dead weight,
    // and ids are regenerated on import regardless.
    if(withNotes) o.id = n.id;
    return o;
  }
  const packed = {
    name: clampStr(tree.name, SHARE_LIM.name),
    goal: tree.goal ? clampStr(tree.goal, SHARE_LIM.goal) : null,
    type: TYPES[tree.type] ? tree.type : 'oak',
    color: COLORS[tree.color] ? tree.color : 'green',
    root: packNode(tree.root)
  };
  if(withNotes && tree.notebook){
    packed.notebook = sanitizeNotebook(tree.notebook).slice(0, SHARE_LIM.notebook);
  }
  return { app: SHARE_APP, format: SHARE_FORMAT, exportedAt: new Date().toISOString(), tree: packed };
}

/* Returns {payload,nodeCount,…} or {error} — never throws, so no input can white-screen
   the app. The size/depth caps run BEFORE anything is built, because the rest of the app
   walks trees recursively and a deep file would overflow the stack. */
function parseSharePayload(text){
  let raw;
  try{ raw = JSON.parse(text); }
  catch(_){ return {error:tr('err.notGoalTreeFile')}; }
  if(!raw || typeof raw !== 'object' || Array.isArray(raw)) return {error:tr('err.emptyFile')};
  if(raw.app !== SHARE_APP) return {error:tr('err.notGoalTree')};
  if(typeof raw.format !== 'number') return {error:tr('err.noFormat')};
  if(raw.format > SHARE_FORMAT) return {error:tr('err.newerFormat')};
  const t = raw.tree;
  if(!t || typeof t !== 'object' || !t.root || typeof t.root !== 'object') return {error:tr('err.noTree')};

  let count = 0, tooDeep = false, tooBig = false;
  (function scan(n, depth){
    if(tooBig || tooDeep) return;
    if(depth > IMPORT_MAX_DEPTH){ tooDeep = true; return; }
    if(++count > IMPORT_MAX_NODES){ tooBig = true; return; }
    const kids = Array.isArray(n.children) ? n.children : [];
    for(const k of kids){ if(k && typeof k === 'object') scan(k, depth+1); if(tooBig||tooDeep) return; }
  })(t.root, 1);
  if(tooDeep) return {error:tr('err.tooDeep',{n:IMPORT_MAX_DEPTH})};
  if(tooBig)  return {error:tr('err.tooManyNodes',{n:IMPORT_MAX_NODES})};

  return {
    payload: raw,
    nodeCount: count,
    hasNotes: !!t.notebook,
    hasMarks: JSON.stringify(t.root).includes('"completed"')
  };
}

/* Fresh ids everywhere: a shared file may carry id:'daily' / 'daily-root', which would
   collide with the recipient's daily tree, and reusing ids would make importing the same
   tree twice impossible. */
function buildTreeFromPayload(payload, nameOverride){
  const t = payload.tree;
  const idMap = new Map();
  function makeNode(src){
    const id = uid();
    if(src.id) idMap.set(String(src.id), id);
    const n = { id, text: clampStr(src.text, SHARE_LIM.text) || tr('import.untitled'), children: [] };
    const d = clampStr(src.description, SHARE_LIM.description);
    if(d) n.description = d;
    if(src.pos && isFinite(+src.pos.x) && isFinite(+src.pos.y)) n.pos = {x:+src.pos.x, y:+src.pos.y};
    // Imported trees are never the daily one, so state always lives in `completed`;
    // a completedDate from someone's daily tree collapses into a plain tick.
    n.completed = src.completed === true || !!src.completedDate;
    const kids = Array.isArray(src.children) ? src.children : [];
    for(const k of kids){ if(k && typeof k === 'object') n.children.push(makeNode(k)); }
    return n;
  }
  const root = makeNode(t.root);
  const tree = {
    id: uid(),
    isDaily: false,          // exactly one daily tree may exist; a second breaks renderHome
    name: clampStr(nameOverride, SHARE_LIM.name) || clampStr(t.name, SHARE_LIM.name) || tr('import.defaultName'),
    goal: clampStr(t.goal, SHARE_LIM.goal) || null,
    type: TYPES[t.type] ? t.type : IMPORT_DEFAULT_TYPE,   // unknown values would crash TYPES[...].e
    color: COLORS[t.color] ? t.color : IMPORT_DEFAULT_COLOR,
    createdAt: todayISO(),
    lastActivity: null,
    root
  };
  if(typeof t.notebook === 'string' && t.notebook){
    // sanitise BEFORE storing, not at display time: this HTML came from a stranger
    const clean = sanitizeNotebook(t.notebook.slice(0, SHARE_LIM.notebook));
    tree.notebook = remapNoteLinks(clean, idMap);
  }
  return tree;
}

// Notebook links hold node ids, which we just regenerated — without this every link in an
// imported note would point at nothing. Links whose target isn't in the file keep their
// old id and simply render as broken, which resolveNoteLinks() already handles.
function remapNoteLinks(html, idMap){
  const tpl = document.createElement('template');
  tpl.innerHTML = html;
  tpl.content.querySelectorAll('a[data-nodelink]').forEach(a=>{
    const fresh = idMap.get(String(a.getAttribute('data-nodelink')));
    if(fresh) a.setAttribute('data-nodelink', fresh);
  });
  return tpl.innerHTML;
}

const SHARE_TRANSLIT = {а:'a',б:'b',в:'v',г:'g',д:'d',е:'e',ё:'e',ж:'zh',з:'z',и:'i',й:'y',
  к:'k',л:'l',м:'m',н:'n',о:'o',п:'p',р:'r',с:'s',т:'t',у:'u',ф:'f',х:'h',ц:'c',ч:'ch',
  ш:'sh',щ:'sch',ъ:'',ы:'y',ь:'',э:'e',ю:'yu',я:'ya'};
function shareFileName(name){
  const base = String(name || '').toLowerCase().split('')
    .map(ch => SHARE_TRANSLIT[ch] !== undefined ? SHARE_TRANSLIT[ch] : ch).join('')
    .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40);
  return `goaltree-${base || 'tree'}.json`;
}

function b64url(bytes){
  let s = '';
  for(const b of bytes) s += String.fromCharCode(b);
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function unb64url(str){
  const s = String(str).replace(/-/g,'+').replace(/_/g,'/');
  const bin = atob(s + '==='.slice((s.length + 3) % 4));
  const out = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
  return out;
}

/* The payload goes in the FRAGMENT, never a query parameter: fragments are not sent to
   the server, so the contents of someone's tree never reach a hosting log. */
async function buildShareLink(payload){
  const json = JSON.stringify(payload);
  let bytes = new TextEncoder().encode(json);
  let gz = false;
  if(typeof CompressionStream === 'function'){
    try{
      const stream = new Blob([bytes]).stream().pipeThrough(new CompressionStream('gzip'));
      bytes = new Uint8Array(await new Response(stream).arrayBuffer());
      gz = true;
    }catch(_){ /* fall back to uncompressed */ }
  }
  const base = location.origin + location.pathname;
  return base + SHARE_HASH_PREFIX + (gz ? 'z=' : '=') + b64url(bytes);
}

async function readShareHash(hash){
  const m = /^#gt(z?)=(.+)$/.exec(hash || '');
  if(!m) return null;
  try{
    let bytes = unb64url(m[2]);
    if(m[1] === 'z'){
      if(typeof DecompressionStream !== 'function') return {error:tr('err.noDecompress')};
      const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      bytes = new Uint8Array(await new Response(stream).arrayBuffer());
    }
    return parseSharePayload(new TextDecoder().decode(bytes));
  }catch(_){
    return {error:tr('err.badLink')};
  }
}

  // focusNodeInTree() already positioned the camera precisely; the generic centering

// margin:auto only centers the canvas when it FITS inside the viewport; a tree wider
// than the screen instead sticks to the left edge (standard CSS behavior for an
// overflowing block), which can leave the root off-screen. Center it explicitly
// once, based on measured viewport/canvas width — this only moves the "camera" (pan
// offset), it never feeds back into the layout math itself.
function centerTreeCanvas(){
  const viewport = document.getElementById('tree-viewport');
  const canvas = document.getElementById('tree-canvas');
  if(!viewport || !canvas) return;
  TREE_ZOOM.x = (viewport.clientWidth - canvas.offsetWidth)/2;
}

const TREE_GRID_STEP = 26; // dot lattice pitch at scale 1, matches the CSS background-size

function applyTreeZoom(){
  const canvas = document.getElementById('tree-canvas');
  if(canvas) canvas.style.transform = `translate(${TREE_ZOOM.x}px, ${TREE_ZOOM.y}px) scale(${TREE_ZOOM.scale})`;

  // Keep the viewport's dot grid glued to the canvas. .tree has transform-origin:top
  // center, so under scale(s) its left edge lands at x + W*(1-s)/2 while its top edge is
  // just y — anchoring the lattice to that same point is what stops the dots sliding out
  // from under the nodes when zooming. Pure style writes, no layout reads (W is cached).
  const viewport = document.getElementById('tree-viewport');
  if(viewport){
    const s = TREE_ZOOM.scale, step = TREE_GRID_STEP*s;
    const bgX = TREE_ZOOM.x + TREE_CANVAS_W*(1-s)/2;
    viewport.style.backgroundSize = `${step}px ${step}px`;
    viewport.style.backgroundPosition = `${bgX}px ${TREE_ZOOM.y}px`;
  }
}

// Pinch-to-zoom + drag-to-pan on touch, drag-to-pan + Ctrl+wheel-to-zoom on desktop.
// Rebound on every render() since the viewport element is recreated each time.
function bindTreeZoomPan(){
  const viewport = document.getElementById('tree-viewport');
  if(!viewport) return;
  const pointers = new Map();
  let dragging = false, startX = 0, startY = 0, startTX = 0, startTY = 0;
  let pinchStartDist = 0, pinchStartScale = 1;

  viewport.addEventListener('pointerdown',(e)=>{
    if(e.target.closest('button, input, textarea, a, form, .node-draggable')) return; // let controls and node drag behave normally
    viewport.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(pointers.size===1){
      dragging = true; startX=e.clientX; startY=e.clientY; startTX=TREE_ZOOM.x; startTY=TREE_ZOOM.y;
    }else if(pointers.size===2){
      dragging = false;
      const pts = [...pointers.values()];
      pinchStartDist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y) || 1;
      pinchStartScale = TREE_ZOOM.scale;
    }
  });
  viewport.addEventListener('pointermove',(e)=>{
    if(!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(pointers.size===2){
      const pts = [...pointers.values()];
      const dist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
      TREE_ZOOM.scale = Math.min(2.5, Math.max(0.4, pinchStartScale * dist/pinchStartDist));
      applyTreeZoom();
    }else if(dragging && pointers.size===1){
      TREE_ZOOM.x = startTX + (e.clientX-startX);
      TREE_ZOOM.y = startTY + (e.clientY-startY);
      applyTreeZoom();
    }
  });
  const endPointer = (e)=>{
    pointers.delete(e.pointerId);
    dragging = pointers.size===1;
    if(dragging){
      const [p] = pointers.values();
      startX=p.x; startY=p.y; startTX=TREE_ZOOM.x; startTY=TREE_ZOOM.y;
    }
  };
  viewport.addEventListener('pointerup', endPointer);
  viewport.addEventListener('pointercancel', endPointer);
  viewport.addEventListener('wheel',(e)=>{
    if(!e.ctrlKey) return; // plain wheel/trackpad scroll is left alone; Ctrl+wheel zooms
    e.preventDefault();
    const factor = e.deltaY<0 ? 1.1 : 0.9;
    TREE_ZOOM.scale = Math.min(2.5, Math.max(0.4, TREE_ZOOM.scale*factor));
    applyTreeZoom();
  }, {passive:false});
}

let NODE_DRAG = null; // {pointerId, el, nodeId, startClientX, startClientY, startLeft, startTop, dragging}
const DRAG_THRESHOLD = 7; // px of on-screen pointer movement before a press counts as a drag, not a click

// Any node (except root) can be picked up and moved anywhere on the canvas. Rebound
// on every render() since nodes are recreated each time.
function bindNodeDrag(){
  document.querySelectorAll('.node-draggable').forEach(el=>{
    el.addEventListener('pointerdown', onNodeDragStart);
  });
}

function onNodeDragStart(e){
  if(e.target.closest('.icon-act, .leaf-toggle, input, textarea, form')) return; // let those controls click normally
  const el = e.currentTarget;
  NODE_DRAG = {
    pointerId: e.pointerId, el, nodeId: el.dataset.nodeid,
    startClientX: e.clientX, startClientY: e.clientY,
    startLeft: parseFloat(el.style.left), startTop: parseFloat(el.style.top),
    startRawX: parseFloat(el.dataset.rawx), startRawY: parseFloat(el.dataset.rawy),
    dragging: false
  };
  // Pointer capture is deliberately NOT taken here. Capturing on pointerdown retargets
  // the follow-up compatibility `click` to this element, so it would never reach the
  // buttons inside the card. It's taken in onNodeDragMove instead, once we know this is
  // really a drag. Listening on window (not el) means a fast pointer that outruns the
  // node before the threshold is crossed still gets tracked.
  window.addEventListener('pointermove', onNodeDragMove);
  window.addEventListener('pointerup', onNodeDragEnd);
  window.addEventListener('pointercancel', onNodeDragEnd);
}

function onNodeDragMove(e){
  if(!NODE_DRAG || e.pointerId!==NODE_DRAG.pointerId) return;
  const dx = e.clientX - NODE_DRAG.startClientX;
  const dy = e.clientY - NODE_DRAG.startClientY;
  if(!NODE_DRAG.dragging){
    if(Math.hypot(dx,dy) < DRAG_THRESHOLD) return;
    NODE_DRAG.dragging = true;
    NODE_DRAG.el.classList.add('dragging');
    // Now that it's unambiguously a drag, capture so the node keeps following a pointer
    // that leaves it — and suppressing the resulting click is intended from here on.
    try{ NODE_DRAG.el.setPointerCapture(e.pointerId); }catch(_){}
  }
  const scale = TREE_ZOOM.scale;
  const left = NODE_DRAG.startLeft + dx/scale;
  const top = NODE_DRAG.startTop + dy/scale;
  NODE_DRAG.el.style.left = left+'px';
  NODE_DRAG.el.style.top = top+'px';
  updateEdgesForNode(NODE_DRAG.nodeId, left, top);
}

function onNodeDragEnd(e){
  if(!NODE_DRAG || e.pointerId!==NODE_DRAG.pointerId) return;
  const {el, nodeId, dragging} = NODE_DRAG;
  window.removeEventListener('pointermove', onNodeDragMove);
  window.removeEventListener('pointerup', onNodeDragEnd);
  window.removeEventListener('pointercancel', onNodeDragEnd);
  if(dragging){
    el.classList.remove('dragging');
    // a drag shouldn't also fire the click that opens a dot's popover
    const suppressClick = (ev)=>{ ev.preventDefault(); ev.stopPropagation(); };
    el.addEventListener('click', suppressClick, {capture:true, once:true});
    // Raw-space delta, not "screen position minus this render's offset": moving a node
    // can shift its own unpositioned ancestors (they re-center on their children), which
    // shifts the whole canvas's bounding box and thus next render's offset — converting
    // through a soon-to-be-stale offset would land the node somewhere else than dropped.
    const scale = TREE_ZOOM.scale;
    const dx = (e.clientX - NODE_DRAG.startClientX)/scale;
    const dy = (e.clientY - NODE_DRAG.startClientY)/scale;
    const tree = findTree(CURRENT_TREE);
    const node = findNode(tree.root, nodeId);
    node.pos = { x: NODE_DRAG.startRawX + dx, y: NODE_DRAG.startRawY + dy };
    save();
    render();
  }
  NODE_DRAG = null;
}

// Moves just the two anchor points touched by a node's current drag — the edge to its
// parent (fixed at the parent's end) and the edges to its own children (fixed at each
// child's end) — instead of rebuilding the whole line layer on every pointermove.
function updateEdgesForNode(nodeId,left,top){
  const cxNode = left + TREE_COL_WIDTH/2;
  const ayNode = nodeAnchorY(top); // same anchor rule renderTreeCanvas uses

  const incoming = document.querySelector(`.tree-lines path[data-to="${nodeId}"]`);
  if(incoming) incoming.setAttribute('d', bezierD(incoming.dataset.x1, incoming.dataset.y1, cxNode, ayNode));
  document.querySelectorAll(`.tree-lines path[data-from="${nodeId}"]`).forEach(p=>{
    p.setAttribute('d', bezierD(cxNode, ayNode, p.dataset.x2, p.dataset.y2));
  });
}

/* ---- notebook editor wiring ----
   Formatting runs through document.execCommand. It is formally deprecated, but every
   browser still implements it and it is the only way to get rich-text editing in a
   project with no build step and no dependencies — which is a deliberate constraint here,
   not an oversight. If it ever does disappear, the replacement is a real editor library,
   which would mean introducing bundling. */
function bindNotebookEditor(){
  const ed = document.getElementById('note-editor');
  if(!ed) return;
  const toolbar = document.getElementById('note-toolbar');

  const scheduleSave = ()=>{
    clearTimeout(NOTE_SAVE_TIMER);
    // Autosave never re-renders: doing so would wipe the caret out from under the typist.
    NOTE_SAVE_TIMER = setTimeout(()=>{
      const tree = findTree(NOTEBOOK_TREE);
      if(!tree) return;
      const html = sanitizeNotebook(ed.innerHTML);
      if((ed.textContent || '').length > NOTE_MAX_CHARS){
        showToast(tr('note.limitReached'), 'error');
      }
      if(tree.notebook !== html){ tree.notebook = html; save(); }
    }, 500);
  };

  const syncToolbar = ()=>{
    if(!toolbar) return;
    toolbar.querySelectorAll('[data-fmt]').forEach(b=>{
      const cmd = b.dataset.fmt;
      let on = false;
      try{
        on = cmd === 'formatBlock'
          ? /h2/i.test(document.queryCommandValue('formatBlock') || '')
          : document.queryCommandState(cmd);
      }catch(_){}
      b.classList.toggle('active', !!on);
    });
  };

  if(toolbar){
    toolbar.querySelectorAll('[data-fmt]').forEach(b=>{
      // mousedown+preventDefault, never click: a click would move focus to the button
      // first, collapsing the very selection the command is supposed to act on.
      b.addEventListener('mousedown',(e)=>{
        e.preventDefault();
        const cmd = b.dataset.fmt;
        ed.focus();
        try{
          if(cmd === 'formatBlock'){
            const isH = /h2/i.test(document.queryCommandValue('formatBlock') || '');
            document.execCommand('formatBlock', false, isH ? 'div' : 'h2');
          }else{
            document.execCommand(cmd, false, null);
          }
        }catch(_){}
        syncToolbar();
        scheduleSave();
      });
    });
    const linkBtn = toolbar.querySelector('[data-insert-link]');
    if(linkBtn) linkBtn.addEventListener('mousedown',(e)=>{
      e.preventDefault();
      stashNoteRange();   // captured while the editor is still focused
      openNodePicker();
    });
  }

  ed.addEventListener('input', ()=>{ scheduleSave(); syncToolbar(); });
  ed.addEventListener('keyup', syncToolbar);
  ed.addEventListener('mouseup', syncToolbar);
  ed.addEventListener('blur', ()=>{ stashNoteRange(); flushNotebook(); });

  // Paste is the one place arbitrary markup can enter, so it is rebuilt from a sanitized
  // fragment rather than letting the browser insert whatever was on the clipboard.
  ed.addEventListener('paste',(e)=>{
    e.preventDefault();
    const dt = e.clipboardData;
    if(!dt) return;
    const raw = dt.getData('text/html') || esc(dt.getData('text/plain') || '').replace(/\n/g,'<br>');
    const clean = sanitizeNotebook(raw);
    const tpl = document.createElement('template'); tpl.innerHTML = clean;
    const addedLen = (tpl.content.textContent || '').length;
    if((ed.textContent || '').length + addedLen > NOTE_MAX_CHARS){
      showToast(tr('note.pasteTooBig', {n: NOTE_MAX_CHARS.toLocaleString(localeTag())}), 'error');
      return;
    }
    try{ document.execCommand('insertHTML', false, clean); }catch(_){}
    scheduleSave();
  });

  // A node link is one indivisible object: contenteditable="false" keeps the caret out,
  // so Backspace removes the whole thing, and a plain tap navigates instead of editing.
  // There are no modifier keys on a phone, so tap-to-follow is the only workable choice.
  ed.addEventListener('click',(e)=>{
    const a = e.target.closest('a[data-nodelink]');
    if(!a) return;
    e.preventDefault();
    const id = a.getAttribute('data-nodelink');
    const tree = findTree(NOTEBOOK_TREE);
    if(!tree || !findNode(tree.root, id)){
      showToast(tr('note.gone'));
      return;
    }
    flushNotebook();
    PENDING_FOCUS_NODE = {treeId: NOTEBOOK_TREE, nodeId: id};
    openTree(NOTEBOOK_TREE);
  });

  syncToolbar();
}

function stashNoteRange(){
  const sel = window.getSelection();
  const ed = document.getElementById('note-editor');
  if(sel && sel.rangeCount && ed && ed.contains(sel.anchorNode)){
    NOTE_SAVED_RANGE = sel.getRangeAt(0).cloneRange();
  }
}

function insertNodeLink(nodeId){
  const tree = findTree(NOTEBOOK_TREE);
  const node = tree && findNode(tree.root, nodeId);
  closeNodePicker();
  const ed = document.getElementById('note-editor');
  if(!tree || !node || !ed) return;
  ed.focus();
  // The editor was never re-rendered, so the stashed range still points at live nodes.
  const sel = window.getSelection();
  sel.removeAllRanges();
  if(NOTE_SAVED_RANGE && ed.contains(NOTE_SAVED_RANGE.startContainer)){
    sel.addRange(NOTE_SAVED_RANGE);
  }else{
    const r = document.createRange(); r.selectNodeContents(ed); r.collapse(false); sel.addRange(r);
  }
  // Only the id is stored; the label is re-resolved from the node on every open.
  const html = `<a class="node-link" data-nodelink="${esc(node.id)}" contenteditable="false">${esc(node.text)}</a>&nbsp;`;
  try{ document.execCommand('insertHTML', false, html); }catch(_){}
  flushNotebook();
}

// Appends rather than replaces: the reminder must never overwrite what's already written.
function appendNodeLinkToNotebook(treeId,nodeId){
  const tree = findTree(treeId);
  const node = tree && findNode(tree.root, nodeId);
  if(!tree || !node) return;
  const link = `<div><a class="node-link" data-nodelink="${esc(node.id)}" contenteditable="false">${esc(node.text)}</a>&nbsp;</div>`;
  tree.notebook = sanitizeNotebook((tree.notebook || '') + link);
  save();
}

/* Aims the camera so the node sits in the middle of the viewport. Everything comes from
   the numbers renderTreeCanvas() cached — no per-node DOM measuring, which is a standing
   rule in this file (see the note above computeTreeLayout). */
function focusNodeInTree(){
  const req = PENDING_FOCUS_NODE;
  PENDING_FOCUS_NODE = null;
  if(!req) return;
  const viewport = document.getElementById('tree-viewport');
  const el = document.querySelector(`.node-pos[data-nodeid="${req.nodeId}"]`);
  if(!viewport || !el){ showToast(tr('note.gone')); return; }

  const rawX = parseFloat(el.dataset.rawx), rawY = parseFloat(el.dataset.rawy);
  const cx = rawX + TREE_CANVAS_OFF.x;                     // node centre, canvas space
  const cy = rawY + TREE_CANVAS_OFF.y + TREE_CARD_MAX_H/2;
  const s = 1;                                             // predictable scale on arrival
  // Inverse of the transform in applyTreeZoom(): with transform-origin top center the
  // canvas's left edge lands at x + W*(1-s)/2 and its top edge at y.
  TREE_ZOOM = {
    scale: s,
    x: viewport.clientWidth/2  - TREE_CANVAS_W*(1-s)/2 - cx*s,
    y: viewport.clientHeight/2 - cy*s
  };
  TREE_ZOOM_READY = true;
  applyTreeZoom();

  el.classList.add('node-focused');
  clearTimeout(HIGHLIGHT_NODE);
  HIGHLIGHT_NODE = setTimeout(()=>{ el.classList.remove('node-focused'); }, 2400);
}

/* ---- share/import actions ---- */

async function exportTreeAsFile(){
  const t = findTree(EXPORT_TREE);
  if(!t) return;
  const json = JSON.stringify(serializeTreeForShare(t, EXPORT_OPTS), null, 2);
  const fname = shareFileName(t.name);
  // On a phone this opens the system sheet (Telegram/WhatsApp/mail), which is exactly the
  // handover we want; everywhere else it falls back to a plain download.
  try{
    const file = new File([json], fname, {type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[file]}) && navigator.share){
      await navigator.share({files:[file], title:t.name});
      return;
    }
  }catch(e){
    if(e && e.name === 'AbortError') return;   // user dismissed the sheet
  }
  try{
    const url = URL.createObjectURL(new Blob([json], {type:'application/json'}));
    const a = document.createElement('a');
    a.href = url; a.download = fname;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
    showToast(tr('toast.fileSaved',{name:fname}));
  }catch(_){ showToast(tr('toast.fileSaveFailed'), 'error'); }
}

async function exportTreeAsLink(){
  const t = findTree(EXPORT_TREE);
  if(!t) return;
  const link = await buildShareLink(serializeTreeForShare(t, EXPORT_OPTS));
  if(link.length > SHARE_LINK_MAX){
    // Truncated links are worse than no link: they look valid and fail on the far side.
    showToast(tr('toast.tooBigForLink'), 'error');
    return;
  }
  EXPORT_LINK = link;
  try{
    await navigator.clipboard.writeText(link);
    showToast(tr('toast.linkCopied'));
  }catch(_){
    showToast(tr('toast.linkCopyFailed'));
    render();
  }
}

/* People copy a chatbot's answer straight out of the chat, so the JSON usually arrives
   wrapped in a markdown fence and padded with blank lines. Peel that off; everything
   inside goes to the validator untouched. */
function stripCodeFence(text){
  const s = String(text == null ? '' : text).trim();
  const fenced = /^```[^\n]*\r?\n([\s\S]*?)\r?\n?```$/.exec(s);
  if(fenced) return fenced[1].trim();
  // Half a fence: the selection started or stopped one line short of the closing ticks.
  return s.replace(/^```[^\n]*\r?\n?/, '').replace(/\r?\n?```$/, '').trim();
}

/* Deliberately thin: it only tells apart "this isn't JSON at all" from "this is JSON but
   not ours" — the two mistakes someone grabbing the wrong slice of a chat actually makes
   — and then hands the very same string to parseSharePayload(). Depth caps, node caps,
   clamping, type/color checks and notebook sanitising all still happen there, once. */
function parsePastedTree(text){
  const s = stripCodeFence(text);
  if(!s) return {error:tr('err.emptyPaste')};
  let raw;
  try{ raw = JSON.parse(s); }
  catch(_){
    return {error:tr('err.notJson')};
  }
  if(!raw || typeof raw !== 'object' || Array.isArray(raw) || raw.app !== SHARE_APP){
    return {error:tr('err.notOurJson',{app:SHARE_APP})};
  }
  return parseSharePayload(s);
}

// Reads whichever paste box the button belongs to: the one on the AI-prompt screen, or
// the one in the settings modal. Both feed the same preview dialog as a file import.
function importPastedTree(btn){
  const box = (btn.closest('.modal') || document.getElementById('app')).querySelector('.paste-box');
  if(!box) return;
  const parsed = parsePastedTree(box.value);
  if(parsed.error){ showToast(parsed.error, 'error'); return; }  // text stays put, so it can be fixed
  box.value = '';
  openImportPreview(parsed);
}

/* Clipboard needs a secure context, which file:// isn't — and that's exactly how someone
   testing a downloaded copy will open the app. Fall back to selecting the text so the
   platform's own copy gesture still works, and never let the rejection escape. */
async function copyAiPrompt(){
  const text = buildAiPrompt();
  try{
    if(!navigator.clipboard || !navigator.clipboard.writeText) throw new Error('no clipboard');
    await navigator.clipboard.writeText(text);
    showToast(tr('ai.copied'));
  }catch(_){
    selectAiPromptText();
    showToast(tr('ai.copyFailed'), 'error');
  }
}

function selectAiPromptText(){
  const el = document.getElementById('ai-prompt-text');
  if(!el) return;
  try{
    const range = document.createRange();
    range.selectNodeContents(el);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    el.scrollIntoView({block:'nearest'});
  }catch(_){ /* selection API unavailable — the text is still on screen to copy by hand */ }
}

// Rejects on cancel as well as on failure, and neither is worth a message.
async function shareAiPrompt(){
  try{ await navigator.share({title:tr('ai.shareTitle'), text: buildAiPrompt()}); }
  catch(_){}
}

function openImportPreview(parsed){
  if(!parsed || parsed.error){
    showToast((parsed && parsed.error) || tr('toast.dataFailed'), 'error');
    return;
  }
  IMPORT_DRAFT = Object.assign({}, parsed, {name: clampStr(parsed.payload.tree.name, SHARE_LIM.name) || tr('import.defaultName')});
  MODAL = 'import';
  render();
}

// Nothing is written until the user confirms, and a failed save() rolls the whole thing
// back rather than leaving a half-applied import behind.
function commitImport(){
  const d = IMPORT_DRAFT;
  if(!d) return;
  let tree;
  try{ tree = buildTreeFromPayload(d.payload, d.name); }
  catch(_){ showToast(tr('toast.parseFailed'), 'error'); return; }

  DATA.trees.push(tree);
  if(!save()){
    DATA.trees.pop();                          // save() already explained why it failed
    return;
  }
  IMPORT_DRAFT = null; MODAL = null;
  openTree(tree.id);
  showToast(tr('toast.treeAdded',{name:tree.name}));
}

/* A link opened from a messenger carries the tree in the fragment. It is consumed once:
   the hash is cleared immediately so a reload can't import a second copy and someone
   else's data doesn't linger in the address bar. */
async function checkShareHash(){
  const hash = location.hash;
  if(!hash || !hash.startsWith(SHARE_HASH_PREFIX)) return;
  history.replaceState(null, '', location.pathname + location.search);
  openImportPreview(await readShareHash(hash));
}

function confirmSafe(msg){ try{ return window.confirm(msg); }catch(e){ return true; } }

// Host that WebViewAssetLoader serves the bundled copy from inside the Android APK.
const ANDROID_ASSET_HOST = 'appassets.androidplatform.net';

// Only works over http(s) (registration is a no-op on file://, which is fine — the app is
// fully self-contained and already works offline via localStorage).
//
// Inside the APK it's deliberately skipped: the loader serves over https, so the protocol
// check alone would pass and the worker would install. It isn't needed there — the files
// are already local — and it would actively hurt, because its cache outlives an app
// update and would keep serving the previous build's UI after the user installs a new APK.
if('serviceWorker' in navigator && location.protocol.startsWith('http')
   && location.hostname !== ANDROID_ASSET_HOST){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(e=>console.error('SW registration failed', e));
  });
}

load();
</script>
