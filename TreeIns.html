<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>GoalTree</title>

<!-- PWA: lets "Add to Home Screen" install this as a standalone app on iOS/Android -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2F4A3C">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<!-- iOS Safari ignores the manifest for standalone/icon behavior, needs these explicitly -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GoalTree">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<style>
  :root{
    --bg:#F7F1E5; --bg-alt:#EDE4D2; --paper:#FBF7EC; --ink:#23281F; --ink-soft:#63614f;
    --pine:#2F4A3C; --pine-light:#4C6F5B; --gold:#C9932C; --gold-soft:#EAD199; --rust:#A6542A;
    --line:#C9BC98; --shadow:0 2px 10px rgba(47,74,60,.08),0 1px 2px rgba(47,74,60,.10);
    --grid-dot:rgba(35,40,31,.14);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  html[data-theme="dark"]{
    --bg:#121212; --bg-alt:#1A1A1A; --paper:#1E1E1E; --ink:#ECECEC; --ink-soft:#9C9C9C;
    --pine:#6FAE93; --pine-light:#4F7A67; --gold:#E8C874; --gold-soft:#33301E; --rust:#D98A63;
    --line:#333333; --shadow:0 4px 18px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.04);
    --grid-dot:rgba(255,255,255,.10);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 25%, rgba(0,0,0,.025) 0, transparent 2px),
      radial-gradient(circle at 65% 60%, rgba(0,0,0,.02) 0, transparent 2px),
      var(--bg);
    background-size:26px 26px, 34px 34px, auto;
    color:var(--ink); font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    min-height:100vh; font-size:16px; -webkit-text-size-adjust:100%;
  }
  html[data-theme="dark"] body{
    background:
      radial-gradient(1px 1px at 40% 30%, rgba(255,255,255,.06), transparent),
      radial-gradient(1px 1px at 25% 60%, rgba(255,255,255,.05), transparent),
      var(--bg);
    background-size:100% 100%, 100% 100%, auto;
  }

  #app{max-width:460px; margin:0 auto; padding:16px 14px calc(84px + var(--safe-b)); min-height:100vh; position:relative; z-index:2;}

  /* ---------- top bar ---------- */
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;position:sticky;top:0;
    background:linear-gradient(var(--bg) 80%, transparent); padding:6px 0 8px; z-index:5;}
  .brand{display:flex;align-items:center;gap:8px;}
  .brand-mark{width:30px;height:30px;flex:none;}
  html[data-theme="dark"] .brand-mark path{fill:#7FB7A3;}
  html[data-theme="dark"] .brand-mark rect{fill:#C9932C;}
  .brand h1{font-size:19px;margin:0;letter-spacing:.01em;font-weight:600;color:var(--pine);}
  .topbar-right{display:flex;align-items:center;gap:8px;}
  .icon-btn{background:var(--paper);border:1px solid var(--line);border-radius:12px;width:40px;height:40px;
    display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;box-shadow:var(--shadow);}
  .streak-pill{display:flex;align-items:center;gap:6px;background:var(--paper);border:1px solid var(--line);
    border-radius:999px;padding:5px 12px 5px 6px;box-shadow:var(--shadow);cursor:pointer;}
  .streak-pill .ring{width:26px;height:26px;}
  .streak-pill .num{font-family:"Menlo","Consolas",monospace;font-size:15px;font-weight:600;color:var(--pine);}

  /* ---------- bottom nav ---------- */
  nav.tabs{position:fixed; left:0; right:0; bottom:0; display:flex; justify-content:center; z-index:20;
    background:linear-gradient(transparent, var(--bg) 30%); padding-top:14px;}
  nav.tabs .inner{max-width:460px; width:100%; margin:0 14px; background:var(--paper); border:1px solid var(--line);
    border-radius:22px; display:flex; box-shadow:0 6px 20px rgba(0,0,0,.16); padding:6px; padding-bottom:calc(6px + var(--safe-b));}
  nav.tabs button{flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:2px;
    padding:8px 4px; border-radius:16px; cursor:pointer; color:var(--ink-soft); font-family:"Avenir Next","Segoe UI",sans-serif;}
  nav.tabs button .ic{font-size:19px;}
  nav.tabs button .t{font-size:10px; letter-spacing:.04em; text-transform:uppercase;}
  nav.tabs button.active{color:var(--pine); background:var(--gold-soft);}
  nav.tabs button.active .ic{transform:translateY(-1px) scale(1.1);}

  /* ---------- home / cards ---------- */
  .list{display:flex; flex-direction:column; gap:12px;}
  .card{background:var(--paper); border:1px solid var(--line); border-radius:26px 30px 24px 30px; padding:16px;
    box-shadow:var(--shadow); position:relative; display:flex; gap:12px; align-items:flex-start; cursor:pointer;}
  .card .accent{width:5px; align-self:stretch; border-radius:4px; flex:none;}
  .card .body{flex:1; min-width:0;}
  .card .sprigs{font-size:10px; letter-spacing:2px; margin-bottom:2px; opacity:.8;}
  .card .row1{display:flex; align-items:center; gap:8px;}
  .card .stage-emoji{font-size:24px; flex:none; filter:drop-shadow(0 1px 1px rgba(0,0,0,.08));}
  .card .stage-emoji.glow{filter:drop-shadow(0 0 8px var(--gold));}
  .card h3{margin:0; font-size:16px; color:var(--pine); line-height:1.25;}
  .card p.goal{margin:2px 0 0; font-size:12.5px; color:var(--ink-soft); font-style:italic;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .card .meta-row{display:flex; justify-content:space-between; align-items:center; margin-top:8px;
    font-family:"Avenir Next","Segoe UI",sans-serif; font-size:11px; color:var(--ink-soft);}
  .card .bar{height:6px; background:var(--bg-alt); border-radius:3px; overflow:hidden; margin-top:6px;}
  .card .bar i{display:block; height:100%;}
  .card .del{position:absolute; top:10px; right:10px; background:none; border:none; color:var(--ink-soft);
    font-size:13px; cursor:pointer; opacity:.4; padding:6px;}
  .card .del:hover{opacity:1; color:var(--rust);}
  .add-card{display:flex; align-items:center; justify-content:center; gap:8px; border-style:dashed;
    color:var(--ink-soft); padding:18px; font-family:"Avenir Next",sans-serif; font-size:14px;}
  .add-card .plus{font-size:22px; color:var(--gold);}

  /* ---------- tree view ---------- */
  .back-btn{font-family:"Avenir Next","Segoe UI",sans-serif; font-size:12px; letter-spacing:.05em; text-transform:uppercase;
    color:var(--ink-soft); background:none; border:none; cursor:pointer; padding:8px 0; display:flex; align-items:center; gap:4px;}
  .tree-title-block{display:flex; align-items:center; gap:10px; margin:4px 0 4px;}
  .tree-title-block .stage-emoji{font-size:30px;}
  .tree-title-block h2{margin:0; font-size:19px; color:var(--pine);}
  .tree-goal-line{font-size:13px; font-style:italic; color:var(--ink-soft); margin:0 0 14px;}

  /* The dot grid lives on the viewport, not on .tree: .tree is only as big as the tree's
     bounding box, so painting the grid there made its edge visible as soon as you panned.
     The viewport is always fully covered, and applyTreeZoom() drives background-size /
     -position so the lattice pans and scales in lockstep with the canvas. */
  .tree-scroll{overflow:hidden; position:relative; padding:8px 0 24px; height:60vh; min-height:340px;
    touch-action:none; -webkit-user-select:none; user-select:none;
    background-image:radial-gradient(circle, var(--grid-dot) 1.5px, transparent 1.5px);
    background-size:26px 26px;}
  .tree-zoom-controls{position:absolute; right:10px; bottom:10px; z-index:10; display:flex; flex-direction:column; gap:6px;}
  .zoom-btn{width:36px; height:36px; border-radius:10px; border:1px solid var(--line); background:var(--paper);
    color:var(--pine); font-size:18px; line-height:1; cursor:pointer; box-shadow:var(--shadow);
    display:flex; align-items:center; justify-content:center; font-family:"Avenir Next",sans-serif;}
  .zoom-btn:hover{background:var(--gold-soft);}
  /* absolute-position layout grid: node coordinates come from computeTreeLayout(),
     not from DOM flow, so alignment can't drift with content width/height. */
  .tree{transform-origin:top center; position:relative; margin:0 auto;}
  /* The wrapper is absolutely positioned by computeTreeLayout(), so anything stacked
     inside it (card + an open add-branch panel) can grow downwards without shifting a
     single other node — the panel gets its exact place under the card for free, with no
     DOM measuring and no second set of coordinates to keep in sync. */
  .node-pos{position:absolute; display:flex; flex-direction:column; align-items:center; gap:8px; z-index:1;}
  .node-draggable{cursor:grab; touch-action:none;}
  .node-draggable.dragging{cursor:grabbing; z-index:10; opacity:.85;}
  /* Only one panel is open at a time, so lifting just that node above its neighbours is
     enough. Re-flowing the row instead would shove every node below it down the screen
     the moment you tap +, moving the very card you're working on. */
  .node-pos.has-panel{z-index:6;}
  .tree-lines{position:absolute; inset:0; z-index:0; pointer-events:none; overflow:visible;}
  .tree-lines path{stroke:var(--line); stroke-width:2; fill:none;}

  .node-card{display:flex; flex-direction:column; align-items:center; gap:5px; background:var(--paper);
    border:1.5px solid var(--pine-light); border-radius:12px; padding:10px 12px; width:160px;
    box-shadow:var(--shadow); position:relative; text-align:center;}
  .node-card.root{color:#F7F1E5;}
  .node-card.task{border-color:var(--line);}
  .node-card.task.done{background:var(--gold-soft); border-color:var(--gold);}

  /* Both text blocks are line-clamped: an unbounded title or description would make cards
     wildly different heights, which breaks the row rhythm and the edge anchors. */
  .node-title{font-size:14px; line-height:1.3; font-weight:600; color:var(--ink); overflow:hidden;
    display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow-wrap:anywhere;}
  .node-card.root .node-title{font-size:15px; color:#F7F1E5;}
  .node-desc{font-size:11.5px; line-height:1.35; color:var(--ink-soft); overflow:hidden;
    display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:3; overflow-wrap:anywhere;}
  .node-card.root .node-desc{color:rgba(247,241,229,.8);}
  .node-progress{font-family:"Menlo",monospace; font-size:10px; color:var(--ink-soft);}
  .node-card.root .node-progress{color:rgba(247,241,229,.75);}

  .node-toggle-row{display:flex; justify-content:center;}
  .leaf-toggle{width:34px; height:34px; border-radius:50%; border:none; background:var(--bg-alt);
    font-size:17px; display:flex; align-items:center; justify-content:center; cursor:pointer; flex:none;}
  .leaf-toggle.bloom{background:var(--gold-soft);}

  /* Icon row: three 30px hit targets + gaps fit inside the 160px card on one line. */
  .node-actions{display:flex; gap:6px; justify-content:center; flex-wrap:nowrap;}
  .icon-act{width:30px; height:30px; flex:none; border:none; border-radius:8px; background:var(--bg-alt);
    font-size:14px; line-height:1; display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .icon-act:hover{background:var(--gold-soft);}
  .icon-act:focus-visible{outline:2px solid var(--gold); outline-offset:1px;}
  .node-card.root .icon-act{background:rgba(255,255,255,.18);}
  /* armed delete: one more press on the same trash confirms, Esc backs out */
  .icon-act.danger-armed{background:var(--rust);}

  /* Sits under the card as its own block: never inflates the card, always travels with
     the node because it lives in the same wrapper inside #tree-canvas. */
  .add-panel{display:flex; gap:6px; align-items:center; background:var(--paper);
    border:1.5px dashed var(--gold); border-radius:12px; padding:8px; width:160px; box-shadow:var(--shadow);}
  .add-panel input{flex:1; min-width:0; font-family:inherit; font-size:16px; /* <16px makes iOS zoom on focus */
    border:1px solid var(--line); border-radius:8px; padding:6px 8px; background:var(--bg); color:var(--ink);}
  .add-panel button{flex:none; width:32px; height:32px; border:none; border-radius:8px; background:var(--pine);
    color:var(--paper); font-size:16px; line-height:1; cursor:pointer;}

  /* ---------- stats ---------- */
  .stats-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .stat-tile{background:var(--paper); border:1px solid var(--line); border-radius:20px 24px 18px 24px; padding:16px; box-shadow:var(--shadow);}
  .stat-tile .val{font-family:"Menlo","Consolas",monospace; font-size:26px; color:var(--pine); font-weight:600;}
  .stat-tile .lbl{font-family:"Avenir Next","Segoe UI",sans-serif; font-size:10.5px; text-transform:uppercase;
    letter-spacing:.06em; color:var(--ink-soft); margin-top:4px;}
  .stat-tile.flame .val{color:var(--gold);}
  .stat-tile.ring-tile{grid-column:1/-1; display:flex; align-items:center; gap:16px;}
  .stat-tile.ring-tile .ring-big{width:64px; height:64px; flex:none;}
  .season-badge{margin-top:14px; display:flex; align-items:center; gap:10px; background:var(--paper);
    border:1px solid var(--line); border-radius:18px; padding:14px 16px;}
  .season-badge .e{font-size:26px;}
  .season-badge .n{font-family:"Avenir Next",sans-serif; font-size:12px; color:var(--ink-soft);}
  .season-badge .n b{display:block; color:var(--pine); font-size:14px; font-family:"Iowan Old Style",serif;}
  .philosophy{margin-top:16px; padding:16px; border-radius:22px 18px 22px 18px; background:var(--pine); color:var(--gold-soft);
    font-style:italic; font-size:13.5px; text-align:center; line-height:1.5;}

  /* ---------- settings screen ---------- */
  .settings-group{background:var(--paper); border:1px solid var(--line); border-radius:20px; padding:6px; margin-bottom:16px;
    box-shadow:var(--shadow);}
  .theme-row{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; padding:10px;}
  .theme-chip{border:1.5px solid var(--line); border-radius:14px; padding:12px 4px; text-align:center; cursor:pointer;
    font-family:"Avenir Next",sans-serif; background:var(--bg);}
  .theme-chip .e{font-size:20px; display:block; margin-bottom:2px;}
  .theme-chip .n{font-size:10.5px; color:var(--ink-soft);}
  .theme-chip.active{border-color:var(--gold); background:var(--gold-soft);}
  .setting-row{display:flex; align-items:center; justify-content:space-between; padding:13px 14px;
    border-top:1px solid var(--line); font-family:"Avenir Next",sans-serif; font-size:13.5px; color:var(--ink);}
  .settings-group .setting-row:first-child{border-top:none;}
  .switch{width:42px; height:24px; border-radius:999px; background:var(--bg-alt); border:1px solid var(--line);
    position:relative; cursor:pointer; flex:none;}
  .switch::after{content:''; position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%;
    background:var(--paper); box-shadow:0 1px 3px rgba(0,0,0,.25);}
  .switch.on{background:var(--pine);}
  .switch.on::after{left:20px; background:var(--gold-soft);}
  .settings-note{font-family:"Avenir Next",sans-serif; font-size:11.5px; color:var(--ink-soft); text-align:center; margin:6px 0 18px;}

  /* ---------- modal / wizard ---------- */
  .overlay{position:fixed; inset:0; background:rgba(35,40,31,.5); display:flex; align-items:flex-end; justify-content:center; z-index:50;}
  .modal{background:var(--paper); border-radius:20px 20px 0 0; padding:22px 20px calc(22px + var(--safe-b));
    width:100%; max-width:460px; box-shadow:0 -10px 30px rgba(0,0,0,.25); max-height:88vh; overflow-y:auto;}
  .modal.center{border-radius:20px; margin-bottom:auto; margin-top:auto;}
  .modal h2{margin:0 0 4px; font-size:18px; color:var(--pine);}
  .modal p.hint{margin:0 0 14px; font-size:12.5px; color:var(--ink-soft); font-family:"Avenir Next",sans-serif;}
  .modal.reminder{text-align:center;}
  /* anywhere-wrap so a long single-word task name can't push the dialog wider than the screen */
  .modal.reminder .reminder-topic{margin:10px 0 0; font-size:15px; font-style:italic; color:var(--pine);
    overflow-wrap:anywhere;}
  .modal label{display:block; font-family:"Avenir Next",sans-serif; font-size:11px; text-transform:uppercase;
    letter-spacing:.05em; color:var(--ink-soft); margin:14px 0 5px;}
  .modal input, .modal textarea{width:100%; font-family:inherit; font-size:16px; border:1px solid var(--line);
    border-radius:10px; padding:11px 12px; background:var(--bg); color:var(--ink);}
  .modal textarea{resize:vertical; min-height:52px;}
  .step-dots{display:flex; gap:5px; margin-bottom:10px;}
  .step-dots i{width:20px; height:4px; border-radius:2px; background:var(--bg-alt); display:block;}
  .step-dots i.active{background:var(--gold);}
  .type-grid, .color-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:4px;}
  .type-chip{border:1.5px solid var(--line); border-radius:12px; padding:12px 4px; text-align:center;
    background:var(--bg); cursor:pointer; font-family:"Avenir Next",sans-serif; color:var(--ink);}
  .type-chip .e{font-size:24px; display:block;}
  .type-chip .n{font-size:10.5px; color:var(--ink-soft); margin-top:2px; display:block;}
  .type-chip.active{border-color:var(--gold); background:var(--gold-soft);}
  .color-grid{grid-template-columns:repeat(5,1fr);}
  .color-chip{width:100%; aspect-ratio:1; border-radius:50%; cursor:pointer; border:3px solid transparent;}
  .color-chip.active{border-color:var(--ink);}
  .modal-actions{display:flex; justify-content:space-between; gap:8px; margin-top:20px;}
  .btn{font-family:"Avenir Next",sans-serif; font-size:14px; border:none; border-radius:10px; padding:11px 18px; cursor:pointer; min-height:44px;}
  .btn.primary{background:var(--pine); color:var(--paper);}
  .btn.ghost{background:none; color:var(--ink-soft);}
  .btn.block{width:100%;}
  .btn.danger{background:var(--rust); color:#fff;}

  .congrats{position:fixed; inset:0; background:rgba(35,40,31,.65); display:flex; align-items:center; justify-content:center;
    z-index:60; padding:20px;}
  .congrats-card{background:var(--paper); border-radius:20px; padding:30px 24px; text-align:center; max-width:320px;
    box-shadow:0 20px 50px rgba(0,0,0,.3);}
  .congrats-card .big-emoji{font-size:54px; display:block; margin-bottom:10px;}
  .congrats-card h2{margin:0 0 8px; color:var(--pine); font-size:19px;}
  .congrats-card p{margin:0 0 18px; color:var(--ink-soft); font-size:13.5px; font-style:italic;}

  /* ---------- notebook ---------- */
  .notebook-btn{margin-left:auto; flex:none; display:flex; align-items:center; gap:5px;
    min-height:30px; padding:5px 10px; border:1px solid var(--line); border-radius:10px;
    background:var(--paper); color:var(--ink-soft); cursor:pointer; position:relative;
    font-family:"Avenir Next","Segoe UI",sans-serif; font-size:12px;}
  .notebook-btn:hover{background:var(--gold-soft); color:var(--pine);}
  .notebook-btn.has-notes::after{content:''; position:absolute; top:3px; right:3px;
    width:7px; height:7px; border-radius:50%; background:var(--gold);}

  .note-wrap{display:flex; flex-direction:column; border:1px solid var(--line);
    border-radius:16px; background:var(--paper); overflow:hidden; box-shadow:var(--shadow);}
  /* Pinned above the text so the on-screen keyboard can never cover it. */
  .note-toolbar{position:sticky; top:0; z-index:2; display:flex; flex-wrap:wrap; gap:4px;
    padding:8px; background:var(--bg-alt); border-bottom:1px solid var(--line);}
  .fmt-btn{min-width:32px; height:32px; padding:0 7px; border:none; border-radius:8px;
    background:var(--paper); color:var(--ink); font-size:14px; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    font-family:"Avenir Next","Segoe UI",sans-serif;}
  .fmt-btn:hover{background:var(--gold-soft);}
  .fmt-btn.active{background:var(--pine); color:var(--paper);}
  .fmt-sep{width:1px; align-self:stretch; background:var(--line); margin:0 2px;}

  .note-editor{min-height:46vh; padding:14px; outline:none; color:var(--ink);
    font-size:16px; /* below 16px iOS zooms the page on focus */ line-height:1.6;
    overflow-wrap:anywhere;}
  .note-editor:empty::before{content:attr(data-placeholder); color:var(--ink-soft); font-style:italic;}
  .note-editor h2{font-size:19px; color:var(--pine); margin:.6em 0 .3em;}
  .note-editor ul, .note-editor ol{padding-left:22px; margin:.4em 0;}
  .note-editor li{margin:.15em 0;}

  .node-link{display:inline-block; padding:1px 7px; border-radius:7px; cursor:pointer;
    background:var(--gold-soft); color:var(--pine); text-decoration:none;
    border:1px solid var(--gold); font-size:.95em;}
  .node-link::before{content:'🌿 ';}
  /* Broken links keep their wording — losing it would lose the note's meaning. */
  .node-link.broken{background:transparent; color:var(--ink-soft); border-style:dashed;
    border-color:var(--line); text-decoration:line-through;}
  .node-link.broken::before{content:'⚠ ';}

  .picker-filter{width:100%; font-family:inherit; font-size:16px; border:1px solid var(--line);
    border-radius:10px; padding:10px 12px; background:var(--bg); color:var(--ink); margin-bottom:10px;}
  .picker-list{max-height:46vh; overflow-y:auto; display:flex; flex-direction:column; gap:2px;}
  .picker-row{text-align:left; border:none; background:none; color:var(--ink); cursor:pointer;
    padding:9px 10px; border-radius:8px; font-family:inherit; font-size:14px; min-height:38px;}
  .picker-row:hover{background:var(--gold-soft); color:var(--pine);}
  .reminder-actions{flex-direction:column; gap:8px;}

  /* Flashed for a couple of seconds after a link jump, so it's obvious where you landed. */
  .node-pos.node-focused .node-card{outline:3px solid var(--gold); outline-offset:3px;}

  /* ---------- sharing ---------- */
  .share-btn{margin-left:6px;}
  .export-opts{margin:12px 0 4px; padding:0;}
  .export-row small{display:block; font-size:11px; color:var(--ink-soft); margin-top:2px;}
  .export-actions{flex-direction:column; gap:8px;}
  .share-link{width:100%; margin-top:10px; font-family:"Menlo","Consolas",monospace; font-size:12px;
    border:1px solid var(--line); border-radius:10px; padding:8px; background:var(--bg);
    color:var(--ink); resize:vertical; word-break:break-all;}
  .import-facts{display:flex; flex-wrap:wrap; gap:8px; margin:14px 0 4px;
    font-family:"Avenir Next","Segoe UI",sans-serif; font-size:12px; color:var(--ink-soft);}
  .import-facts div{background:var(--bg-alt); border-radius:8px; padding:6px 10px;}
  .import-facts b{color:var(--pine);}

  .toast{position:fixed; left:50%; bottom:calc(86px + var(--safe-b)); transform:translateX(-50%);
    max-width:420px; width:calc(100% - 28px); z-index:80; padding:12px 14px; border-radius:12px;
    background:var(--pine); color:var(--paper); box-shadow:0 8px 24px rgba(0,0,0,.3);
    font-family:"Avenir Next","Segoe UI",sans-serif; font-size:13px; line-height:1.45;}
  .toast.error{background:var(--rust); color:#fff;}

  .empty{text-align:center; padding:50px 10px; color:var(--ink-soft); font-style:italic;}
  .section-title{font-family:"Avenir Next",sans-serif; font-size:12px; text-transform:uppercase; letter-spacing:.08em;
    color:var(--ink-soft); margin:18px 0 8px 2px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============ CONSTANTS ============ */
const TYPES = {
  oak:{e:'🌳', n:'Дуб'}, pine:{e:'🌲', n:'Сосна'}, palm:{e:'🌴', n:'Пальма'},
  sakura:{e:'🌸', n:'Сакура'}, bush:{e:'🌿', n:'Куст'}, maple:{e:'🍁', n:'Клён'}
};
const COLORS = {
  green:'#4C6F5B', blue:'#3E6E8E', purple:'#6E5A96', red:'#A6452F', orange:'#C98A2C'
};
const COLOR_NAMES = {green:'Зелёный', blue:'Синий', purple:'Фиолетовый', red:'Красный', orange:'Оранжевый'};
const SEASONS = [
  {days:365, e:'❄', n:'Зимний лес'}, {days:180, e:'🍂', n:'Осень'},
  {days:90, e:'🌿', n:'Лето'}, {days:30, e:'🌱', n:'Весна'}, {days:0, e:'🌤', n:'Начало пути'}
];
function seasonFor(daysActive){ return SEASONS.find(s=>daysActive>=s.days); }

const ICON_MARK = `<svg viewBox="0 0 34 34" class="brand-mark"><path d="M17 4l7 9h-4l6 8h-4l5 9H11l5-9H12l6-8h-4z" fill="#2F4A3C"/><rect x="15" y="27" width="4" height="6" fill="#8a6b3f"/></svg>`;
function ringFlame(pct){
  return `<svg viewBox="0 0 34 34" class="ring">
  <circle cx="17" cy="17" r="14" fill="none" stroke="var(--bg-alt)" stroke-width="3"/>
  <circle cx="17" cy="17" r="14" fill="none" stroke="var(--gold)" stroke-width="3" stroke-linecap="round"
    stroke-dasharray="${Math.min(100,pct)*0.879} 999" transform="rotate(-90 17 17)"/>
  <path d="M17 9c-1 2.6-3.8 4-3.8 7.6a3.8 3.8 0 0 0 7.6 0c0-1.3-.6-2.2-1.2-3 .2 1.2-.4 2-1.1 2-.9 0-1.2-.8-1-1.6.3-1.2-.2-3-.5-5z" fill="var(--gold)"/>
</svg>`;
}
function ringProgress(pct,cls){
  return `<svg viewBox="0 0 60 60" class="${cls||'ring-big'}">
  <circle cx="30" cy="30" r="25" fill="none" stroke="var(--bg-alt)" stroke-width="5"/>
  <circle cx="30" cy="30" r="25" fill="none" stroke="var(--pine)" stroke-width="5" stroke-linecap="round"
    stroke-dasharray="${Math.min(100,pct)*1.5708} 999" transform="rotate(-90 30 30)"/>
  <text x="30" y="35" text-anchor="middle" font-size="15" font-family="Menlo,monospace" fill="var(--pine)">${pct}%</text>
</svg>`;
}

/* ============ STATE ============ */
const KEY = 'goaltree:data:v2';
let DATA = null;
let VIEW = 'home';
let CURRENT_TREE = null;
let PENDING_DELETE = null;
let OPEN_FORM = null;
let MODAL = null;            // 'newtree' | 'export' | 'import' | null
let WIZ_STEP = 1;
let WIZ_DRAFT = null;
let EXPORT_TREE = null;      // tree id being shared
let EXPORT_OPTS = {marks:false, notes:false}; // both off by default: ticks and notes are private
let EXPORT_LINK = null;      // built lazily; null until the user asks for a link
let IMPORT_DRAFT = null;     // {payload, nodeCount, hasNotes, hasMarks, name} awaiting confirmation
let CONGRATS_TREE = null;    // tree id currently showing congrats overlay
let REMINDER = null;         // {treeId, nodeId} task that just got ticked, showing the "write it down" nudge
let NODE_POPOVER = null;     // {treeId, nodeId} node currently open in the edit popover
let TREE_ZOOM = {scale:1, x:0, y:0}; // pan/zoom state for the tree canvas, reset whenever a tree is (re)opened
let TREE_ZOOM_READY = false; // whether the initial centering pass has run for the currently open tree
let NOTEBOOK_TREE = null;    // tree id whose notebook is open (VIEW==='notebook')
let NOTE_SAVE_TIMER = null;  // debounce handle for the notebook's autosave
let NOTE_SAVED_RANGE = null; // caret position stashed while the node picker steals focus
let NODE_PICKER = null;      // {treeId} while the insert-link picker is open
let NODE_PICKER_FILTER = '';
let PENDING_FOCUS_NODE = null; // {treeId,nodeId} to centre the camera on after the tree renders
let HIGHLIGHT_NODE = null;     // node id to flash once the camera lands
let TREE_CANVAS_OFF = {x:0,y:0}; // offX/offY from the last renderTreeCanvas() (see there)
let TREE_CANVAS_W = 0;       // canvas width from the last renderTreeCanvas(), cached so the
                             // per-pointermove grid math never touches DOM layout

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

// Local calendar date, not UTC: toISOString() rolls the day over at 00:00 UTC, so for
// anyone east/west of Greenwich "today" flipped at the wrong hour and daily tasks reset
// mid-evening or stayed checked past midnight.
function todayISO(){
  const d = new Date(), p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
// Whole-calendar-day difference. Both sides are reduced to bare Y/M/D and compared in a
// single fixed frame, so the result never drifts by a day across timezones or DST — and
// dates already stored in UTC form by older builds still diff correctly, since they're
// the same 'YYYY-MM-DD' shape.
function dayIndex(iso){
  const [y,m,d] = String(iso||'').slice(0,10).split('-').map(Number);
  if(!y || !m || !d) return NaN; // malformed/absent date in old saves — don't invent one
  return Date.UTC(y, m-1, d);
}
// NaN in means "unknown", and 0 out keeps callers on their neutral branch instead of
// letting a bogus huge gap wipe a streak or skew the stats.
function daysBetween(a,b){
  const diff = (dayIndex(b) - dayIndex(a))/86400000;
  return Number.isFinite(diff) ? Math.round(diff) : 0;
}

function defaultSettings(){ return { theme:'auto', sound:false, notifications:false, taskReminder:true }; }

// Settings added after launch default to ON, so saves written before they existed (where
// the key is simply absent) must read as enabled rather than disabled. Everything else
// keeps the original "absent = off" meaning.
const SETTINGS_DEFAULT_ON = ['taskReminder'];
function settingEnabled(key){
  const v = DATA.settings ? DATA.settings[key] : undefined;
  return SETTINGS_DEFAULT_ON.includes(key) ? v !== false : !!v;
}

function defaultData(){
  return {
    trees:[{
      id:'daily', isDaily:true, name:'Ежедневные задания', goal:null, type:null, color:'green',
      createdAt:todayISO(), lastActivity:null,
      root:{ id:'daily-root', text:'Ежедневные задания', children:[] }
    }],
    streak:{ current:0, best:0, lastActiveDate:null, totalCompleted:0, activeDates:[], firstUseDate:todayISO() },
    settings: defaultSettings()
  };
}

/* ---- theme ---- */
function effectiveTheme(){
  const pref = (DATA && DATA.settings && DATA.settings.theme) || 'auto';
  if(pref==='auto') return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  return pref;
}
function applyTheme(){
  document.documentElement.setAttribute('data-theme', effectiveTheme());
}
if(window.matchMedia){
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>{
    if(DATA && DATA.settings && DATA.settings.theme==='auto'){ applyTheme(); }
  });
}

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    DATA = raw ? JSON.parse(raw) : defaultData();
  }catch(e){ DATA = defaultData(); }
  if(!DATA.settings) DATA.settings = defaultSettings();
  migrateRemoveCorner();
  checkStreakDecay();
  applyTheme();
  render();
  startDayWatcher();
  startEscHandler();
  startNotebookFlush();
  checkShareHash();
}

// Bound once for the page's lifetime. A phone can kill a backgrounded tab without warning
// and pagehide is the last reliable moment to write, so the notebook is flushed on the way
// out rather than trusting the 500ms autosave to have fired.
let NOTE_FLUSH_BOUND = false;
function startNotebookFlush(){
  if(NOTE_FLUSH_BOUND) return;
  NOTE_FLUSH_BOUND = true;
  document.addEventListener('visibilitychange', ()=>{ if(document.hidden) flushNotebook(); });
  window.addEventListener('pagehide', flushNotebook);
}
/* The "start point" concept was removed: trees still carrying a leftover corner
   node get it dissolved, with its children promoted to be root's direct children. */
function migrateRemoveCorner(){
  let changed = false;
  for(const t of DATA.trees){
    if(t.isDaily) continue;
    const corner = t.root.children.find(c=>c.isCorner);
    if(corner){
      t.root.children = t.root.children.filter(c=>c!==corner).concat(corner.children);
      changed = true;
    }
  }
  if(changed) save();
}
// Returns whether the write landed. Notebooks are free text and will be the first thing
// to hit the ~5MB localStorage ceiling, and silently dropping a page someone just typed
// is the worst possible failure — so callers can react, and save() itself surfaces the
// problem rather than only logging it.
function save(){
  try{
    localStorage.setItem(KEY, JSON.stringify(DATA));
    return true;
  }catch(e){
    console.error(e);
    const quota = e && (e.name === 'QuotaExceededError'
      || e.name === 'NS_ERROR_DOM_QUOTA_REACHED' || e.code === 22 || e.code === 1014);
    showToast(quota
      ? 'Не удалось сохранить: хранилище заполнено. Освободите место — удалите ненужное дерево или сократите заметки.'
      : 'Не удалось сохранить изменения.', 'error');
    return false;
  }
}

// Injected straight into the DOM instead of going through render(): a failed save can
// happen while the notebook's contenteditable is focused, and re-rendering there would
// destroy the caret and the very text we're warning about.
let TOAST_TIMER = null;
function showToast(msg, kind){
  let el = document.getElementById('toast');
  if(!el){
    el = document.createElement('div');
    el.id = 'toast';
    document.body.appendChild(el);
  }
  el.className = 'toast' + (kind === 'error' ? ' error' : '');
  el.textContent = msg;
  clearTimeout(TOAST_TIMER);
  TOAST_TIMER = setTimeout(()=>{ el.remove(); }, kind === 'error' ? 6000 : 2600);
}

function checkStreakDecay(){
  const s = DATA.streak;
  if(s.lastActiveDate){
    if(daysBetween(s.lastActiveDate, todayISO()) > 1) s.current = 0;
  }
}

/* ---- day rollover ----
   Daily tasks aren't stored per-day and are never deleted: isDoneToday() just compares
   completedDate to today, so the checkmarks lapse on their own the moment the date
   changes. What was missing is making a long-lived tab NOTICE that change — this is a PWA
   people leave open for days, so until now yesterday's checkmarks stayed on screen until
   a manual reload. Nothing here clears completedDate: the history feeds the streak. */
let DAY_WATCHER_ON = false;
let LAST_SEEN_DAY = null;

function msUntilLocalMidnight(){
  const now = new Date();
  // +2s past midnight so the timer never fires a hair early and still reads yesterday
  const next = new Date(now.getFullYear(), now.getMonth(), now.getDate()+1, 0, 0, 2, 0);
  return Math.max(1000, next - now);
}

function applyDayRolloverIfNeeded(){
  const today = todayISO();
  if(LAST_SEEN_DAY === today) return false;
  LAST_SEEN_DAY = today;
  checkStreakDecay();
  save();
  // The streak work above always runs; the repaint deliberately does not while the
  // notebook is open. This fires on every visibilitychange/focus, not just at midnight,
  // so re-rendering here would blow away the contenteditable — caret, selection and any
  // keystrokes not yet flushed — every time someone switched apps mid-sentence. Nothing
  // on the notebook screen displays day-dependent data, and leaving it re-renders anyway,
  // so skipping the repaint there costs nothing.
  if(DATA && VIEW !== 'notebook') render();
  return true;
}

// Armed once for the page's lifetime, not per render(): render() rebuilds #app.innerHTML,
// but this hangs off window/document, so re-arming there would pile up duplicate timers
// and listeners. A sleeping phone can skip the timer entirely, hence the visibility/focus
// re-check on the way back in.
function startDayWatcher(){
  if(DAY_WATCHER_ON) return;
  DAY_WATCHER_ON = true;
  LAST_SEEN_DAY = todayISO();
  let timer = null;
  const arm = ()=>{
    clearTimeout(timer);
    timer = setTimeout(()=>{ applyDayRolloverIfNeeded(); arm(); }, msUntilLocalMidnight());
  };
  arm();
  const recheck = ()=>{ if(!document.hidden && applyDayRolloverIfNeeded()) arm(); };
  document.addEventListener('visibilitychange', recheck);
  window.addEventListener('focus', recheck);
}

// Bound once for the page's lifetime — render() replaces #app.innerHTML, so anything
// re-bound per render would stack up duplicates. Esc backs out of whichever transient
// state is open: the add-branch panel, an armed delete, or the edit popover.
let ESC_BOUND = false;
function startEscHandler(){
  if(ESC_BOUND) return;
  ESC_BOUND = true;
  document.addEventListener('keydown',(e)=>{
    if(e.key!=='Escape') return;
    // the picker lives outside render(), so it closes itself rather than via a repaint
    if(NODE_PICKER){ closeNodePicker(); return; }
    if(!OPEN_FORM && !PENDING_DELETE && !NODE_POPOVER && !REMINDER) return;
    OPEN_FORM = null; PENDING_DELETE = null; NODE_POPOVER = null; REMINDER = null;
    render();
  });
}
function recordActivity(){
  const s = DATA.streak; const today = todayISO();
  if(s.lastActiveDate !== today){
    if(!s.lastActiveDate) s.current = 1;
    else{ const gap = daysBetween(s.lastActiveDate, today); s.current = (gap===1) ? s.current+1 : 1; }
    s.lastActiveDate = today;
    if(!s.activeDates.includes(today)) s.activeDates.push(today);
  }
  if(s.current > s.best) s.best = s.current;
}

/* ============ NODE HELPERS ============ */
function findTree(id){ return DATA.trees.find(t=>t.id===id); }
function findNode(root,id){ if(root.id===id) return root; for(const c of root.children){ const r=findNode(c,id); if(r) return r; } return null; }
function findParent(root,id){ for(const c of root.children){ if(c.id===id) return root; const r=findParent(c,id); if(r) return r; } return null; }
// Single source of truth for "is this node done": ordinary trees store a boolean in
// `completed`, the daily tree stores a date in `completedDate` that only counts for today.
// Everything (progress, cards, dots, popover, toggle) must go through this or the two
// formats drift apart — that's why daily progress used to read a permanent 0/N.
function isNodeDone(tree,node){
  return tree && tree.isDaily ? isDoneToday(node) : !!node.completed;
}
function progressOf(tree,node){
  // Counts every descendant node once by its OWN checkbox (branches included, not just leaves).
  let done=0,total=0;
  for(const c of node.children){
    total+=1; if(isNodeDone(tree,c)) done+=1;
    const p = progressOf(tree,c); done+=p.done; total+=p.total;
  }
  return {done,total};
}
function isDoneToday(node){ return !!node.completedDate && node.completedDate === todayISO(); }
function relDate(iso){
  if(!iso) return 'ещё не начато';
  const g = daysBetween(iso, todayISO());
  if(g<=0) return 'сегодня'; if(g===1) return 'вчера'; if(g<7) return g+' дн. назад';
  // build a LOCAL date: new Date('YYYY-MM-DD') is UTC midnight, which formats as the
  // previous day for anyone behind Greenwich
  const [y,m,d] = iso.slice(0,10).split('-').map(Number);
  return new Date(y, m-1, d).toLocaleDateString('ru-RU',{day:'numeric',month:'short'});
}
function stageOf(pct){
  if(pct>=100) return 'grown'; if(pct>=80) return 'ripe'; if(pct>=50) return 'big';
  if(pct>=20) return 'young'; return 'seed';
}
function stageEmoji(tree, pct){
  if(tree.isDaily) return '🌳';
  const type = TYPES[tree.type||'oak'].e;
  const s = stageOf(pct);
  if(s==='seed') return '🌱';
  if(s==='young') return '🌿';
  return type; // big, ripe, grown all show the chosen species
}

/* ============ ACTIONS ============ */
function actionAddTree(draft){
  const id = uid();
  DATA.trees.push({
    id, isDaily:false, name:draft.name.trim(), goal:draft.goal.trim()||null,
    type:draft.type, color:draft.color, createdAt:todayISO(), lastActivity:null,
    root:{ id:uid(), text:draft.goal.trim()||draft.name.trim(), children:[] }
  });
  MODAL=null; WIZ_DRAFT=null; save(); openTree(id);
}
function actionDeleteTree(id){ DATA.trees = DATA.trees.filter(t=>t.id!==id); save(); render(); }
function actionAddNode(treeId,parentId,text){
  const tree = findTree(treeId); const parent = findNode(tree.root,parentId);
  const node = { id:uid(), text:text.trim(), children:[] };
  if(treeId==='daily') node.completedDate=null; else node.completed=false;
  parent.children.push(node); OPEN_FORM=null; save(); render();
}
function actionDeleteNode(treeId,nodeId){
  const tree = findTree(treeId); const parent = findParent(tree.root,nodeId);
  if(parent) parent.children = parent.children.filter(c=>c.id!==nodeId);
  PENDING_DELETE=null; save(); render();
}
function actionEditNode(treeId,nodeId,data){
  const tree = findTree(treeId); const node = findNode(tree.root,nodeId);
  node.text = data.text.trim();
  node.description = data.description.trim() || null;
  if(node.id===tree.root.id && !tree.isDaily) tree.goal = node.text;
  NODE_POPOVER=null; save(); render();
}
function actionToggle(treeId,nodeId){
  const tree = findTree(treeId); const node = findNode(tree.root,nodeId); const s = DATA.streak;
  const before = progressOf(tree,tree.root); const pctBefore = before.total ? before.done/before.total*100 : 0;

  let justCompleted = false; // ticking ON only; unticking goes through the same function
  if(treeId==='daily'){
    const wasDone = isDoneToday(node);
    node.completedDate = wasDone ? null : todayISO();
    justCompleted = !wasDone;
    if(!wasDone){ s.totalCompleted++; recordActivity(); } else s.totalCompleted = Math.max(0,s.totalCompleted-1);
  }else{
    node.completed = !node.completed;
    justCompleted = node.completed;
    if(node.completed){ s.totalCompleted++; recordActivity(); } else s.totalCompleted = Math.max(0,s.totalCompleted-1);
  }
  tree.lastActivity = todayISO();

  const after = progressOf(tree,tree.root); const pctAfter = after.total ? after.done/after.total*100 : 0;
  save();
  const treeJustFinished = !tree.isDaily && pctBefore<100 && pctAfter>=100 && after.total>0;
  if(treeJustFinished) CONGRATS_TREE = treeId;
  // The nudge is for a real task in a normal tree. Daily habits ("drink water") have no
  // topic to write up and would nag every day. When this tick also finished the tree we
  // deliberately drop the reminder instead of queueing it: two overlays at once is wrong,
  // and on a completed tree the congrats card is the only thing worth showing.
  if(justCompleted && !treeJustFinished && !tree.isDaily && node.id!==tree.root.id && settingEnabled('taskReminder')){
    REMINDER = {treeId, nodeId};
  }
  render();
}
function actionResetAll(){
  DATA = defaultData(); MODAL=null; save(); goHome();
}

/* ============ VIEW NAV ============ */
function openTree(id){ flushNotebook(); CURRENT_TREE=id; VIEW='tree'; OPEN_FORM=null; PENDING_DELETE=null; NODE_POPOVER=null; REMINDER=null; NODE_PICKER=null; TREE_ZOOM={scale:1,x:0,y:0}; TREE_ZOOM_READY=false; render(); }
function goHome(){ flushNotebook(); VIEW='home'; CURRENT_TREE=null; NODE_POPOVER=null; REMINDER=null; NODE_PICKER=null; render(); }
function goStats(){ flushNotebook(); VIEW='stats'; REMINDER=null; NODE_PICKER=null; render(); }
function goSettings(){ flushNotebook(); VIEW='settings'; REMINDER=null; NODE_PICKER=null; render(); }
function goNotebook(treeId){
  NOTEBOOK_TREE = treeId; VIEW='notebook';
  OPEN_FORM=null; PENDING_DELETE=null; NODE_POPOVER=null; REMINDER=null;
  NODE_PICKER=null; NODE_PICKER_FILTER=''; NOTE_SAVED_RANGE=null;
  render();
}

/* ============ RENDER ============ */
function render(){
  const app = document.getElementById('app');
  app.innerHTML = renderTopbar() +
    `<div class="content">` +
    (VIEW==='home' ? renderHome() : VIEW==='tree' ? renderTreeView()
      : VIEW==='notebook' ? renderNotebookView()
      : VIEW==='settings' ? renderSettingsView() : renderStats()) +
    `</div>` +
    renderBottomNav() +
    (MODAL ? renderModal() : '') +
    (NODE_POPOVER ? renderNodePopover() : '') +
    (REMINDER ? renderReminder() : '') +
    (CONGRATS_TREE ? renderCongrats() : '');
  bindEvents();
}

function renderTopbar(){
  return `
  <div class="topbar">
    <div class="brand">${ICON_MARK}<h1>GoalTree</h1></div>
    <div class="topbar-right">
      <div class="streak-pill" data-go="stats">${ringFlame(Math.min(100,DATA.streak.current))}<span class="num">${DATA.streak.current}</span></div>
      <button class="icon-btn" data-go="settings">⚙️</button>
    </div>
  </div>`;
}

function renderBottomNav(){
  return `<nav class="tabs"><div class="inner">
    <button data-go="home" class="${VIEW==='home'||VIEW==='tree'||VIEW==='notebook'?'active':''}"><span class="ic">🌳</span><span class="t">Лес</span></button>
    <button data-go="stats" class="${VIEW==='stats'?'active':''}"><span class="ic">📊</span><span class="t">Рост</span></button>
    <button data-go="settings" class="${VIEW==='settings'?'active':''}"><span class="ic">⚙️</span><span class="t">Настройки</span></button>
  </div></nav>`;
}

function renderHome(){
  const daily = DATA.trees.find(t=>t.isDaily);
  const custom = DATA.trees.filter(t=>!t.isDaily);
  function card(t){
    const p = progressOf(t,t.root); const pct = p.total ? Math.round(p.done/p.total*100) : 0;
    const color = COLORS[t.color||'green'];
    const emoji = stageEmoji(t,pct);
    const glow = pct>=80 && !t.isDaily ? 'glow' : '';
    const sprigCount = Math.max(1, Math.min(5, p.total || 1));
    const sprigs = (t.isDaily ? '🍃' : (p.done>0 ? '🌸' : '🌿')).repeat(sprigCount);
    return `

// Layout pass (Reingold-Tilford-lite, no DOM measurement): every leaf gets the next
// free x slot, every parent's x is the average of its children's, so subtrees never
// overlap and a linear chain stays on one straight column. A node with a saved
// node.pos uses that instead of the computed position (manual drag override) and
// doesn't consume an auto x-slot, so its auto-laid-out siblings re-tighten around it
// rather than leaving a gap. row 0 = root, row 1 = root's children, etc. — rows only
// drive the fallback y for auto-positioned nodes; a dragged node can sit anywhere.
function computeTreeLayout(tree){
  const layout = new Map(); // nodeId -> {x, row, posY}
  let nextX = 0;

  function visit(node,isRoot,row){
    let x;
    if(node.children.length===0){
      if(node.pos) x = node.pos.x;
      else { x = nextX; nextX += TREE_COL_WIDTH; }
    }else{
      const childXs = node.children.map(c=>visit(c,false,row+1));
      const autoX = childXs.reduce((a,b)=>a+b,0)/childXs.length;
      x = node.pos ? node.pos.x : autoX;
    }
    layout.set(node.id,{x,row,posY:node.pos?node.pos.y:null});
    return x;
  }
  visit(tree.root,true,0);

  // Every node is a card now, so the row pitch is a single constant.
  for(const pos of layout.values()){
    pos.y = pos.posY!==null ? pos.posY : pos.row*TREE_CARD_ROW_STEP;
  }
  return layout;
}

// Icon-only action row. Every icon carries title + aria-label because a bare pictogram
// tells a screen reader nothing, and the boxes are 30px so they stay tappable on a phone.
function renderNodeActionsRow(tree,node,isRoot){
  const isDaily = tree.isDaily;
  const canDelete = !isRoot;
  const armed = PENDING_DELETE===node.id;
  // Nested daily tasks are allowed now, so every node can grow children; only the wording
  // differs, since the daily root collects "задания" rather than "ветки".
  const addLabel = isRoot && isDaily ? 'Добавить задание' : 'Добавить ветку';

  const actions = [
    `<button type="button" class="icon-act" data-editnode="${tree.id}|${node.id}" title="Редактировать" aria-label="Редактировать">✏️</button>`,
    `<button type="button" class="icon-act" data-addform="${node.id}" title="${addLabel}" aria-label="${addLabel}">➕</button>`
  ];
  if(canDelete){
    actions.push(armed
      ? `<button type="button" class="icon-act danger-armed" data-confirmdel="${tree.id}|${node.id}" title="Нажмите ещё раз, чтобы удалить" aria-label="Подтвердить удаление">🗑️</button>`
      : `<button type="button" class="icon-act" data-askdel="${node.id}" title="Удалить" aria-label="Удалить">🗑️</button>`);
  }
  return `<div class="node-actions">${actions.join('')}</div>`;
}

// Card contents, top to bottom, all centred: title, optional description, optional
// progress, the completion flower on its own row, then the icon row.
function renderNodeCard(tree,node,isRoot){
  const checkable = !isRoot; // root is the goal itself: nothing to tick, nothing to delete
  const done = isNodeDone(tree,node);
  const hasChildren = node.children.length>0;
  const prog = hasChildren ? progressOf(tree,node) : null;
  const rootStyle = isRoot ? `style="background:${COLORS[tree.color||'green']};border-color:${COLORS[tree.color||'green']}"` : '';

  let inner = `<div class="node-card ${isRoot?'root':'task'} ${done&&checkable?'done':''}" ${rootStyle}>`;
  inner += `<div class="node-title" title="${esc(node.text)}">${esc(node.text)}</div>`;
  // omitted entirely when absent, so a description-less card leaves no empty band
  if(node.description) inner += `<div class="node-desc" title="${esc(node.description)}">${esc(node.description)}</div>`;
  if(prog && prog.total>0) inner += `<div class="node-progress">${prog.done}/${prog.total}</div>`;
  if(checkable) inner += `<div class="node-toggle-row"><button type="button" class="leaf-toggle ${done?'bloom':''}" data-toggle="${tree.id}|${node.id}" title="${done?'Снять отметку':'Отметить выполненным'}" aria-label="${done?'Снять отметку':'Отметить выполненным'}">${done?'🌸':'🍃'}</button></div>`;
  inner += renderNodeActionsRow(tree,node,isRoot);
  inner += `</div>`;
  return inner;
}

// Separate block below the card — deliberately a sibling of .node-card, not a child, so
// opening it can never change the card's own height (which the edge anchors depend on).
function renderAddPanel(tree,node){
  const isDaily = tree.isDaily;
  return `<form class="add-panel" data-addchild="${tree.id}|${node.id}">
    <input type="text" id="add-branch-input" placeholder="${isDaily?'например, выпить воду':'например, Математика'}"
      aria-label="Название новой ветки" required>
    <button type="submit" title="Добавить" aria-label="Добавить">↵</button>
  </form>`;
}

// Card box is 160 wide; +30 of gutter keeps neighbouring cards visibly apart.
const TREE_COL_WIDTH = 190;
// Tallest a card can get, from its CSS: 20 padding + 3 border + 2 title lines (36) +
// 3 clamped description lines (47) + progress (12) + flower row (34) + icon row (30) +
// 4 gaps of 5 (20) ≈ 202. Both line clamps are what make this an actual ceiling.
const TREE_CARD_MAX_H = 210;
// Row pitch = that ceiling plus ~50 of breathing room for the connecting curve.
const TREE_CARD_ROW_STEP = 250;

// Edges anchor at a point INSIDE the card rather than at its bottom edge. Card height
// still varies with content (root vs task, description present or not), so any single
// height constant would be wrong for most nodes — an over-estimate is exactly what used
// to leave lines starting in empty space below the card. The line layer sits under the
// (opaque) cards, so whatever runs beneath one is hidden and the edge visually starts at
// its true border, at any height and without measuring the DOM. This must stay an
// UNDER-estimate: the shortest possible card (root, one-line title, no description) is
// ~76px tall, so 34 is safely inside every card.
const TREE_CARD_ANCHOR_INSET = 34;
function nodeAnchorY(top){ return top + TREE_CARD_ANCHOR_INSET; }

const TREE_PAD = 50; // margin around the tree's bounding box so nothing hugs the canvas edge

// Smooth S-curve between two node anchors. Control points are pulled along the vertical
// gap, so it stays clean for straight-down chains, for branching, and when a node is
// dragged above or beside its parent (negative dy just flips the pull).
function bezierD(x1,y1,x2,y2){
  // Coerce first: callers pass dataset values, which are strings — "200"+500 concatenates
  // into "200500" and the control points end up ~100000px off-canvas, drawing the edge as
  // a long thin needle instead of a curve.
  x1=+x1; y1=+y1; x2=+x2; y2=+y2;
  const dy = y2-y1;
  const pull = Math.max(Math.abs(dy)*0.5, 28) * (dy<0 ? -1 : 1);
  return `M${x1},${y1} C${x1},${y1+pull} ${x2},${y2-pull} ${x2},${y2}`;
}

// Renders every node as a flat, absolutely-positioned element using computeTreeLayout()'s
// coordinates instead of nested <ul><li> flow — position never depends on a card's own
// content width/height, so alignment can't drift (see Prerequisite 1). The whole layout
// (auto positions + any manual node.pos) is measured and shifted so its bounding box
// starts at TREE_PAD,TREE_PAD, and the canvas is sized to fit exactly — a node dragged
// far outside the auto grid just grows the canvas instead of getting clipped.
function renderTreeCanvas(tree){
  const layout = computeTreeLayout(tree);

  let minX=Infinity, maxX=-Infinity, minY=Infinity, maxY=-Infinity;
  for(const pos of layout.values()){
    minX = Math.min(minX, pos.x-TREE_COL_WIDTH/2); maxX = Math.max(maxX, pos.x+TREE_COL_WIDTH/2);
    minY = Math.min(minY, pos.y); maxY = Math.max(maxY, pos.y+TREE_CARD_MAX_H);
  }
  const offX = TREE_PAD - minX, offY = TREE_PAD - minY;
  const width = maxX-minX+TREE_PAD*2, height = maxY-minY+TREE_PAD*2;

  const cx = (pos)=> pos.x+offX;
  const topY = (pos)=> pos.y+offY;
  const anchorY = (pos)=> nodeAnchorY(topY(pos));

  let items = '';
  let lines = '';
  function place(node,isRoot){
    const pos = layout.get(node.id);
    const left = cx(pos) - TREE_COL_WIDTH/2;
    const top = topY(pos);
    const panelOpen = OPEN_FORM===node.id;
    const inner = renderNodeCard(tree,node,isRoot) + (panelOpen ? renderAddPanel(tree,node) : '');
    items += `<div class="node-pos${isRoot?'':' node-draggable'}${panelOpen?' has-panel':''}" data-nodeid="${node.id}" data-rawx="${pos.x}" data-rawy="${pos.y}" style="left:${left}px; top:${top}px; width:${TREE_COL_WIDTH}px;">${inner}</div>`;
    node.children.forEach(c=>{
      const cpos = layout.get(c.id);
      const x1=cx(pos), y1=anchorY(pos), x2=cx(cpos), y2=anchorY(cpos);
      lines += `<path data-from="${node.id}" data-to="${c.id}" data-x1="${x1}" data-y1="${y1}" data-x2="${x2}" data-y2="${y2}" d="${bezierD(x1,y1,x2,y2)}"/>`;
      place(c,false);
    });
  }
  place(tree.root,true);

  // Cached here, while the numbers are already known, so applyTreeZoom() can position the
  // background grid on every pointermove — and focusNodeInTree() can aim the camera at a
  // node — without ever reading layout back from the DOM.
  TREE_CANVAS_W = width;
  TREE_CANVAS_OFF = {x:offX, y:offY};

  const svg = `<svg class="tree-lines" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">${lines}</svg>`;
  return {html:svg+items, width, height};
}

function plural(n, one, few, many){
  const a = Math.abs(n) % 100, b = a % 10;
  if(a > 10 && a < 20) return many;
  if(b > 1 && b < 5) return few;
  if(b === 1) return one;
  return many;
}

/* ============ NOTEBOOK ============
   Each tree carries its own free-text notes in tree.notebook (HTML). Older saves simply
   don't have the field, hence the `|| ''` everywhere — no migration, no KEY bump. */

const NOTE_MAX_CHARS = 100000; // ~a long chapter; well under the localStorage ceiling
// Only what the toolbar and the link picker can actually produce. execCommand emits
// b/i/strike/ul/ol/li/div/br and formatBlock headings; everything else that arrives via
// paste gets unwrapped (text kept) or dropped outright.
const NOTE_OK_TAGS = new Set(['B','STRONG','I','EM','S','STRIKE','DEL','U','H2','H3','P','DIV','BR','UL','OL','LI','A']);
const NOTE_KILL_TAGS = new Set(['SCRIPT','STYLE','IFRAME','OBJECT','EMBED','IMG','SVG','LINK','META','VIDEO','AUDIO','CANVAS','FORM','INPUT','BUTTON','TEXTAREA','SELECT']);

// Runs on paste AND on every read from storage: the app file gets updated while saved
// notebooks stay exactly as they were, so stored HTML can never be treated as trusted.
// <template> parses without running scripts or fetching anything.
function sanitizeNotebook(html){
  const tpl = document.createElement('template');
  tpl.innerHTML = String(html || '');
  const unwrap = (n)=>{ const f = document.createDocumentFragment();
    while(n.firstChild) f.appendChild(n.firstChild); n.replaceWith(f); };
  (function clean(parent){
    [...parent.childNodes].forEach(n=>{
      if(n.nodeType === 3) return;                 // text survives untouched
      if(n.nodeType !== 1){ n.remove(); return; }  // comments, CDATA, …
      clean(n);                                    // depth-first, so unwrapping is final
      const tag = n.tagName;
      if(NOTE_KILL_TAGS.has(tag)){ n.remove(); return; }   // images included: one photo as
      if(!NOTE_OK_TAGS.has(tag)){ unwrap(n); return; }     // base64 would eat the quota
      const link = tag === 'A' ? n.getAttribute('data-nodelink') : null;
      // Blanket attribute strip kills style, on* handlers, href="javascript:" and the rest
      // in one go; the two attributes a node link needs are put back explicitly.
      [...n.attributes].forEach(a=>n.removeAttribute(a.name));
      if(tag === 'A'){
        if(!link){ unwrap(n); return; }            // ordinary links become plain text
        n.setAttribute('data-nodelink', link);
        n.setAttribute('class', 'node-link');
        n.setAttribute('contenteditable', 'false');
      }
    });
  })(tpl.content);
  return tpl.innerHTML;
}

// Labels are resolved at display time, never frozen at insert time — otherwise renaming a
// task would leave the old wording sitting in the notes forever.
function resolveNoteLinks(tree, html){
  const tpl = document.createElement('template');
  tpl.innerHTML = html;
  tpl.content.querySelectorAll('a[data-nodelink]').forEach(a=>{
    const node = findNode(tree.root, a.getAttribute('data-nodelink'));
    if(node){
      a.textContent = node.text;
      a.classList.remove('broken');
      a.setAttribute('title', node.text);
    }else{
      // Keep whatever text is there: losing the wording would lose the note's meaning.
      a.classList.add('broken');
      a.setAttribute('title', 'Задание удалено');
    }
  });
  return tpl.innerHTML;
}

// Writes the editor's current HTML into DATA without touching the screen. Anything that
// replaces #app.innerHTML must call this first, or the last keystrokes die with the node.
function flushNotebook(){
  const ed = document.getElementById('note-editor');
  if(!ed || !NOTEBOOK_TREE) return;
  const tree = findTree(NOTEBOOK_TREE);
  if(!tree) return;
  clearTimeout(NOTE_SAVE_TIMER); NOTE_SAVE_TIMER = null;
  const html = sanitizeNotebook(ed.innerHTML);
  if(tree.notebook !== html){ tree.notebook = html; save(); }
}

function notebookIsEmpty(tree){
  const html = tree && tree.notebook || '';
  const tpl = document.createElement('template'); tpl.innerHTML = html;
  return !(tpl.content.textContent || '').trim() && !tpl.content.querySelector('a[data-nodelink]');
}

/* Flat list with indentation so the tree's shape stays readable, plus a filter for trees
   too big to scan. Only this tree's nodes — cross-notebook links are out of scope.

   Deliberately mounted straight into the DOM instead of going through render(): render()
   rebuilds #app.innerHTML, which would replace the editor with whatever was last written
   to tree.notebook, losing both un-flushed keystrokes and the live caret the link is
   supposed to be inserted at. Appending leaves the editor untouched, so the real
   selection is still there when the user picks a node. */
function pickerRowsHtml(tree){
  const q = NODE_PICKER_FILTER.trim().toLowerCase();
  const rows = [];
  (function walk(node, depth){
    if(!q || node.text.toLowerCase().includes(q)){
      rows.push(`<button type="button" class="picker-row" data-picknode="${node.id}"
        style="padding-left:${10 + depth*16}px">${esc(node.text)}</button>`);
    }
    node.children.forEach(c=>walk(c, depth+1));
  })(tree.root, 0);
  return rows.length ? rows.join('') : '<p class="hint">Ничего не найдено</p>';
}

function openNodePicker(){
  const tree = findTree(NOTEBOOK_TREE);
  if(!tree) return;
  closeNodePicker();
  NODE_PICKER = {treeId: tree.id}; NODE_PICKER_FILTER = '';
  const wrap = document.createElement('div');
  wrap.className = 'overlay';
  wrap.id = 'node-picker';
  wrap.innerHTML = `<div class="modal center">
    <h2>Ссылка на задание</h2>
    <input type="text" id="picker-filter" class="picker-filter" placeholder="Найти задание…" aria-label="Фильтр заданий">
    <div class="picker-list" id="picker-list">${pickerRowsHtml(tree)}</div>
    <div class="modal-actions"><button class="btn ghost block" id="picker-cancel">Отмена</button></div>
  </div>`;
  document.getElementById('app').appendChild(wrap);

  wrap.addEventListener('click',(e)=>{ if(e.target === wrap) closeNodePicker(); });
  wrap.querySelector('#picker-cancel').addEventListener('click', closeNodePicker);
  const filter = wrap.querySelector('#picker-filter');
  filter.addEventListener('input',()=>{
    NODE_PICKER_FILTER = filter.value;
    // only the list is redrawn, so the input keeps its own focus and caret
    wrap.querySelector('#picker-list').innerHTML = pickerRowsHtml(tree);
    bindPickerRows(wrap);
  });
  bindPickerRows(wrap);
  filter.focus();
}

function bindPickerRows(wrap){
  wrap.querySelectorAll('[data-picknode]').forEach(el=>
    el.addEventListener('click',()=>insertNodeLink(el.dataset.picknode)));
}

function closeNodePicker(){
  const el = document.getElementById('node-picker');
  if(el) el.remove();
  NODE_PICKER = null;
}

/* ============ SHARING ============
   There is no backend, so "sharing" means handing over a SNAPSHOT, not granting access:
   after import the two trees are unrelated copies. Anything arriving here is untrusted —
   it came out of a messenger — so every field is validated, clamped and sanitised before
   it is allowed anywhere near DATA. */

const SHARE_APP = 'goaltree';
const SHARE_FORMAT = 1;                 // bump when the shape changes incompatibly
const SHARE_HASH_PREFIX = '#gt';        // fragment marker: #gt=<plain> or #gtz=<gzipped>
const SHARE_LINK_MAX = 8000;            // beyond this, messengers and browsers start truncating
const IMPORT_MAX_NODES = 2000;
const IMPORT_MAX_DEPTH = 50;            // findNode/progressOf/computeTreeLayout all recurse
const SHARE_LIM = {name:120, goal:400, text:200, description:2000, notebook:100000};

function clampStr(v, max){
  if(typeof v !== 'string') return '';
  return v.replace(/\s+/g,' ').trim().slice(0, max);
}

/* What actually leaves the device. Completion marks and the notebook are opt-in: the
   recipient wants the shape of the goal, not someone else's ticks, and notes are private. */
function serializeTreeForShare(tree, opts){
  const withMarks = !!(opts && opts.marks), withNotes = !!(opts && opts.notes);
  function packNode(n){
    const o = { text: clampStr(n.text, SHARE_LIM.text), children: (n.children||[]).map(packNode) };
    const d = clampStr(n.description, SHARE_LIM.description);
    if(d) o.description = d;
    if(n.pos && isFinite(+n.pos.x) && isFinite(+n.pos.y)) o.pos = {x:+n.pos.x, y:+n.pos.y};
    if(withMarks){
      if(n.completed === true) o.completed = true;
      if(n.completedDate) o.completedDate = n.completedDate;
    }
    // The id travels only alongside notes: it exists purely so the importer can remap
    // a[data-nodelink] onto the freshly generated ids. Without notes it is dead weight,
    // and ids are regenerated on import regardless.
    if(withNotes) o.id = n.id;
    return o;
  }
  const packed = {
    name: clampStr(tree.name, SHARE_LIM.name),
    goal: tree.goal ? clampStr(tree.goal, SHARE_LIM.goal) : null,
    type: TYPES[tree.type] ? tree.type : 'oak',
    color: COLORS[tree.color] ? tree.color : 'green',
    root: packNode(tree.root)
  };
  if(withNotes && tree.notebook){
    packed.notebook = sanitizeNotebook(tree.notebook).slice(0, SHARE_LIM.notebook);
  }
  return { app: SHARE_APP, format: SHARE_FORMAT, exportedAt: new Date().toISOString(), tree: packed };
}

/* Returns {payload,nodeCount,…} or {error} — never throws, so no input can white-screen
   the app. The size/depth caps run BEFORE anything is built, because the rest of the app
   walks trees recursively and a deep file would overflow the stack. */
function parseSharePayload(text){
  let raw;
  try{ raw = JSON.parse(text); }
  catch(_){ return {error:'Не удалось прочитать файл: это не похоже на файл GoalTree.'}; }
  if(!raw || typeof raw !== 'object' || Array.isArray(raw)) return {error:'Файл пуст или повреждён.'};
  if(raw.app !== SHARE_APP) return {error:'Это не файл GoalTree.'};
  if(typeof raw.format !== 'number') return {error:'В файле не указана версия формата.'};
  if(raw.format > SHARE_FORMAT) return {error:'Файл сделан в более новой версии приложения — обновите GoalTree.'};
  const t = raw.tree;
  if(!t || typeof t !== 'object' || !t.root || typeof t.root !== 'object') return {error:'В файле нет дерева.'};

  let count = 0, tooDeep = false, tooBig = false;
  (function scan(n, depth){
    if(tooBig || tooDeep) return;
    if(depth > IMPORT_MAX_DEPTH){ tooDeep = true; return; }
    if(++count > IMPORT_MAX_NODES){ tooBig = true; return; }
    const kids = Array.isArray(n.children) ? n.children : [];
    for(const k of kids){ if(k && typeof k === 'object') scan(k, depth+1); if(tooBig||tooDeep) return; }
  })(t.root, 1);
  if(tooDeep) return {error:`Дерево слишком глубокое (больше ${IMPORT_MAX_DEPTH} уровней) — такой файл не поддерживается.`};
  if(tooBig)  return {error:`В дереве больше ${IMPORT_MAX_NODES} узлов — такой файл не поддерживается.`};

  return {
    payload: raw,
    nodeCount: count,
    hasNotes: !!t.notebook,
    hasMarks: JSON.stringify(t.root).includes('"completed"')
  };
}

/* Fresh ids everywhere: a shared file may carry id:'daily' / 'daily-root', which would
   collide with the recipient's daily tree, and reusing ids would make importing the same
   tree twice impossible. */
function buildTreeFromPayload(payload, nameOverride){
  const t = payload.tree;
  const idMap = new Map();
  function makeNode(src){
    const id = uid();
    if(src.id) idMap.set(String(src.id), id);
    const n = { id, text: clampStr(src.text, SHARE_LIM.text) || 'Без названия', children: [] };
    const d = clampStr(src.description, SHARE_LIM.description);
    if(d) n.description = d;
    if(src.pos && isFinite(+src.pos.x) && isFinite(+src.pos.y)) n.pos = {x:+src.pos.x, y:+src.pos.y};
    // Imported trees are never the daily one, so state always lives in `completed`;
    // a completedDate from someone's daily tree collapses into a plain tick.
    n.completed = src.completed === true || !!src.completedDate;
    const kids = Array.isArray(src.children) ? src.children : [];
    for(const k of kids){ if(k && typeof k === 'object') n.children.push(makeNode(k)); }
    return n;
  }
  const root = makeNode(t.root);
  const tree = {
    id: uid(),
    isDaily: false,          // exactly one daily tree may exist; a second breaks renderHome
    name: clampStr(nameOverride, SHARE_LIM.name) || clampStr(t.name, SHARE_LIM.name) || 'Импортированное дерево',
    goal: clampStr(t.goal, SHARE_LIM.goal) || null,
    type: TYPES[t.type] ? t.type : 'oak',      // unknown values would crash TYPES[...].e
    color: COLORS[t.color] ? t.color : 'green',
    createdAt: todayISO(),
    lastActivity: null,
    root
  };
  if(typeof t.notebook === 'string' && t.notebook){
    // sanitise BEFORE storing, not at display time: this HTML came from a stranger
    const clean = sanitizeNotebook(t.notebook.slice(0, SHARE_LIM.notebook));
    tree.notebook = remapNoteLinks(clean, idMap);
  }
  return tree;
}

// Notebook links hold node ids, which we just regenerated — without this every link in an
// imported note would point at nothing. Links whose target isn't in the file keep their
// old id and simply render as broken, which resolveNoteLinks() already handles.
function remapNoteLinks(html, idMap){
  const tpl = document.createElement('template');
  tpl.innerHTML = html;
  tpl.content.querySelectorAll('a[data-nodelink]').forEach(a=>{
    const fresh = idMap.get(String(a.getAttribute('data-nodelink')));
    if(fresh) a.setAttribute('data-nodelink', fresh);
  });
  return tpl.innerHTML;
}

const SHARE_TRANSLIT = {а:'a',б:'b',в:'v',г:'g',д:'d',е:'e',ё:'e',ж:'zh',з:'z',и:'i',й:'y',
  к:'k',л:'l',м:'m',н:'n',о:'o',п:'p',р:'r',с:'s',т:'t',у:'u',ф:'f',х:'h',ц:'c',ч:'ch',
  ш:'sh',щ:'sch',ъ:'',ы:'y',ь:'',э:'e',ю:'yu',я:'ya'};
function shareFileName(name){
  const base = String(name || '').toLowerCase().split('')
    .map(ch => SHARE_TRANSLIT[ch] !== undefined ? SHARE_TRANSLIT[ch] : ch).join('')
    .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40);
  return `goaltree-${base || 'tree'}.json`;
}

function b64url(bytes){
  let s = '';
  for(const b of bytes) s += String.fromCharCode(b);
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function unb64url(str){
  const s = String(str).replace(/-/g,'+').replace(/_/g,'/');
  const bin = atob(s + '==='.slice((s.length + 3) % 4));
  const out = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
  return out;
}

/* The payload goes in the FRAGMENT, never a query parameter: fragments are not sent to
   the server, so the contents of someone's tree never reach a hosting log. */
async function buildShareLink(payload){
  const json = JSON.stringify(payload);
  let bytes = new TextEncoder().encode(json);
  let gz = false;
  if(typeof CompressionStream === 'function'){
    try{
      const stream = new Blob([bytes]).stream().pipeThrough(new CompressionStream('gzip'));
      bytes = new Uint8Array(await new Response(stream).arrayBuffer());
      gz = true;
    }catch(_){ /* fall back to uncompressed */ }
  }
  const base = location.origin + location.pathname;
  return base + SHARE_HASH_PREFIX + (gz ? 'z=' : '=') + b64url(bytes);
}

async function readShareHash(hash){
  const m = /^#gt(z?)=(.+)$/.exec(hash || '');
  if(!m) return null;
  try{
    let bytes = unb64url(m[2]);
    if(m[1] === 'z'){
      if(typeof DecompressionStream !== 'function') return {error:'Ссылка сжата, а этот браузер не умеет её распаковать. Попросите прислать файл.'};
      const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      bytes = new Uint8Array(await new Response(stream).arrayBuffer());
    }
    return parseSharePayload(new TextDecoder().decode(bytes));
  }catch(_){
    return {error:'Ссылка повреждена или обрезана при пересылке. Попросите прислать файл.'};
  }
}

function renderCongrats(){

function esc(s){
