  return d.innerHTML.replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

/* ============ EVENTS ============ */
function bindEvents(){
  const app = document.getElementById('app');

  app.querySelectorAll('[data-go]').forEach(el=>el.addEventListener('click',()=>{
    const v = el.dataset.go; if(v==='home') goHome(); else if(v==='stats') goStats(); else if(v==='settings') goSettings();
  }));
  app.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click',(e)=>{
    if(e.target.closest('[data-del-tree]')) return; openTree(el.dataset.open);
  }));
  app.querySelectorAll('[data-del-tree]').forEach(el=>el.addEventListener('click',(e)=>{
    e.stopPropagation();
    if(confirmSafe('Удалить дерево «'+findTree(el.dataset.delTree).name+'» вместе со всеми ветками?')) actionDeleteTree(el.dataset.delTree);
  }));
  const newTreeCard = app.querySelector('[data-new-tree]');
  if(newTreeCard) newTreeCard.addEventListener('click',()=>{ MODAL='newtree'; WIZ_STEP=1; WIZ_DRAFT=null; render(); });

  app.querySelectorAll('[data-toggle]').forEach(el=>el.addEventListener('click',()=>{
    const [tid,nid]=el.dataset.toggle.split('|'); actionToggle(tid,nid);
  }));
  app.querySelectorAll('[data-set-theme]').forEach(el=>el.addEventListener('click',()=>{
    DATA.settings.theme = el.dataset.setTheme; save(); applyTheme(); render();
  }));
  app.querySelectorAll('[data-toggle-setting]').forEach(el=>el.addEventListener('click',()=>{
    const key = el.dataset.toggleSetting;
    // Negate the EFFECTIVE value, not the raw one: for a default-on key that's still
    // absent from an older save, `!undefined` would write `true` and the first tap would
    // silently do nothing. Behaviour for the default-off keys is unchanged.
    DATA.settings[key] = !settingEnabled(key); save(); render();
  }));
  // Opening the add panel clears any armed delete, so the two never sit armed at once.
  app.querySelectorAll('[data-addform]').forEach(el=>el.addEventListener('click',()=>{ OPEN_FORM=el.dataset.addform; PENDING_DELETE=null; render(); }));
  app.querySelectorAll('[data-askdel]').forEach(el=>el.addEventListener('click',()=>{ PENDING_DELETE=el.dataset.askdel; OPEN_FORM=null; render(); }));
  app.querySelectorAll('[data-confirmdel]').forEach(el=>el.addEventListener('click',()=>{
    const [tid,nid]=el.dataset.confirmdel.split('|'); actionDeleteNode(tid,nid);
  }));
  app.querySelectorAll('[data-addchild]').forEach(el=>el.addEventListener('submit',(e)=>{
    e.preventDefault(); const [tid,nid]=el.dataset.addchild.split('|'); const val=el.querySelector('input').value;
    if(val.trim()) actionAddNode(tid,nid,val);
  }));
  // autofocus doesn't fire reliably on an element injected via innerHTML, so focus here.
  const addInput = app.querySelector('#add-branch-input');
  if(addInput){ addInput.focus(); addInput.select(); }
  app.querySelectorAll('[data-editnode]').forEach(el=>el.addEventListener('click',()=>{
    const [tid,nid]=el.dataset.editnode.split('|'); NODE_POPOVER={treeId:tid,nodeId:nid}; render();
  }));
  app.querySelectorAll('[data-close-nodepop]').forEach(el=>el.addEventListener('click',(e)=>{
    if(e.target===el || el.tagName==='BUTTON'){ NODE_POPOVER=null; render(); }
  }));
  const saveEditBtn = app.querySelector('[data-save-editnode]');
  if(saveEditBtn) saveEditBtn.addEventListener('click',()=>{
    const text = document.getElementById('edit-text').value;
    if(!text.trim()) return;
    const description = document.getElementById('edit-desc').value;
    actionEditNode(NODE_POPOVER.treeId, NODE_POPOVER.nodeId, {text, description});
  });

  /* modal close */
  app.querySelectorAll('[data-close-modal]').forEach(el=>el.addEventListener('click',(e)=>{
    if(e.target===el || el.tagName==='BUTTON'){
      MODAL=null; WIZ_DRAFT=null; IMPORT_DRAFT=null; EXPORT_LINK=null; render();
    }
  }));
  app.querySelectorAll('[data-stop]').forEach(el=>el.addEventListener('click',(e)=>e.stopPropagation()));
  const resetBtn = app.querySelector('[data-reset-all]');
  if(resetBtn) resetBtn.addEventListener('click',()=>{
    if(confirmSafe('Точно сбросить все данные? Это действие необратимо.')) actionResetAll();
  });

  /* wizard */
  const nextBtn = app.querySelector('[data-wiz-next]');
  if(nextBtn) nextBtn.addEventListener('click',()=>{
    if(WIZ_STEP===1){ const v = document.getElementById('wiz-name').value; if(!v.trim()) return; WIZ_DRAFT.name=v; }
    if(WIZ_STEP===2){ const v = document.getElementById('wiz-goal').value; WIZ_DRAFT.goal=v; }
    WIZ_STEP++; render();
  });
  const backBtn = app.querySelector('[data-wiz-back]');
  if(backBtn) backBtn.addEventListener('click',()=>{
    if(WIZ_STEP===2){ const v=document.getElementById('wiz-goal'); if(v) WIZ_DRAFT.goal=v.value; }
    WIZ_STEP--; render();
  });
  app.querySelectorAll('[data-wiz-type]').forEach(el=>el.addEventListener('click',()=>{ WIZ_DRAFT.type=el.dataset.wizType; render(); }));
  app.querySelectorAll('[data-wiz-color]').forEach(el=>el.addEventListener('click',()=>{ WIZ_DRAFT.color=el.dataset.wizColor; render(); }));
  const createBtn = app.querySelector('[data-wiz-create]');
  if(createBtn) createBtn.addEventListener('click',()=>{ actionAddTree(WIZ_DRAFT); });

  /* congrats */
  app.querySelectorAll('[data-close-reminder]').forEach(el=>el.addEventListener('click',(e)=>{
    if(e.target===el || el.tagName==='BUTTON'){ REMINDER=null; render(); }
  }));
  app.querySelectorAll('[data-close-congrats]').forEach(el=>el.addEventListener('click',(e)=>{
    if(e.target===el || el.tagName==='BUTTON'){ CONGRATS_TREE=null; render(); }
  }));

  /* ---- sharing ---- */
  app.querySelectorAll('[data-share-tree]').forEach(el=>el.addEventListener('click',()=>{
    EXPORT_TREE = el.dataset.shareTree; EXPORT_LINK = null;
    EXPORT_OPTS = {marks:false, notes:false};   // re-defaulted each time it's opened
    MODAL = 'export'; render();
  }));
  app.querySelectorAll('[data-export-opt]').forEach(el=>el.addEventListener('click',()=>{
    const k = el.dataset.exportOpt;
    EXPORT_OPTS[k] = !EXPORT_OPTS[k];
    EXPORT_LINK = null;                        // options changed, any built link is stale
    render();
  }));
  const expFile = app.querySelector('[data-export-file]');
  if(expFile) expFile.addEventListener('click', exportTreeAsFile);
  const expLink = app.querySelector('[data-export-link]');
  if(expLink) expLink.addEventListener('click', exportTreeAsLink);

  const importBtn = app.querySelector('[data-import-tree]');
  const importInput = app.querySelector('#import-file');
  if(importBtn && importInput){
    importBtn.addEventListener('click', ()=>importInput.click());
    importInput.addEventListener('change', async ()=>{
      const file = importInput.files && importInput.files[0];
      importInput.value = '';                  // so picking the same file twice still fires
      if(!file) return;
      let text = '';
      try{ text = await file.text(); }
      catch(_){ showToast('Не удалось прочитать файл.', 'error'); return; }
      openImportPreview(parseSharePayload(text));
    });
  }
  const doImport = app.querySelector('[data-do-import]');
  if(doImport) doImport.addEventListener('click', ()=>{
    const nameEl = document.getElementById('import-name');
    if(nameEl && IMPORT_DRAFT) IMPORT_DRAFT.name = nameEl.value;
    commitImport();
  });

  /* ---- notebook ---- */
  app.querySelectorAll('[data-open-notebook]').forEach(el=>el.addEventListener('click',()=>{
    goNotebook(el.dataset.openNotebook);
  }));
  const noteBackBtn = app.querySelector('[data-back-to-tree]');
  if(noteBackBtn) noteBackBtn.addEventListener('click',()=>{
    if(NOTEBOOK_TREE) openTree(NOTEBOOK_TREE); else goHome();
  });
  app.querySelectorAll('[data-reminder-notebook]').forEach(el=>el.addEventListener('click',()=>{
    const [tid,nid] = el.dataset.reminderNotebook.split('|');
    appendNodeLinkToNotebook(tid,nid);
    REMINDER = null;
    goNotebook(tid);
  }));
  bindNotebookEditor();

  /* Camera moves happen after the canvas exists, and replace the usual first-time
     centering so the two don't fight over TREE_ZOOM. */
  if(VIEW==='tree' && PENDING_FOCUS_NODE) focusNodeInTree();

  /* tree zoom/pan */
  // focusNodeInTree() already positioned the camera precisely; the generic centering
  // would immediately undo it, so it only runs when no focus request is pending.
  if(VIEW==='tree' && !TREE_ZOOM_READY && !PENDING_FOCUS_NODE){ centerTreeCanvas(); TREE_ZOOM_READY=true; }
  applyTreeZoom();
  app.querySelectorAll('[data-zoom]').forEach(el=>el.addEventListener('click',()=>{
    const action = el.dataset.zoom;
    if(action==='in') TREE_ZOOM.scale = Math.min(2.5, TREE_ZOOM.scale*1.25);
    else if(action==='out') TREE_ZOOM.scale = Math.max(0.4, TREE_ZOOM.scale/1.25);
    else { TREE_ZOOM = {scale:1,x:0,y:0}; centerTreeCanvas(); }
    applyTreeZoom();
  }));
  bindTreeZoomPan();
  bindNodeDrag();
}

// margin:auto only centers the canvas when it FITS inside the viewport; a tree wider
// than the screen instead sticks to the left edge (standard CSS behavior for an
// overflowing block), which can leave the root off-screen. Center it explicitly
// once, based on measured viewport/canvas width — this only moves the "camera" (pan
// offset), it never feeds back into the layout math itself.
function centerTreeCanvas(){
  const viewport = document.getElementById('tree-viewport');
  const canvas = document.getElementById('tree-canvas');
  if(!viewport || !canvas) return;
  TREE_ZOOM.x = (viewport.clientWidth - canvas.offsetWidth)/2;
}

const TREE_GRID_STEP = 26; // dot lattice pitch at scale 1, matches the CSS background-size

function applyTreeZoom(){
  const canvas = document.getElementById('tree-canvas');
  if(canvas) canvas.style.transform = `translate(${TREE_ZOOM.x}px, ${TREE_ZOOM.y}px) scale(${TREE_ZOOM.scale})`;

  // Keep the viewport's dot grid glued to the canvas. .tree has transform-origin:top
  // center, so under scale(s) its left edge lands at x + W*(1-s)/2 while its top edge is
  // just y — anchoring the lattice to that same point is what stops the dots sliding out
  // from under the nodes when zooming. Pure style writes, no layout reads (W is cached).
  const viewport = document.getElementById('tree-viewport');
  if(viewport){
    const s = TREE_ZOOM.scale, step = TREE_GRID_STEP*s;
    const bgX = TREE_ZOOM.x + TREE_CANVAS_W*(1-s)/2;
    viewport.style.backgroundSize = `${step}px ${step}px`;
    viewport.style.backgroundPosition = `${bgX}px ${TREE_ZOOM.y}px`;
  }
}

// Pinch-to-zoom + drag-to-pan on touch, drag-to-pan + Ctrl+wheel-to-zoom on desktop.
// Rebound on every render() since the viewport element is recreated each time.
function bindTreeZoomPan(){
  const viewport = document.getElementById('tree-viewport');
  if(!viewport) return;
  const pointers = new Map();
  let dragging = false, startX = 0, startY = 0, startTX = 0, startTY = 0;
  let pinchStartDist = 0, pinchStartScale = 1;

  viewport.addEventListener('pointerdown',(e)=>{
    if(e.target.closest('button, input, textarea, a, form, .node-draggable')) return; // let controls and node drag behave normally
    viewport.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(pointers.size===1){
      dragging = true; startX=e.clientX; startY=e.clientY; startTX=TREE_ZOOM.x; startTY=TREE_ZOOM.y;
    }else if(pointers.size===2){
      dragging = false;
      const pts = [...pointers.values()];
      pinchStartDist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y) || 1;
      pinchStartScale = TREE_ZOOM.scale;
    }
  });
  viewport.addEventListener('pointermove',(e)=>{
    if(!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(pointers.size===2){
      const pts = [...pointers.values()];
      const dist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
      TREE_ZOOM.scale = Math.min(2.5, Math.max(0.4, pinchStartScale * dist/pinchStartDist));
      applyTreeZoom();
    }else if(dragging && pointers.size===1){
      TREE_ZOOM.x = startTX + (e.clientX-startX);
      TREE_ZOOM.y = startTY + (e.clientY-startY);
      applyTreeZoom();
    }
  });
  const endPointer = (e)=>{
    pointers.delete(e.pointerId);
    dragging = pointers.size===1;
    if(dragging){
      const [p] = pointers.values();
      startX=p.x; startY=p.y; startTX=TREE_ZOOM.x; startTY=TREE_ZOOM.y;
    }
  };
  viewport.addEventListener('pointerup', endPointer);
  viewport.addEventListener('pointercancel', endPointer);
  viewport.addEventListener('wheel',(e)=>{
    if(!e.ctrlKey) return; // plain wheel/trackpad scroll is left alone; Ctrl+wheel zooms
    e.preventDefault();
    const factor = e.deltaY<0 ? 1.1 : 0.9;
    TREE_ZOOM.scale = Math.min(2.5, Math.max(0.4, TREE_ZOOM.scale*factor));
    applyTreeZoom();
  }, {passive:false});
}

let NODE_DRAG = null; // {pointerId, el, nodeId, startClientX, startClientY, startLeft, startTop, dragging}
const DRAG_THRESHOLD = 7; // px of on-screen pointer movement before a press counts as a drag, not a click

// Any node (except root) can be picked up and moved anywhere on the canvas. Rebound
// on every render() since nodes are recreated each time.
function bindNodeDrag(){
  document.querySelectorAll('.node-draggable').forEach(el=>{
    el.addEventListener('pointerdown', onNodeDragStart);
  });
}

function onNodeDragStart(e){
  if(e.target.closest('.icon-act, .leaf-toggle, input, textarea, form')) return; // let those controls click normally
  const el = e.currentTarget;
  NODE_DRAG = {
    pointerId: e.pointerId, el, nodeId: el.dataset.nodeid,
    startClientX: e.clientX, startClientY: e.clientY,
    startLeft: parseFloat(el.style.left), startTop: parseFloat(el.style.top),
    startRawX: parseFloat(el.dataset.rawx), startRawY: parseFloat(el.dataset.rawy),
    dragging: false
  };
  // Pointer capture is deliberately NOT taken here. Capturing on pointerdown retargets
  // the follow-up compatibility `click` to this element, so it would never reach the
  // buttons inside the card. It's taken in onNodeDragMove instead, once we know this is
  // really a drag. Listening on window (not el) means a fast pointer that outruns the
  // node before the threshold is crossed still gets tracked.
  window.addEventListener('pointermove', onNodeDragMove);
  window.addEventListener('pointerup', onNodeDragEnd);
  window.addEventListener('pointercancel', onNodeDragEnd);
}

function onNodeDragMove(e){
  if(!NODE_DRAG || e.pointerId!==NODE_DRAG.pointerId) return;
  const dx = e.clientX - NODE_DRAG.startClientX;
  const dy = e.clientY - NODE_DRAG.startClientY;
  if(!NODE_DRAG.dragging){
    if(Math.hypot(dx,dy) < DRAG_THRESHOLD) return;
    NODE_DRAG.dragging = true;
    NODE_DRAG.el.classList.add('dragging');
    // Now that it's unambiguously a drag, capture so the node keeps following a pointer
    // that leaves it — and suppressing the resulting click is intended from here on.
    try{ NODE_DRAG.el.setPointerCapture(e.pointerId); }catch(_){}
  }
  const scale = TREE_ZOOM.scale;
  const left = NODE_DRAG.startLeft + dx/scale;
  const top = NODE_DRAG.startTop + dy/scale;
  NODE_DRAG.el.style.left = left+'px';
  NODE_DRAG.el.style.top = top+'px';
  updateEdgesForNode(NODE_DRAG.nodeId, left, top);
}

function onNodeDragEnd(e){
  if(!NODE_DRAG || e.pointerId!==NODE_DRAG.pointerId) return;
  const {el, nodeId, dragging} = NODE_DRAG;
  window.removeEventListener('pointermove', onNodeDragMove);
  window.removeEventListener('pointerup', onNodeDragEnd);
  window.removeEventListener('pointercancel', onNodeDragEnd);
  if(dragging){
    el.classList.remove('dragging');
    // a drag shouldn't also fire the click that opens a dot's popover
    const suppressClick = (ev)=>{ ev.preventDefault(); ev.stopPropagation(); };
    el.addEventListener('click', suppressClick, {capture:true, once:true});
    // Raw-space delta, not "screen position minus this render's offset": moving a node
    // can shift its own unpositioned ancestors (they re-center on their children), which
    // shifts the whole canvas's bounding box and thus next render's offset — converting
    // through a soon-to-be-stale offset would land the node somewhere else than dropped.
    const scale = TREE_ZOOM.scale;
    const dx = (e.clientX - NODE_DRAG.startClientX)/scale;
    const dy = (e.clientY - NODE_DRAG.startClientY)/scale;
    const tree = findTree(CURRENT_TREE);
    const node = findNode(tree.root, nodeId);
    node.pos = { x: NODE_DRAG.startRawX + dx, y: NODE_DRAG.startRawY + dy };
    save();
    render();
  }
  NODE_DRAG = null;
}

// Moves just the two anchor points touched by a node's current drag — the edge to its
// parent (fixed at the parent's end) and the edges to its own children (fixed at each
// child's end) — instead of rebuilding the whole line layer on every pointermove.
function updateEdgesForNode(nodeId,left,top){
  const cxNode = left + TREE_COL_WIDTH/2;
  const ayNode = nodeAnchorY(top); // same anchor rule renderTreeCanvas uses

  const incoming = document.querySelector(`.tree-lines path[data-to="${nodeId}"]`);
  if(incoming) incoming.setAttribute('d', bezierD(incoming.dataset.x1, incoming.dataset.y1, cxNode, ayNode));
  document.querySelectorAll(`.tree-lines path[data-from="${nodeId}"]`).forEach(p=>{
    p.setAttribute('d', bezierD(cxNode, ayNode, p.dataset.x2, p.dataset.y2));
  });
}

/* ---- notebook editor wiring ----
   Formatting runs through document.execCommand. It is formally deprecated, but every
   browser still implements it and it is the only way to get rich-text editing in a
   project with no build step and no dependencies — which is a deliberate constraint here,
   not an oversight. If it ever does disappear, the replacement is a real editor library,
   which would mean introducing bundling. */
function bindNotebookEditor(){
  const ed = document.getElementById('note-editor');
  if(!ed) return;
  const toolbar = document.getElementById('note-toolbar');

  const scheduleSave = ()=>{
    clearTimeout(NOTE_SAVE_TIMER);
    // Autosave never re-renders: doing so would wipe the caret out from under the typist.
    NOTE_SAVE_TIMER = setTimeout(()=>{
      const tree = findTree(NOTEBOOK_TREE);
      if(!tree) return;
      const html = sanitizeNotebook(ed.innerHTML);
      if((ed.textContent || '').length > NOTE_MAX_CHARS){
        showToast('Достигнут предел блокнота — дальше текст не сохранится. Сократите заметки.', 'error');
      }
      if(tree.notebook !== html){ tree.notebook = html; save(); }
    }, 500);
  };

  const syncToolbar = ()=>{
    if(!toolbar) return;
    toolbar.querySelectorAll('[data-fmt]').forEach(b=>{
      const cmd = b.dataset.fmt;
      let on = false;
      try{
        on = cmd === 'formatBlock'
          ? /h2/i.test(document.queryCommandValue('formatBlock') || '')
          : document.queryCommandState(cmd);
      }catch(_){}
      b.classList.toggle('active', !!on);
    });
  };

  if(toolbar){
    toolbar.querySelectorAll('[data-fmt]').forEach(b=>{
      // mousedown+preventDefault, never click: a click would move focus to the button
      // first, collapsing the very selection the command is supposed to act on.
      b.addEventListener('mousedown',(e)=>{
        e.preventDefault();
        const cmd = b.dataset.fmt;
        ed.focus();
        try{
          if(cmd === 'formatBlock'){
            const isH = /h2/i.test(document.queryCommandValue('formatBlock') || '');
            document.execCommand('formatBlock', false, isH ? 'div' : 'h2');
          }else{
            document.execCommand(cmd, false, null);
          }
        }catch(_){}
        syncToolbar();
        scheduleSave();
      });
    });
    const linkBtn = toolbar.querySelector('[data-insert-link]');
    if(linkBtn) linkBtn.addEventListener('mousedown',(e)=>{
      e.preventDefault();
      stashNoteRange();   // captured while the editor is still focused
      openNodePicker();
    });
  }

  ed.addEventListener('input', ()=>{ scheduleSave(); syncToolbar(); });
  ed.addEventListener('keyup', syncToolbar);
  ed.addEventListener('mouseup', syncToolbar);
  ed.addEventListener('blur', ()=>{ stashNoteRange(); flushNotebook(); });

  // Paste is the one place arbitrary markup can enter, so it is rebuilt from a sanitized
  // fragment rather than letting the browser insert whatever was on the clipboard.
  ed.addEventListener('paste',(e)=>{
    e.preventDefault();
    const dt = e.clipboardData;
    if(!dt) return;
    const raw = dt.getData('text/html') || esc(dt.getData('text/plain') || '').replace(/\n/g,'<br>');
    const clean = sanitizeNotebook(raw);
    const tpl = document.createElement('template'); tpl.innerHTML = clean;
    const addedLen = (tpl.content.textContent || '').length;
    if((ed.textContent || '').length + addedLen > NOTE_MAX_CHARS){
      showToast('Вставка не поместится: блокнот ограничен ' + NOTE_MAX_CHARS.toLocaleString('ru-RU') + ' символами.', 'error');
      return;
    }
    try{ document.execCommand('insertHTML', false, clean); }catch(_){}
    scheduleSave();
  });

  // A node link is one indivisible object: contenteditable="false" keeps the caret out,
  // so Backspace removes the whole thing, and a plain tap navigates instead of editing.
  // There are no modifier keys on a phone, so tap-to-follow is the only workable choice.
  ed.addEventListener('click',(e)=>{
    const a = e.target.closest('a[data-nodelink]');
    if(!a) return;
    e.preventDefault();
    const id = a.getAttribute('data-nodelink');
    const tree = findTree(NOTEBOOK_TREE);
    if(!tree || !findNode(tree.root, id)){
      showToast('Задание удалено — переходить некуда.');
      return;
    }
    flushNotebook();
    PENDING_FOCUS_NODE = {treeId: NOTEBOOK_TREE, nodeId: id};
    openTree(NOTEBOOK_TREE);
  });

  syncToolbar();
}

function stashNoteRange(){
  const sel = window.getSelection();
  const ed = document.getElementById('note-editor');
  if(sel && sel.rangeCount && ed && ed.contains(sel.anchorNode)){
    NOTE_SAVED_RANGE = sel.getRangeAt(0).cloneRange();
  }
}

function insertNodeLink(nodeId){
  const tree = findTree(NOTEBOOK_TREE);
  const node = tree && findNode(tree.root, nodeId);
  closeNodePicker();
  const ed = document.getElementById('note-editor');
  if(!tree || !node || !ed) return;
  ed.focus();
  // The editor was never re-rendered, so the stashed range still points at live nodes.
  const sel = window.getSelection();
  sel.removeAllRanges();
  if(NOTE_SAVED_RANGE && ed.contains(NOTE_SAVED_RANGE.startContainer)){
    sel.addRange(NOTE_SAVED_RANGE);
  }else{
    const r = document.createRange(); r.selectNodeContents(ed); r.collapse(false); sel.addRange(r);
  }
  // Only the id is stored; the label is re-resolved from the node on every open.
  const html = `<a class="node-link" data-nodelink="${esc(node.id)}" contenteditable="false">${esc(node.text)}</a>&nbsp;`;
  try{ document.execCommand('insertHTML', false, html); }catch(_){}
  flushNotebook();
}

// Appends rather than replaces: the reminder must never overwrite what's already written.
function appendNodeLinkToNotebook(treeId,nodeId){
  const tree = findTree(treeId);
  const node = tree && findNode(tree.root, nodeId);
  if(!tree || !node) return;
  const link = `<div><a class="node-link" data-nodelink="${esc(node.id)}" contenteditable="false">${esc(node.text)}</a>&nbsp;</div>`;
  tree.notebook = sanitizeNotebook((tree.notebook || '') + link);
  save();
}

/* Aims the camera so the node sits in the middle of the viewport. Everything comes from
   the numbers renderTreeCanvas() cached — no per-node DOM measuring, which is a standing
   rule in this file (see the note above computeTreeLayout). */
function focusNodeInTree(){
  const req = PENDING_FOCUS_NODE;
  PENDING_FOCUS_NODE = null;
  if(!req) return;
  const viewport = document.getElementById('tree-viewport');
  const el = document.querySelector(`.node-pos[data-nodeid="${req.nodeId}"]`);
  if(!viewport || !el){ showToast('Задание удалено — переходить некуда.'); return; }

  const rawX = parseFloat(el.dataset.rawx), rawY = parseFloat(el.dataset.rawy);
  const cx = rawX + TREE_CANVAS_OFF.x;                     // node centre, canvas space
  const cy = rawY + TREE_CANVAS_OFF.y + TREE_CARD_MAX_H/2;
  const s = 1;                                             // predictable scale on arrival
  // Inverse of the transform in applyTreeZoom(): with transform-origin top center the
  // canvas's left edge lands at x + W*(1-s)/2 and its top edge at y.
  TREE_ZOOM = {
    scale: s,
    x: viewport.clientWidth/2  - TREE_CANVAS_W*(1-s)/2 - cx*s,
    y: viewport.clientHeight/2 - cy*s
  };
  TREE_ZOOM_READY = true;
  applyTreeZoom();

  el.classList.add('node-focused');
  clearTimeout(HIGHLIGHT_NODE);
  HIGHLIGHT_NODE = setTimeout(()=>{ el.classList.remove('node-focused'); }, 2400);
}

/* ---- share/import actions ---- */

async function exportTreeAsFile(){
  const t = findTree(EXPORT_TREE);
  if(!t) return;
  const json = JSON.stringify(serializeTreeForShare(t, EXPORT_OPTS), null, 2);
  const fname = shareFileName(t.name);
  // On a phone this opens the system sheet (Telegram/WhatsApp/mail), which is exactly the
  // handover we want; everywhere else it falls back to a plain download.
  try{
    const file = new File([json], fname, {type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[file]}) && navigator.share){
      await navigator.share({files:[file], title:t.name});
      return;
    }
  }catch(e){
    if(e && e.name === 'AbortError') return;   // user dismissed the sheet
  }
  try{
    const url = URL.createObjectURL(new Blob([json], {type:'application/json'}));
    const a = document.createElement('a');
    a.href = url; a.download = fname;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
    showToast('Файл сохранён: ' + fname);
  }catch(_){ showToast('Не удалось сохранить файл.', 'error'); }
}

async function exportTreeAsLink(){
  const t = findTree(EXPORT_TREE);
  if(!t) return;
  const link = await buildShareLink(serializeTreeForShare(t, EXPORT_OPTS));
  if(link.length > SHARE_LINK_MAX){
    // Truncated links are worse than no link: they look valid and fail on the far side.
    showToast('Дерево слишком большое для ссылки — отправьте файлом.', 'error');
    return;
  }
  EXPORT_LINK = link;
  try{
    await navigator.clipboard.writeText(link);
    showToast('Ссылка скопирована. Вставьте её в сообщение.');
  }catch(_){
    showToast('Не удалось скопировать автоматически — ссылка показана ниже.');
    render();
  }
}

function openImportPreview(parsed){
  if(!parsed || parsed.error){
    showToast((parsed && parsed.error) || 'Не удалось прочитать данные.', 'error');
    return;
  }
  IMPORT_DRAFT = Object.assign({}, parsed, {name: clampStr(parsed.payload.tree.name, SHARE_LIM.name) || 'Импортированное дерево'});
  MODAL = 'import';
  render();
}

// Nothing is written until the user confirms, and a failed save() rolls the whole thing
// back rather than leaving a half-applied import behind.
function commitImport(){
  const d = IMPORT_DRAFT;
  if(!d) return;
  let tree;
  try{ tree = buildTreeFromPayload(d.payload, d.name); }
  catch(_){ showToast('Не удалось разобрать дерево из файла.', 'error'); return; }

  DATA.trees.push(tree);
  if(!save()){
    DATA.trees.pop();                          // save() already explained why it failed
    return;
  }
  IMPORT_DRAFT = null; MODAL = null;
  openTree(tree.id);
  showToast('Дерево «' + tree.name + '» добавлено.');
}

/* A link opened from a messenger carries the tree in the fragment. It is consumed once:
   the hash is cleared immediately so a reload can't import a second copy and someone
   else's data doesn't linger in the address bar. */
async function checkShareHash(){
  const hash = location.hash;
  if(!hash || !hash.startsWith(SHARE_HASH_PREFIX)) return;
  history.replaceState(null, '', location.pathname + location.search);
  openImportPreview(await readShareHash(hash));
}

function confirmSafe(msg){ try{ return window.confirm(msg); }catch(e){ return true; } }

// Host that WebViewAssetLoader serves the bundled copy from inside the Android APK.
const ANDROID_ASSET_HOST = 'appassets.androidplatform.net';

// Only works over http(s) (registration is a no-op on file://, which is fine — the app is
// fully self-contained and already works offline via localStorage).
//
// Inside the APK it's deliberately skipped: the loader serves over https, so the protocol
// check alone would pass and the worker would install. It isn't needed there — the files
// are already local — and it would actively hurt, because its cache outlives an app
// update and would keep serving the previous build's UI after the user installs a new APK.
if('serviceWorker' in navigator && location.protocol.startsWith('http')
   && location.hostname !== ANDROID_ASSET_HOST){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(e=>console.error('SW registration failed', e));
  });
}

load();
</script>
